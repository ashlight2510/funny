<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기사 읽어주는 남자</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="blog-header">
    <div class="blog-header-inner">
      <a href="../">기사 읽어주는 남자</a>
    </div>
  </header>
  <main class="blog-main">
    <div id="article-root">
      <p class="comments-loading">기사 불러오는 중…</p>
    </div>
  </main>
  <footer class="blog-footer">기사 읽어주는 남자 · 정적 블로그</footer>
  <script>
window.BLOG_API_URL = '';
(function() {
  var DATA = '../data/';
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var root = document.getElementById('article-root');
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  if (!id) {
    location.replace('../');
    return;
  }
  fetch(DATA + 'manifest.json')
    .then(function(r) { return r.json(); })
    .then(function(manifest) {
      var idx = -1;
      for (var i = 0; i < (manifest.chunks || []).length; i++) {
        if (manifest.chunks[i].ids.indexOf(id) !== -1) { idx = i; break; }
      }
      if (idx < 0) throw new Error('글을 찾을 수 없습니다.');
      return fetch(DATA + manifest.chunks[idx].file).then(function(r) { return r.json(); });
    })
    .then(function(items) {
      var item = items.find(function(x) { return x.id === id; });
      if (!item) throw new Error('글을 찾을 수 없습니다.');
      var date = item.createdAt ? new Date(item.createdAt).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
      var meta = date;
      if (item.sourcePublisher) meta += ' · ' + item.sourcePublisher;
      if (item.sourceUrl) meta += ' · <a href="' + esc(item.sourceUrl) + '" target="_blank" rel="noopener noreferrer">원문 보기</a>';
      document.title = item.title + ' | 기사 읽어주는 남자';
      root.innerHTML = '<a class="back-link" href="../">← 목록으로</a>' +
        '<article class="article-single">' +
        '<h1 class="title">' + esc(item.title) + '</h1>' +
        '<div class="meta">' + meta + '</div>' +
        '<div class="article-body">' + item.bodyHtml + '</div>' +
        '</article>' +
        '<section class="comments-section" id="comments-section" data-article-id="' + esc(item.id) + '">' +
        '<h3>댓글</h3>' +
        '<p class="comments-loading" id="comments-loading">댓글 불러오는 중…</p>' +
        '<p class="comments-error" id="comments-error" style="display:none;"></p>' +
        '<ul class="comments-list" id="comments-list"></ul>' +
        '<form class="comment-form" id="comment-form" style="display:none;">' +
        '<div class="form-row"><label for="comment-author">이름 (선택, 기본 익명)</label><input type="text" id="comment-author" placeholder="익명" maxlength="50"></div>' +
        '<div class="form-row"><label for="comment-text">댓글</label><textarea id="comment-text" placeholder="댓글을 입력하세요." maxlength="2000" required></textarea></div>' +
        '<div class="submit-row"><button type="submit" class="btn primary">등록</button></div>' +
        '</form>' +
        '<p id="comments-no-api" style="display:none; color: var(--muted); font-size: .875rem;">댓글 서버가 설정되지 않았습니다.</p>' +
        '</section>';
      var api = window.BLOG_API_URL || '';
      var section = document.getElementById('comments-section');
      var articleId = section && section.dataset.articleId;
      var loading = document.getElementById('comments-loading');
      var errorEl = document.getElementById('comments-error');
      var listEl = document.getElementById('comments-list');
      var form = document.getElementById('comment-form');
      var noApi = document.getElementById('comments-no-api');
      if (!api) {
        if (loading) loading.style.display = 'none';
        if (noApi) noApi.style.display = 'block';
        return;
      }
      function loadComments() {
        if (!articleId) return;
        loading.style.display = 'block';
        errorEl.style.display = 'none';
        fetch(api + '/api/blog-comments?articleId=' + encodeURIComponent(articleId))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            loading.style.display = 'none';
            var comments = data.comments || [];
            listEl.innerHTML = '';
            comments.forEach(function(c) {
              var li = document.createElement('li');
              var d = c.createdAt ? new Date(c.createdAt).toLocaleString('ko-KR') : '';
              li.innerHTML = '<div class="comment-meta">' + esc(c.author) + ' · ' + esc(d) + '</div><div class="comment-text">' + esc(c.text) + '</div>';
              listEl.appendChild(li);
            });
            if (form) form.style.display = 'block';
          })
          .catch(function() {
            loading.style.display = 'none';
            errorEl.textContent = '댓글을 불러오지 못했습니다.';
            errorEl.style.display = 'block';
            if (form) form.style.display = 'block';
          });
      }
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var author = (document.getElementById('comment-author').value || '').trim() || '익명';
          var text = (document.getElementById('comment-text').value || '').trim();
          if (!text) return;
          var btn = form.querySelector('button[type="submit"]');
          if (btn) { btn.disabled = true; btn.textContent = '등록 중…'; }
          fetch(api + '/api/blog-comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ articleId: articleId, author: author, text: text })
          })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.error) throw new Error(data.error);
              document.getElementById('comment-text').value = '';
              if (btn) { btn.disabled = false; btn.textContent = '등록'; }
              loadComments();
            })
            .catch(function(err) {
              if (btn) { btn.disabled = false; btn.textContent = '등록'; }
              errorEl.textContent = err.message || '등록 실패';
              errorEl.style.display = 'block';
            });
        });
      }
      loadComments();
    })
    .catch(function(err) {
      root.innerHTML = '<p class="comments-error">' + esc(err.message || '글을 불러올 수 없습니다.') + '</p><a class="back-link" href="../">← 목록으로</a>';
    });
})();
  </script>
</body>
</html>
