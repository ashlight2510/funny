  <body>
    <div class="container">
      <header>
        <h1 class="title" data-i18n="title">지금날씨</h1>
        <div class="lang-switch" role="tablist" aria-label="Language switcher">
          <button type="button" data-lang="ko" class="active">한국어</button>
          <button type="button" data-lang="en">English</button>
        </div>
        <div class="location-info">
          <span id="location">위치 확인 중...</span>
          <button
            id="refresh-btn"
            class="refresh-btn"
            aria-label="새로고침"
            data-i18n-aria="refreshAria"
          >
            🔄
          </button>
        </div>
      </header>

      <main>
        <div class="weather-card main-card">
          <div class="temperature-section">
            <div class="temp-main" id="temperature">--</div>
            <div class="temp-unit">°C</div>
          </div>
          <div class="weather-icon" id="weather-icon">☀️</div>
          <div class="weather-desc" id="weather-desc">--</div>
        </div>

        <div class="info-grid">
          <div class="weather-card info-card">
            <div class="info-label" data-i18n="labelFeelsLike">체감온도</div>
            <div class="info-value" id="feels-like">--°C</div>
          </div>

          <div class="weather-card info-card">
            <div class="info-label" data-i18n="labelPm10">미세먼지</div>
            <div class="info-value" id="pm10">
              <span class="value">--</span>
              <span class="unit">µg/m³</span>
            </div>
            <div class="info-status" id="pm10-status">--</div>
          </div>

          <div class="weather-card info-card">
            <div class="info-label" data-i18n="labelPm25">초미세먼지</div>
            <div class="info-value" id="pm25">
              <span class="value">--</span>
              <span class="unit">µg/m³</span>
            </div>
            <div class="info-status" id="pm25-status">--</div>
          </div>

          <div class="weather-card info-card">
            <div class="info-label" data-i18n="labelUv">자외선</div>
            <div class="info-value" id="uv-index">--</div>
            <div class="info-status" id="uv-status">--</div>
          </div>
        </div>

        <!-- 외출 지수 요약 -->
        <div class="weather-card tip-card" id="tip-card" style="display: none">
          <div class="tip-content" id="tip-content">--</div>
        </div>

        <!-- 이웃 동네 비교 -->
        <div
          class="weather-card compare-section"
          id="compare-section"
          style="display: none"
        >
          <div class="compare-title" data-i18n="compareTitle">
            📍 주변 비교
          </div>
          <div class="compare-list" id="compare-list"></div>
        </div>
      </main>

      <div class="share-section">
        <button id="share-btn" class="share-btn" data-i18n="btnShare">
          공유하기 📤
        </button>
        <button id="share-image-btn" class="share-btn secondary">
          <span data-i18n="btnShareImage">이미지로 공유 🖼️</span>
        </button>
      </div>

      <!-- 이미지 생성용 숨김 캔버스 -->
      <canvas id="share-canvas" style="display: none"></canvas>

      <footer>

            >AshLight</a

        </p>
      </footer>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p data-i18n="loadingText">날씨 정보를 불러오는 중...</p>
    </div>

    <script src="script.js"></script>

    <script>
      (function () {
        "use strict";
        const targetUrl = "https://funnyfunny.cloud/";
        function addMoreTestsButton() {
          if (document.getElementById("more-tests-btn")) return;
          const moreBtn = document.createElement("button");
          moreBtn.id = "more-tests-btn";
          moreBtn.type = "button";
          moreBtn.dataset.url = targetUrl;
          moreBtn.textContent =
            window.weatherI18n?.t?.("moreTests") || "더 많은 테스트 해보기";
          moreBtn.className = "more-tests-btn";
          moreBtn.addEventListener("click", function () {
            window.open(targetUrl, "_blank", "noopener");
          });
          const shareSection = document.querySelector(".share-section");
          if (shareSection) {
            shareSection.insertAdjacentElement("afterend", moreBtn);
          } else if (document.body) {
            document.body.appendChild(moreBtn);
          }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", addMoreTestsButton);
        } else {
          addMoreTestsButton();
        }
      })();
    </script>
