<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>실업급여·구직급여 계산기 | 고용보험 | FunnyFunny Cloud</title>
    <meta name="description" content="퇴직 전 급여·근속 기간을 입력하면 실업급여 수급 기간·일액 참고치를 계산합니다. 무료 실업급여 계산기." />
    <meta property="og:title" content="실업급여·구직급여 계산기 | FunnyFunny Cloud" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/unemployment/" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/unemployment/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #2563eb; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
      .result-item .v { font-weight: 700; color: var(--accent); }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">📋</div>
          <div>
            <h1>실업급여·구직급여 계산기</h1>
            <p class="sub">퇴직 전 급여·근속으로 수급 기간·일액 참고</p>
          </div>
        </div>
      </header>
      <div class="panel">
        <h3>입력</h3>
        <div class="field">
          <label>퇴직 전 평균 월급 (원) — 세전</label>
          <input type="number" id="wage" min="0" step="10000" value="3000000" />
        </div>
        <div class="field">
          <label>고용보험 가입 기간 (개월)</label>
          <input type="number" id="months" min="6" max="600" value="36" />
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>수급 기간 (일)</span><span class="v" id="days"></span></div>
          <div class="result-item"><span>일급 상한 (참고)</span><span class="v" id="dailyCap"></span></div>
          <div class="result-item"><span>일급 대략 (급여의 60% 기준)</span><span class="v" id="daily"></span></div>
          <p class="note">실제 일급·수급기간은 고용보험공단 기준에 따릅니다. 2024년 일급 상한 약 67,812원. 정확한 금액은 공단에 문의하세요.</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/unemployment-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/severance/">퇴직금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>
    <script>
      (function(){
        function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
        var wage = document.getElementById("wage");
        var months = document.getElementById("months");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var daysEl = document.getElementById("days");
        var dailyCapEl = document.getElementById("dailyCap");
        var dailyEl = document.getElementById("daily");
        var DAY_CAP = 67812;
        btnCalc.addEventListener("click", function(){
          var w = parseFloat(wage.value) || 0;
          var m = parseInt(months.value, 10) || 12;
          if (w <= 0 || m < 6) { result.classList.remove("show"); return; }
          var days = 90;
          if (m >= 12) days = 120;
          if (m >= 18) days = 150;
          if (m >= 24) days = 180;
          if (m >= 36) days = 210;
          if (m >= 48) days = 240;
          if (m >= 60) days = 270;
          var dailyWage = w / 30;
          var daily60 = Math.min(dailyWage * 0.6, DAY_CAP);
          daysEl.textContent = days + "일";
          dailyCapEl.textContent = fmt(DAY_CAP);
          dailyEl.textContent = fmt(daily60) + "/일";
          result.classList.add("show");
        });
        document.getElementById("btnShare").addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById("tool-share-toast").textContent = "복사했어요"; document.getElementById("tool-share-toast").style.display = "inline"; setTimeout(function(){ document.getElementById("tool-share-toast").style.display = "none"; }, 1500); });
        });
      })();
    </script>
  </body>
</html>
