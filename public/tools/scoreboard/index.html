<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스코어보드 | 팀별 점수 +/- | FunnyFunny Cloud</title>
  <meta name="description" content="팀 이름과 점수를 입력하고 +/- 버튼으로 점수를 더하거나 뺍니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/scoreboard/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#22c55e;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#16a34a,#22c55e);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;margin-bottom:12px;}
    .row input[type="text"]{padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b1220;color:var(--text);}
    .score{font-size:24px;font-weight:700;min-width:3ch;}
    .btn-sm{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600;}
    .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; } .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }

  </style>
    <meta name="description" content="팀별 점수 +/-." />
    <meta property="og:title" content="스코어보드" />
    <meta property="og:description" content="팀별 점수 +/-." />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/scoreboard/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="스코어보드" />
    <meta name="twitter:description" content="팀별 점수 +/-." />
    <meta name="twitter:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />

  </head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">📊</div><div><h1>스코어보드</h1><p class="sub">팀별 점수 +/-</p></div></div></header>
    <div class="panel">
      <div class="row"><input type="text" id="nameA" value="A팀" placeholder="팀명" /><span class="score" id="scoreA">0</span><button type="button" class="btn-sm" id="plusA" style="background:#22c55e;">+1</button><button type="button" class="btn-sm btn-ghost" id="minusA">-1</button></div>
      <div class="row"><input type="text" id="nameB" value="B팀" placeholder="팀명" /><span class="score" id="scoreB">0</span><button type="button" class="btn-sm" id="plusB" style="background:#22c55e;">+1</button><button type="button" class="btn-sm btn-ghost" id="minusB">-1</button></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/scoreboard-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/life-counter/">생명 카운터</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn-sm btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){ var sA=0,sB=0; var scoreA=document.getElementById("scoreA"), scoreB=document.getElementById("scoreB");
  document.getElementById("plusA").addEventListener("click",function(){ sA++; scoreA.textContent=sA; });
  document.getElementById("minusA").addEventListener("click",function(){ sA=Math.max(0,sA-1); scoreA.textContent=sA; });
  document.getElementById("plusB").addEventListener("click",function(){ sB++; scoreB.textContent=sB; });
  document.getElementById("minusB").addEventListener("click",function(){ sB=Math.max(0,sB-1); scoreB.textContent=sB; });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
