    <!-- Script -->
    <script>
      /* i18n */
      const translations = {
        ko: {
          metaTitle: "오늘의 나, 잘했다",
          metaDescription: "오늘 하루, 내가 잘한 단 하나를 기록하세요. 긍정을 강요하지 않는 1줄 기록 서비스.",
          headerTitle: "🌱 오늘의 나, 잘했다",
          viewMore: "다른 서비스 보기 →",
          heroTitle: "오늘,<br />내가 잘한 건 뭐였을까?",
          heroSubtitle: "거창하지 않아도 괜찮아요.<br />단 하나면 충분합니다.",
          inputPlaceholder: "예: 오늘은 버티기라도 했다",
          saveButton: "오늘의 나 기록하기",
          savedMessage: "✨ 오늘의 기록이 저장됐어요.",
          footer: "© 2025 오늘의 나, 잘했다"
        },
        en: {
          metaTitle: "Today, I Did Well",
          metaDescription: "Record one thing you did well today. A simple one-line journal service without forced positivity.",
          headerTitle: "🌱 Today, I Did Well",
          viewMore: "View other services →",
          heroTitle: "Today,<br />What did I do well?",
          heroSubtitle: "It doesn't have to be grand.<br />One thing is enough.",
          inputPlaceholder: "e.g., I at least held on today",
          saveButton: "Record today",
          savedMessage: "✨ Today's record has been saved.",
          footer: "© 2025 Today, I Did Well"
        }
      };
      const defaultLang = "ko";
      const supportedLangs = ["ko", "en"];
      let currentLang = defaultLang;
      function t(key, vars = {}) {
        const langTable = translations[currentLang] || translations.ko;
        const template = langTable?.[key] ?? translations.ko?.[key] ?? key;
        if (typeof template !== "string") return template;
        return template.replace(/\{(\w+)\}/g, (_, token) =>
          vars[token] !== undefined ? vars[token] : `{${token}}`
        );
      }
      function applyTranslations() {
        document.title = t("metaTitle");
        const desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute("content", t("metaDescription"));
        document.documentElement.lang = currentLang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.dataset.i18n;
          const value = t(key);
          if (key === "heroTitle" || key === "heroSubtitle") {
            el.innerHTML = value;
          } else {
            el.textContent = value;
          }
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          el.placeholder = t(el.dataset.i18nPlaceholder);
        });
      }
      function setLang(lang, options = {}) {
        const nextLang = translations[lang] ? lang : defaultLang;
        currentLang = nextLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === nextLang);
        });
        applyTranslations();
        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
      }
      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const paramLang = params.get("lang");
        if (supportedLangs.includes(paramLang)) return paramLang;
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) return stored;
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }
      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          setLang(button.dataset.lang, { updateUrl: true });
        });
      });
      setLang(detectLang(), { updateUrl: false });

      const input = document.getElementById("input");
      const btn = document.getElementById("saveBtn");
      const msg = document.getElementById("savedMsg");

      const today = new Date().toISOString().slice(0, 10);
      const key = `good-${today}`;

      const saved = localStorage.getItem(key);
      if (saved) {
        input.value = JSON.parse(saved).text;
        msg.classList.remove("hidden");
      }

      btn.addEventListener("click", () => {
        const text = input.value.trim();
        if (!text) return;

        localStorage.setItem(key, JSON.stringify({ text, date: today }));

        msg.classList.remove("hidden");
      });
    </script>
