<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전기요금 계산기 | 한달 전기세 예상 | FunnyFunny Cloud</title>

    <meta property="og:image" content="https://dummyimage.com/1200x630/0b1220/ffffff&text=Electric+Bill" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/electric/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230b1220'/><path d='M32 14v12l10 6-10 6v12l18-24H32' stroke='%23fbbf24' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #fbbf24; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #b45309 0%, #f59e0b 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #0b1220; }
      .btn:hover { filter: brightness(1.1); }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-big { font-size: 26px; font-weight: 800; color: var(--accent); margin: 12px 0; }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      #tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">⚡</div>
          <div>
            <h1>전기요금 계산기</h1>
            <p class="sub">사용량(kWh)으로 한달 전기요금 예상 계산 (주택용 누진제)</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>사용량 입력</h3>
        <div class="field">
          <label>이번 달 사용량 (kWh)</label>
          <input type="number" id="kwh" min="0" step="1" placeholder="예: 350" value="300" />
        </div>
        <div class="field">
          <label>계절 구분</label>
          <select id="season">
            <option value="normal">기타 (1~6, 9~12월) — 200/400kWh 구간</option>
            <option value="summer">하계 (7~8월) — 300/450kWh 구간</option>
          </select>
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div>예상 전기요금 (세전)</div>
          <div class="result-big" id="billTotal"></div>
          <p class="note">기본요금+전력량요금만 반영한 참고용입니다. 실제 청구액에는 부가세·기후환경요금·연료비조정요금 등이 더해져 다를 수 있습니다.</p>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/electric-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>

    <script>
      (function(){
        function calcNormal(kwh) {
          var base = 910;
          if (kwh <= 200) return base + kwh * 120.0;
          if (kwh <= 400) return base + 200 * 120.0 + (kwh - 200) * 214.6;
          base = 7300;
          return base + 200 * 120.0 + 200 * 214.6 + (kwh - 400) * 307.3;
        }
        function calcSummer(kwh) {
          var base = 910;
          if (kwh <= 300) return base + kwh * 120.0;
          if (kwh <= 450) return base + 300 * 120.0 + (kwh - 300) * 214.6;
          base = 7300;
          return base + 300 * 120.0 + 150 * 214.6 + (kwh - 450) * 307.3;
        }
        var kwh = document.getElementById("kwh");
        var season = document.getElementById("season");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var billTotal = document.getElementById("billTotal");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        btnCalc.addEventListener("click", function(){
          var val = parseFloat(kwh.value);
          if (isNaN(val) || val < 0) { result.classList.remove("show"); return; }
          var bill = season.value === "summer" ? calcSummer(val) : calcNormal(val);
          billTotal.textContent = Math.round(bill).toLocaleString() + "원";
          result.classList.add("show");
        });

        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "electric" }); } catch(e){}
        });
      })();
    </script>
  </body>
</html>
