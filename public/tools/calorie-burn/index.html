<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>운동 칼로리 소모 | 종류·시간·체중 | FunnyFunny Cloud</title>
  <meta name="description" content="운동 종류·시간·체중을 입력하면 대략적인 칼로리 소모량(kcal)을 계산합니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/calorie-burn/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#ea580c;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#c2410c,#ea580c);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .panel h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--muted);}
    .field{margin-bottom:14px;} .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input,.field select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);font-size:14px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;}
    .result-item{display:flex;justify-content:space-between;padding:8px 0;} .result-item .v{font-weight:700;color:var(--accent);}
    .note{font-size:12px;color:var(--muted);margin-top:12px;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🔥</div><div><h1>운동 칼로리 소모</h1><p class="sub">종류·시간·체중 → 소모 kcal</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>운동 종류 (대략 MET)</label><select id="activity"><option value="3">걷기 (3)</option><option value="5">빠른 걸음 (5)</option><option value="7">조깅 (7)</option><option value="10">달리기 (10)</option><option value="6">자전거 (6)</option><option value="4">수영 가벼움 (4)</option><option value="8">수영 적극 (8)</option></select></div>
      <div class="row">
        <div class="field"><label>시간 (분)</label><input type="number" id="mins" min="1" value="30" /></div>
        <div class="field"><label>체중 (kg)</label><input type="number" id="weight" min="30" max="200" step="0.1" value="70" /></div>
      </div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>대략 소모 (kcal)</span><span class="v" id="kcal"></span></div>
        <p class="note">kcal ≈ MET × 체중(kg) × 시간(시간). 참고용이며 강도에 따라 다릅니다.</p>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/calorie-burn-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/tdee/">TDEE</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){
  var activity=document.getElementById("activity"), mins=document.getElementById("mins"), weight=document.getElementById("weight");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), kcalEl=document.getElementById("kcal");
  btn.addEventListener("click",function(){
    var met=parseFloat(activity.value)||5, m=parseFloat(mins.value)||0, w=parseFloat(weight.value)||70;
    var kcal=met*w*(m/60); kcalEl.textContent=Math.round(kcal)+" kcal"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
