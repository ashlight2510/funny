    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#c2410c,#ea580c);display:grid;place-items:center;font-size:22px;}

    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}

<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⛽</div><div><h1>주유 비용 계산기</h1><p class="sub">거리·연비·리터당 가격 → 예상 비용</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>주행 거리 (km)</label><input type="number" id="distance" min="0" step="1" value="100" /></div>
      <div class="row">
        <div class="field"><label>연비 (km/L)</label><input type="number" id="efficiency" min="0.1" step="0.1" value="12" /></div>
        <div class="field"><label>리터당 가격 (원)</label><input type="number" id="price" min="0" step="10" value="1600" /></div>
      </div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>필요 연료 (L)</span><span class="v" id="liters"></span></div>
        <div class="result-item"><span>예상 비용</span><span class="v" id="cost"></span></div>
        <p class="note">비용 = (거리 ÷ 연비) × 리터당 가격. 실제 연비는 도로·운전 방식에 따라 다릅니다.</p>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/fuel-cost-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/commute/">출퇴근 비용</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
  var dist=document.getElementById("distance"), eff=document.getElementById("efficiency"), price=document.getElementById("price");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), litersEl=document.getElementById("liters"), costEl=document.getElementById("cost");
  btn.addEventListener("click",function(){
    var d=parseFloat(dist.value)||0, e=parseFloat(eff.value)||1, p=parseFloat(price.value)||0;
    if(d<=0||e<=0){ res.classList.remove("show"); return; }
    var liters=d/e; var cost=liters*p;
    litersEl.textContent=liters.toFixed(2)+" L"; costEl.textContent=fmt(cost); res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
