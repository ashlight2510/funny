      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #f97316; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #c2410c 0%, #f97316 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }

      .field input:focus { outline: none; border-color: var(--accent); }

      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      body:has(#tool-share-block) { flex-wrap: wrap; }
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; width: 100%; flex: 0 0 100%; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }

  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">🔥</div>
          <div>
            <h1>가스요금 계산기</h1>
            <p class="sub">사용량(㎥)으로 한달 가스요금 예상 (주택용 도시가스)</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>사용량 입력</h3>
        <div class="field">
          <label>이번 달 사용량 (㎥)</label>
          <input type="number" id="usage" min="0" step="0.1" placeholder="예: 25" value="20" />
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div>예상 가스요금 (세전)</div>
          <div class="result-big" id="billTotal"></div>
          <p class="note">기본요금+사용량요금만 반영한 참고용입니다. 지역·가스사에 따라 단가가 다르며, 실제 청구액에는 부가세 등이 더해질 수 있습니다.</p>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/gas-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/electric/">전기요금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>

    <script>
      (function(){
        var BASE = 1250;
        var UNIT = 883.32;
        var usage = document.getElementById("usage");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var billTotal = document.getElementById("billTotal");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        btnCalc.addEventListener("click", function(){
          var u = parseFloat(usage.value);
          if (isNaN(u) || u < 0) { result.classList.remove("show"); return; }
          var bill = BASE + u * UNIT;
          billTotal.textContent = Math.round(bill).toLocaleString() + "원";
          result.classList.add("show");
        });

        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "gas" }); } catch(e){}
        });
      })();
    </script>
  </body>
</html>
