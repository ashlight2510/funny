  <head>

    <meta property="og:title" content="크몽·숨고 수수료 계산기 | 실수령액 계산 | FunnyFunny Cloud" />

    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #818cf8; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
      .btn:hover { filter: brightness(1.1); }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .result-item:last-child { border-bottom: none; }
      .result-item .v { font-size: 18px; font-weight: 700; color: var(--accent); }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      #tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">📊</div>
          <div>
            <h1>크몽·숨고 수수료 계산기</h1>
            <p class="sub">플랫폼 수수료와 실수령액 계산 (참고용)</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>매출·플랫폼</h3>
        <div class="field">
          <label>거래 금액 (원)</label>
          <input type="number" id="amount" min="0" step="1000" placeholder="예: 500000" value="100000" />
        </div>
        <div class="field">
          <label>플랫폼</label>
          <select id="platform">
            <option value="kmong">크몽 (구간별 수수료 16.4% / 9.4% / 4.4%)</option>
            <option value="ssobo">숨고 (견적 포인트제, 대략 10~15% 부담 가정)</option>
          </select>
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>매출</span><span class="v" id="outAmount"></span></div>
          <div class="result-item"><span>플랫폼 수수료</span><span class="v" id="outFee"></span></div>
          <div class="result-item"><span>실수령 (예상)</span><span class="v" id="outNet"></span></div>
        </div>
        <p class="note" id="note">크몽: 70만원 이하 16.4%, 70만~200만 9.4%, 200만 초과 4.4% (거래당 구간 적용). 결제수수료·부가세 등은 별도입니다. 숨고: 견적당 포인트제라 거래액 %는 플랫폼 정책을 확인하세요.</p>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/platformfee-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/tax/">세금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>

    <script>
      (function(){
        function fmt(n) { return Math.round(n).toLocaleString() + "원"; }
        function kmongFee(amount) {
          var fee = 0;
          if (amount <= 700000) fee = amount * 0.164;
          else if (amount <= 2000000) fee = 700000 * 0.164 + (amount - 700000) * 0.094;
          else fee = 700000 * 0.164 + 1300000 * 0.094 + (amount - 2000000) * 0.044;
          return fee;
        }
        var amount = document.getElementById("amount");
        var platform = document.getElementById("platform");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var outAmount = document.getElementById("outAmount");
        var outFee = document.getElementById("outFee");
        var outNet = document.getElementById("outNet");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        btnCalc.addEventListener("click", function(){
          var a = parseFloat(amount.value) || 0;
          if (a <= 0) { result.classList.remove("show"); return; }
          var fee, net;
          if (platform.value === "kmong") {
            fee = kmongFee(a);
            net = a - fee;
          } else {
            fee = a * 0.15;
            net = a - fee;
          }
          outAmount.textContent = fmt(a);
          outFee.textContent = fmt(fee);
          outNet.textContent = fmt(net);
          result.classList.add("show");
        });

        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "platformfee" }); } catch(e){}
        });
      })();
    </script>
  </body>
</html>
