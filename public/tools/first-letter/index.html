  <script>
(function(){ var words={A:["Apple","Air","Angel"],B:["Book","Bird","Blue"],C:["Cat","Cloud","Coffee"],D:["Dog","Dream","Day"],E:["Earth","Eye","Energy"],F:["Fire","Friend","Flower"],G:["Game","Green","Gift"],H:["Heart","Home","Happy"],K:["Korea","Kind","Key"],M:["Moon","Music","Morning"],P:["Peace","People","Pizza"],S:["Star","Sky","Sun"],T:["Time","Tree","Travel"]};
  var keys=Object.keys(words);
  var btn=document.getElementById("btnPick"), res=document.getElementById("result"), letter=document.getElementById("letter"), word=document.getElementById("word");
  btn.addEventListener("click",function(){ var k=keys[Math.floor(Math.random()*keys.length)]; var w=words[k]; letter.textContent=k; word.textContent=w[Math.floor(Math.random()*w.length)]; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
