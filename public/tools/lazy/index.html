    const defaultLang = "ko";
    const supportedLangs = ["ko", "en"];
    let currentLang = defaultLang;

    function t(key, vars = {}) {
      const langTable = translations[currentLang] || translations.ko;
      let template = langTable?.[key] ?? translations.ko?.[key] ?? key;
      if (typeof template !== "string") return template;
      Object.keys(vars).forEach((k) => {
        template = template.replace(new RegExp(`\\{${k}\\}`, "g"), vars[k]);
      });
      return template;
    }

    function applyTranslations() {
      document.title = t("metaTitle");
      const descMeta = document.querySelector('meta[name="description"]');
      if (descMeta) descMeta.setAttribute("content", t("metaDescription"));
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        el.innerHTML = t(el.dataset.i18nHtml);
      });
    }

    function detectLang() {
      const params = new URLSearchParams(window.location.search);
      const paramLang = params.get("lang");
      if (supportedLangs.includes(paramLang)) return paramLang;
      const stored = localStorage.getItem("preferredLang");
      if (supportedLangs.includes(stored)) return stored;
      const browserLang =
        navigator.languages && navigator.languages.length
          ? navigator.languages[0]
          : navigator.language;
      if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
        return "ko";
      }
      return defaultLang;
    }

    function setLang(lang, options = {}) {
      const nextLang = supportedLangs.includes(lang) ? lang : defaultLang;
      currentLang = nextLang;
      document.documentElement.lang = nextLang;
      localStorage.setItem("preferredLang", nextLang);
      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === nextLang);
      });
      applyTranslations();
      if (options.forceUpdate) {
        if (typeof showQuestion === "function" && typeof currentQuestionIndex !== "undefined") {
          showQuestion(currentQuestionIndex);
        }
        if (typeof updateProgress === "function") {
          updateProgress();
        }
        if (typeof updateButtons === "function") {
          updateButtons();
        }
        if (document.getElementById("result") && !document.getElementById("result").classList.contains("hidden")) {
          if (typeof showResult === "function") {
            showResult();
          }
        }
      }
      if (options.updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set("lang", nextLang);
        window.history.replaceState({}, "", url);
      }
    }

    document.querySelectorAll(".lang-switch button").forEach((button) => {
      button.addEventListener("click", () => {
        setLang(button.dataset.lang, { updateUrl: true, forceUpdate: true });
      });
    });

    function getQuestions() {
      const isEnglish = currentLang === "en";
      return QUESTIONS_BASE.map(q => ({
        ...q,
        label: isEnglish ? q.labelEn : q.label,
        subtitle: isEnglish ? q.subtitleEn : q.subtitle,
        options: q.options.map(opt => ({
          ...opt,
          text: isEnglish ? opt.textEn : opt.text
        }))
      }));
    }

    // 상태 관리
    let currentQuestionIndex = 0;
    let answers = {};

    // 초기화
    function init() {
      showQuestion(0);
      updateProgress();
    }

    // 질문 표시
    function showQuestion(index) {
      const questions = getQuestions();
      const question = questions[index];
      const container = document.getElementById("questionContainer");
      const savedAnswer = answers[question.name];
      
      container.innerHTML = `
        <div class="question-group bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 animate-fadeIn">
          <div class="mb-6">
            <h2 class="text-xl md:text-2xl font-bold text-gray-900 mb-2 leading-relaxed">
              ${question.label}
            </h2>
            <p class="text-sm text-gray-500">${question.subtitle}</p>
          </div>
          
          <div class="space-y-3">
            ${question.options.map((opt, idx) => {
              const isSelected = savedAnswer === opt.value;
              const optionLabels = ['①', '②', '③', '④', '⑤'];
              return `
                <label 
                  class="option-card block p-4 rounded-xl bg-white ${isSelected ? 'selected' : ''}"
                  onclick="selectOption('${question.name}', '${opt.value}')"
                >
                  <div class="flex items-start gap-3">
                    <input 
                      type="radio" 
                      name="${question.name}" 
                      value="${opt.value}"
                      ${isSelected ? 'checked' : ''}
                      onchange="saveAnswer('${question.name}', '${opt.value}')"
                      class="mt-1 w-5 h-5 text-black border-gray-300 focus:ring-black focus:ring-2"
                    />
                    <div class="flex-1">
                      <span class="font-semibold text-gray-900 mr-2">${optionLabels[idx]}</span>
                      <span class="text-gray-700 leading-relaxed">${opt.text}</span>
                    </div>
                  </div>
                </label>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // 버튼 상태 업데이트
      updateButtons();
    }

    // 옵션 선택 함수
    function selectOption(name, value) {
      saveAnswer(name, value);
      // UI 업데이트
      const labels = document.querySelectorAll(`input[name="${name}"]`);
      labels.forEach(radio => {
        const card = radio.closest('.option-card');
        if (radio.value === value) {
          card.classList.add('selected');
          radio.checked = true;
        } else {
          card.classList.remove('selected');
        }
      });
      updateButtons();
    }

    // 답변 저장
    function saveAnswer(name, value) {
      answers[name] = value;
    }

    // 진행도 업데이트
    function updateProgress() {
      const questions = getQuestions();
      const totalQuestions = questions.length;
      const current = currentQuestionIndex + 1;
      const percent = Math.round((current / totalQuestions) * 100);

      document.getElementById("progressText").textContent = t("progressText", { current, total: totalQuestions });
      document.getElementById("progressPercent").textContent = `${percent}%`;
      document.getElementById("progressBar").style.width = `${percent}%`;
    }

    // 버튼 상태 업데이트
    function updateButtons() {
      const prevButton = document.getElementById("prevButton");
      const nextButton = document.getElementById("nextButton");
      const questions = getQuestions();
      const currentQuestion = questions[currentQuestionIndex];

      // 이전 버튼 표시/숨김
      if (currentQuestionIndex === 0) {
        prevButton.classList.add("hidden");
      } else {
        prevButton.classList.remove("hidden");
      }

      // 다음 버튼 텍스트 변경
      if (currentQuestionIndex === questions.length - 1) {
        nextButton.textContent = t("resultButton");
      } else {
        nextButton.textContent = t("nextButton");
      }
    }

    // 다음 질문으로 이동
    function goToNextQuestion() {
      const questions = getQuestions();
      const currentQuestion = questions[currentQuestionIndex];
      const selectedRadio = document.querySelector(`input[name="${currentQuestion.name}"]:checked`);
      
      if (!selectedRadio) {
        alert(t("alertSelect"));
        return;
      }

      saveAnswer(currentQuestion.name, selectedRadio.value);

      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        showQuestion(currentQuestionIndex);
        updateProgress();
      } else {
        // 마지막 질문이면 결과 표시
        showResult();
      }
    }

    // 이전 질문으로 이동
    function goToPreviousQuestion() {
      if (currentQuestionIndex > 0) {
        const currentQuestion = questions[currentQuestionIndex];
        const selectedRadio = document.querySelector(`input[name="${currentQuestion.name}"]:checked`);
        if (selectedRadio) {
          saveAnswer(currentQuestion.name, selectedRadio.value);
        }
        
        currentQuestionIndex--;
        showQuestion(currentQuestionIndex);
        updateProgress();
      }
    }

      document.getElementById("progressSection").classList.add("hidden");

      document.getElementById("navigationButtons").classList.add("hidden");

      // 총점 계산
      let total = 0;
      Object.values(answers).forEach(value => {
        total += Number(value) || 0;
      });

      let title = "";
      let emoji = "";
      let desc = "";
      let recommendations = [];
      let colorClass = "";

      if (total <= 7) {
        emoji = "🟡";

        desc = t("resultLightDesc");
        recommendations = [

        desc = t("resultMediumDesc");
        recommendations = [
          {

          },
          {
            title: t("rec2_2_title"),
            desc: t("rec2_2_desc")
          },
          {

            desc: t("rec2_3_desc")
          },
          {
            title: t("rec2_4_title"),
            desc: t("rec2_4_desc")
          }
        ];
      } else if (total <= 21) {
        emoji = "🔴";
        title = t("resultSevere");
        colorClass = "text-red-600";
        desc = t("resultSevereDesc");
        recommendations = [
          {
            title: t("rec3_1_title"),
            desc: t("rec3_1_desc")
          },
          {
            title: t("rec3_2_title"),
            desc: t("rec3_2_desc")
          },
          {
            title: t("rec3_3_title"),
            desc: t("rec3_3_desc")
          },
          {
            title: t("rec3_4_title"),
            desc: t("rec3_4_desc")
          }
        ];
      } else {
        emoji = "⚫";
        title = t("resultExtreme");
        colorClass = "text-gray-900";
        desc = t("resultExtremeDesc");
        recommendations = [
          {
            title: t("rec4_1_title"),
            desc: t("rec4_1_desc")
          },
          {
            title: t("rec4_2_title"),
            desc: t("rec4_2_desc")
          },
          {
            title: t("rec4_3_title"),
            desc: t("rec4_3_desc")
          },
          {
            title: t("rec4_4_title"),
            desc: t("rec4_4_desc")
          },
          {
            title: t("rec4_5_title"),
            desc: t("rec4_5_desc")
          }
        ];
      }

      // result.html로 리다이렉트
      const params = new URLSearchParams({
        total: total.toString(),
        title: title || '',
        emoji: emoji || '',
        level: total <= 7 ? 'light' : (total <= 14 ? 'medium' : (total <= 21 ? 'severe' : 'extreme'))
      });
      window.location.href = `result.html?${params.toString()}`;
    }

    function shareResult() {
      const result = window.currentResult;
      if (!result) return;

      const text = t("shareText", {
        emoji: result.emoji,
        title: result.title,
        total: result.total,
        url: window.location.href
      });

      if (navigator.share) {
        navigator.share({
          title: t("shareTitle"),
          text: text,
          url: window.location.href
        }).catch(() => {
          copyToClipboard(text);
        });
      } else {
        copyToClipboard(text);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert(t("alertCopySuccess"));
      }).catch(() => {
        alert(t("alertCopyFail"));
      });
    }

    // 페이지 로드 시 초기화
    init();
  </script>
