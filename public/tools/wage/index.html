<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>일급·시급 계산기 | 월급 환산 | FunnyFunny Cloud</title>
    <meta name="description" content="월급·일급·시급 중 하나를 입력하면 나머지로 환산합니다. 월 근무일·일 근무시간 설정. 무료 급여 환산 계산기." />
    <meta property="og:title" content="일급·시급 계산기 | FunnyFunny Cloud" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/wage/" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/wage/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #3b82f6; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
      .result-item .v { font-weight: 700; color: var(--accent); }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">💵</div>
          <div>
            <h1>일급·시급 계산기</h1>
            <p class="sub">월급·일급·시급 서로 환산</p>
          </div>
        </div>
      </header>
      <div class="panel">
        <h3>입력 (하나만 채우면 나머지 환산)</h3>
        <div class="field">
          <label>월급 (원) — 월 기준</label>
          <input type="number" id="monthly" min="0" step="10000" placeholder="비우면 자동 계산" />
        </div>
        <div class="field">
          <label>일급 (원)</label>
          <input type="number" id="daily" min="0" step="1000" placeholder="비우면 자동 계산" />
        </div>
        <div class="field">
          <label>시급 (원)</label>
          <input type="number" id="hourly" min="0" step="100" placeholder="비우면 자동 계산" />
        </div>
        <div class="row">
          <div class="field">
            <label>월 근무일 수</label>
            <input type="number" id="daysPerMonth" min="1" max="31" value="22" />
          </div>
          <div class="field">
            <label>일 근무시간</label>
            <input type="number" id="hoursPerDay" min="0.5" max="24" step="0.5" value="8" />
          </div>
        </div>
        <button type="button" class="btn" id="btnCalc">환산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>월급</span><span class="v" id="resMonthly"></span></div>
          <div class="result-item"><span>일급</span><span class="v" id="resDaily"></span></div>
          <div class="result-item"><span>시급</span><span class="v" id="resHourly"></span></div>
          <p class="note">근무일·시간은 참고값입니다. 최저시급·근로계약은 고용노동부 기준을 확인하세요.</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/wage-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/salary-tax/">간이 세금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>
    <script>
      (function(){
        function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
        var monthly = document.getElementById("monthly");
        var daily = document.getElementById("daily");
        var hourly = document.getElementById("hourly");
        var daysPerMonth = document.getElementById("daysPerMonth");
        var hoursPerDay = document.getElementById("hoursPerDay");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var resMonthly = document.getElementById("resMonthly");
        var resDaily = document.getElementById("resDaily");
        var resHourly = document.getElementById("resHourly");
        btnCalc.addEventListener("click", function(){
          var d = parseInt(daysPerMonth.value, 10) || 22;
          var h = parseFloat(hoursPerDay.value) || 8;
          var m = parseFloat(monthly.value);
          var da = parseFloat(daily.value);
          var ho = parseFloat(hourly.value);
          var count = [m, da, ho].filter(function(x){ return !isNaN(x) && x > 0; }).length;
          if (count !== 1) { result.classList.remove("show"); return; }
          if (!isNaN(m) && m > 0) {
            da = m / d;
            ho = da / h;
          } else if (!isNaN(da) && da > 0) {
            m = da * d;
            ho = da / h;
          } else {
            ho = ho > 0 ? ho : 0;
            da = ho * h;
            m = da * d;
          }
          resMonthly.textContent = fmt(m);
          resDaily.textContent = fmt(da);
          resHourly.textContent = fmt(ho);
          result.classList.add("show");
        });
        document.getElementById("btnShare").addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById("tool-share-toast").textContent = "복사했어요"; document.getElementById("tool-share-toast").style.display = "inline"; setTimeout(function(){ document.getElementById("tool-share-toast").style.display = "none"; }, 1500); });
        });
      })();
    </script>
  </body>
</html>
