  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){ var pool=[]; for(var i=1;i<=75;i++) pool.push(i);
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  shuffle(pool);
  var btn=document.getElementById("btnCall"), res=document.getElementById("result"), out=document.getElementById("out"), calledEl=document.getElementById("called"); var called=[];
  btn.addEventListener("click",function(){ if(pool.length===0){ pool=[]; for(var i=1;i<=75;i++) pool.push(i); shuffle(pool); called=[]; } var n=pool.pop(); called.push(n); out.textContent=n; calledEl.textContent="호출됨: "+called.join(", "); res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
