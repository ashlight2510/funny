<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>환율 계산기 | 원화·외화 변환 | FunnyFunny Cloud</title>
    <meta name="description" content="금액과 환율을 입력하면 원화↔외화를 즉시 변환합니다. USD, JPY, EUR 등. 무료 환율·환전 계산기." />
    <meta property="og:title" content="환율 계산기 | 원화·외화 변환 | FunnyFunny Cloud" />
    <meta property="og:description" content="금액·환율로 원화↔외화 변환. 무료." />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/exchange/" />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0b1220/ffffff&text=Exchange+Rate" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/exchange/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230b1220'/><path d='M20 24h24v4H20zM20 36h24v4H20zM28 20l-4 8 4 8M36 28l4-8-4-8' stroke='%23eab308' stroke-width='2' fill='none' stroke-linecap='round'/></svg>" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #eab308; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #a16207 0%, #eab308 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #0b1220; }
      .btn:hover { filter: brightness(1.1); }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-big { font-size: 22px; font-weight: 800; color: var(--accent); margin: 12px 0; }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      #tool-share-block { text-align: center; margin: 8px 0; font-size: 13px; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
      .swap-btn { margin: 8px 0; padding: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">💱</div>
          <div>
            <h1>환율 계산기</h1>
            <p class="sub">금액·환율로 원화↔외화 변환</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>금액·환율 입력</h3>
        <div class="field">
          <label>금액</label>
          <input type="number" id="amount" min="0" step="1" placeholder="예: 1000000" value="1000000" />
        </div>
        <div class="field">
          <label>환율 (1 외화 = ? 원)</label>
          <input type="number" id="rate" min="0" step="0.01" placeholder="예: 1350" value="1350" />
        </div>
        <div class="field">
          <label>변환 방향</label>
          <select id="direction">
            <option value="toKrw">외화 → 원화 (외화 금액 × 환율)</option>
            <option value="toForeign">원화 → 외화 (원화 ÷ 환율)</option>
          </select>
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div>변환 결과</div>
          <div class="result-big" id="resultValue"></div>
          <p class="note">실제 환율은 은행·환전소마다 다르며, 수수료가 붙을 수 있습니다. 참고용으로만 사용하세요.</p>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/exchange-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/saving/">예금·적금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>

    <script>
      (function(){
        var amount = document.getElementById("amount");
        var rate = document.getElementById("rate");
        var direction = document.getElementById("direction");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var resultValue = document.getElementById("resultValue");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        btnCalc.addEventListener("click", function(){
          var a = parseFloat(amount.value);
          var r = parseFloat(rate.value);
          if (isNaN(a) || a < 0 || isNaN(r) || r <= 0) { result.classList.remove("show"); return; }
          if (direction.value === "toKrw") {
            resultValue.textContent = Math.round(a * r).toLocaleString() + "원";
          } else {
            resultValue.textContent = (a / r).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " (외화)";
          }
          result.classList.add("show");
        });

        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "exchange" }); } catch(e){}
        });
      })();
    </script>
  </body>
</html>
