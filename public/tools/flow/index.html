    <script>
      /**
       * ============================
       * ✅ 0) Supabase 연결 정보 넣기
       * ============================
       * Supabase 대시보드 → Settings → API
       * - Project URL
       * - anon public key
       */
      const SUPABASE_URL = "https://vpezjsuzwmeozaytcqyv.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZXpqc3V6d21lb3pheXRjcXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxMDA0OTIsImV4cCI6MjA3OTY3NjQ5Mn0.Fyjj5yrV2-6w1OKnQXWaL_-7_r1XpuUl-UQq6e6e5vc";
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      /**
       * ============================
       * ✅ 1) 익명ID / 쿨타임
       * ============================
       */
      const LS_ANON = "panfeed_anon_id";
      const LS_NAME = "panfeed_last_name";
      const LS_COOLDOWN_POST = "panfeed_cd_post";
      const LS_COOLDOWN_COMMENT = "panfeed_cd_comment";

      function getAnonId() {
        let v = localStorage.getItem(LS_ANON);
        if (!v) {
          v =
            crypto?.randomUUID?.() ||
            Date.now() + "-" + Math.random().toString(16).slice(2);
          localStorage.setItem(LS_ANON, v);
        }
        return v;
      }
      function setLastName(name) {
        if (!name) return;
        localStorage.setItem(LS_NAME, name.slice(0, 20));
      }
      function getLastName() {
        return localStorage.getItem(LS_NAME) || "";
      }
      function nowMs() {
        return Date.now();
      }

      function inCooldown(key, ms) {
        const until = Number(localStorage.getItem(key) || "0");
        return nowMs() < until;
      }
      function setCooldown(key, ms) {
        localStorage.setItem(key, String(nowMs() + ms));
      }
      function msLeft(key) {
        const until = Number(localStorage.getItem(key) || "0");
        return Math.max(0, until - nowMs());
      }

      const anonId = getAnonId();

      /**
       * ============================
       * ✅ 2) DOM helpers
       * ============================
       */
      const $ = (sel) => document.querySelector(sel);
      const viewEl = $("#view");

      function esc(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
      function timeAgo(iso) {
        const t = new Date(iso).getTime();
        const diff = Math.max(0, Date.now() - t);
        const m = Math.floor(diff / 60000);
        if (m < 1) return "방금";
        if (m < 60) return `${m}분 전`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h}시간 전`;
        const d = Math.floor(h / 24);
        return `${d}일 전`;
      }
      function seedImg(seed) {
        // ✅ 본문 더미 이미지는 picsum 사용(영문/숫자 seed)
        const s = encodeURIComponent(
          String(seed).replace(/[^a-z0-9-]/gi, "seed")
        );
        return `https://picsum.photos/seed/${s}/1200/700`;
      }

      /**
       * ============================
       * ✅ 3) 라우팅
       * ============================
       */
      function parseHash() {
        const h = (location.hash || "#/").slice(1);
        const parts = h.split("/").filter(Boolean);
        return parts;
      }

      function nav(path) {
        location.hash = path.startsWith("#") ? path : "#" + path;
      }

      document.querySelectorAll(".tabBtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          if (tab === "home") nav("/");
          if (tab === "boards") nav("/boards");
          if (tab === "new-board") nav("/boards/new");
        });
      });

      /**
       * ============================
       * ✅ 4) 상단 익명ID 뱃지
       * ============================
       */
      $("#anonBadge").textContent = `anon: ${anonId.slice(0, 8)}`;
      $("#copyAnonBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(anonId);
          $("#copyAnonBtn").textContent = "복사됨!";
          setTimeout(() => ($("#copyAnonBtn").textContent = "ID 복사"), 900);
        } catch {
          alert("복사 실패. 브라우저 권한을 확인해줘.");
        }
      });

      /**
       * ============================
       * ✅ 5) 통계
       * ============================
       */
      async function loadStats() {
        // count는 head:true로 빠르게
        const boards = await sb
          .from("boards")
          .select("id", { count: "exact", head: true });
        const posts = await sb
          .from("posts")
          .select("id", { count: "exact", head: true });
        const comments = await sb
          .from("comments")
          .select("id", { count: "exact", head: true });

        $("#statBoards").textContent = boards.count ?? "-";
        $("#statPosts").textContent = posts.count ?? "-";
        $("#statComments").textContent = comments.count ?? "-";
      }

      /**
       * ============================
       * ✅ 6) 데이터 로더
       * ============================
       */
      async function fetchActiveBoards(limit = 30) {
        const { data, error } = await sb
          .from("boards")
          .select(
            "id, slug, title, description, tags, is_active, last_activity_at, created_at"
          )
          .eq("is_active", true)
          .order("last_activity_at", { ascending: false })
          .limit(limit);
        if (error) throw error;
        return data || [];
      }

      async function fetchFeed({ limit = 30, boardSlug = null } = {}) {
        // posts + board join
        let q = sb
          .from("posts")
          .select(
            "id, body, author_name, anon_id, created_at, comment_count, empathy_count, is_hidden, board:boards(id, slug, title)"
          )
          .eq("is_hidden", false)
          .order("created_at", { ascending: false })
          .limit(limit);

        if (boardSlug) {
          // filter by board slug: need inner join filter
          // Supabase: use foreignTable filter via !inner
          q = sb
            .from("posts")
            .select(
              "id, body, author_name, anon_id, created_at, comment_count, empathy_count, is_hidden, board:boards!inner(id, slug, title)"
            )
            .eq("is_hidden", false)
            .eq("boards.slug", boardSlug)
            .order("created_at", { ascending: false })
            .limit(limit);
        }

        const { data, error } = await q;
        if (error) throw error;
        return data || [];
      }

      async function fetchPostDetail(postId) {
        if (!postId) {
          throw new Error("글 ID가 필요해.");
        }
        const { data: post, error: e1 } = await sb
          .from("posts")
          .select(
            "id, body, author_name, anon_id, created_at, comment_count, empathy_count, is_hidden, board:boards(id, slug, title)"
          )
          .eq("id", postId)
          .maybeSingle();
        if (e1) throw e1;

        const { data: comments, error: e2 } = await sb
          .from("comments")
          .select("id, body:content, author_name, anon_id, created_at")
          .eq("post_id", postId)
          .order("created_at", { ascending: true });
        if (e2) throw e2;

        return { post, comments: comments || [] };
      }

      async function fetchBoardsForSelect() {
        const { data, error } = await sb
          .from("boards")

      async function refreshEmpathyCount(postId) {
        if (!postId) return;
        const escaped = CSS?.escape?.(postId) || postId;
        try {
          const { count, error } = await sb
            .from("empathy")
            .select("id", { count: "exact", head: true })
            .eq("post_id", postId);
          if (error) {
            console.error("공감 수 조회 실패:", error);
            return;
          }
          const countValue = count ?? 0;
          document
            .querySelectorAll(`[data-empathy-count="${escaped}"]`)
            .forEach((el) => (el.textContent = `(${countValue})`));
        } catch (err) {
          console.error("공감 수 조회 중 오류:", err);
        }
      }

      async function doEmpathy(postId) {
        if (!postId) return;
        // 1인 1회: empathy 테이블 unique(post_id, anon_id)
        const { error } = await sb
          .from("empathy")
          .insert({ post_id: postId, anon_id: anonId });
        if (error) {
          // 이미 공감했거나 제약 위반
          if (
            error.code === "23505" ||
            error.code === "PGRST116" ||
            error.status === 409 ||
            String(error.message || "")
              .toLowerCase()
              .includes("duplicate") ||
            String(error.message || "")
              .toLowerCase()
              .includes("unique constraint")
          ) {
            toast("이미 공감했어 👀");
            await refreshEmpathyCount(postId);
            return;
          }
          toast("공감 실패: " + (error.message || "unknown"));
          return;
        }
        toast("공감 +1 🔥");
        await refreshEmpathyCount(postId);
      }

      async function createComment({ postId, body, authorName }) {
        if (!postId) {
          throw new Error("글 ID가 없어. 새로고침해줘.");
        }

        // postId를 문자열로 명시적으로 변환 (UUID 형식 유지)
        const normalizedPostId = String(postId).trim();

        // 디버깅: postId 값 확인
        console.log("댓글 작성 시도 - postId:", {
          original: postId,
          normalized: normalizedPostId,
          type: typeof postId,
          normalizedType: typeof normalizedPostId,
        });

        // 먼저 postId가 실제로 존재하는지 확인
        const { data: postExists, error: checkError } = await sb
          .from("posts")
          .select("id, is_hidden")
          .eq("id", normalizedPostId)
          .maybeSingle();

        console.log("postId 존재 사전 확인:", {
          postExists,
          checkError,
          exists: !!postExists,
        });

        if (checkError) {
          console.error("postId 확인 중 에러:", checkError);
          throw new Error(
            `글을 확인하는 중 오류가 발생했어. (${
              checkError.message || "알 수 없는 오류"
            })`
          );
        }

        if (!postExists) {
          throw new Error(`글을 찾을 수 없어. 새로고침 해줘.`);
        }

        if (postExists.is_hidden) {
          throw new Error("이 글은 숨겨진 글이라 댓글을 달 수 없어.");
        }

        // postId 확인 성공 로그
        console.log("postId 확인 성공:", {
          postId: normalizedPostId,
          isHidden: postExists.is_hidden,
          postExistsId: postExists.id,
          postExistsIdType: typeof postExists.id,
        });

        // postExists.id를 사용하여 정확한 postId 확보
        // (normalizedPostId와 postExists.id가 다를 수 있음)
        const actualPostId = postExists.id || normalizedPostId;

        // INSERT 전 최종 확인: postId를 직접 테스트
        console.log("INSERT 전 최종 확인:", {
          normalizedPostId,
          actualPostId,
          postExistsId: postExists?.id,
          idsMatch: String(postExists?.id) === String(actualPostId),
          willUsePostId: actualPostId,
        });

        const { data, error } = await sb
          .from("comments")
          .insert({
            post_id: actualPostId, // postExists.id를 사용하여 정확한 UUID 보장
            content: body,
            author_name: authorName || "익명",
            anon_id: anonId,
          })
          .select();
        if (error) {
          // 전체 에러 객체 로깅 (더 상세하게)
          console.error("댓글 작성 에러 상세:", {
            error,
            errorString: JSON.stringify(error, null, 2),
            originalPostId: postId,
            normalizedPostId: normalizedPostId,
            actualPostId: actualPostId,
            postExistsId: postExists?.id,
            postExistsIdString: String(postExists?.id),
            status: error.status,
            code: error.code,
            message: error.message,
            details: error.details,
            hint: error.hint,
            // Supabase 에러의 모든 속성 확인
            allKeys: Object.keys(error),
            // 추가 디버깅 정보
            insertPayload: {
              post_id: actualPostId,
              content: body?.slice(0, 50) + "...",
              author_name: authorName || "익명",
              anon_id: anonId?.slice(0, 8) + "...",
            },
          });

          const errorMsg = (error.message || "").toLowerCase();
          const errorCode = error.code;
          const errorDetails = error.details || "";
          const errorHint = error.hint || "";

          // 모든 에러를 먼저 로깅
          console.error("=== 댓글 작성 실패 - 에러 분석 ===");
          console.error("에러 코드:", errorCode);
          console.error("HTTP 상태:", error.status);
          console.error("에러 메시지:", error.message);
          console.error("에러 상세:", errorDetails);
          console.error("에러 힌트:", errorHint);
          console.error("postId:", normalizedPostId);
          console.error("postExists:", postExists);
          console.error("================================");

          // 외래 키 제약 위반 에러 처리 (에러 코드 23503) - 최우선 처리
          if (
            errorCode === "23503" ||
            error.status === 409 ||
            errorMsg.includes("foreign key constraint") ||
            errorMsg.includes("violates foreign key constraint") ||
            errorMsg.includes("comments_post_id_fkey") ||
            errorDetails.includes("Key is not present in table")
          ) {
            // postId는 이미 존재 확인했지만, RLS 정책 문제일 수 있음
            // 에러 details에 "Key is not present in table"이 있으면 RLS 정책 문제
            console.error("외래 키 제약 위반 발생:", {
              originalPostId: postId,
              normalizedPostId: normalizedPostId,
              actualPostId: actualPostId,
              postExists: true, // 이미 확인함
              postExistsId: postExists?.id,
              errorDetails,
              errorHint,
              possibleCause:
                "RLS 정책 문제 또는 postId 타입 불일치 - comments 테이블 INSERT 시 posts 테이블 참조 권한 없음",
            });

            // RLS 정책 문제일 가능성이 높음
            // comments 테이블 INSERT 시 posts 테이블의 해당 행을 참조할 수 있는 권한이 없음
            if (errorDetails.includes("Key is not present in table")) {
              const rlsGuide = `
RLS 정책 설정 가이드 (Supabase SQL Editor에서 실행):

-- 기존 comments INSERT 정책들 모두 삭제
DROP POLICY IF EXISTS "Anyone can create comments" ON comments;
DROP POLICY IF EXISTS "anon insert comments" ON comments;
DROP POLICY IF EXISTS "insert_comments" ON comments;
DROP POLICY IF EXISTS "Allow anon to insert comments" ON comments;

-- comments 테이블 INSERT 정책 생성 (public 역할 사용)
CREATE POLICY "Allow anon to insert comments"
ON comments FOR INSERT
TO public
WITH CHECK (
  EXISTS (
    SELECT 1 FROM posts 
    WHERE posts.id = comments.post_id
  )
);

-- 정책 확인
SELECT * FROM pg_policies WHERE tablename = 'comments';
SELECT * FROM pg_policies WHERE tablename = 'posts' AND cmd = 'SELECT';
`;
              console.error("RLS 정책 설정 가이드:", rlsGuide);
              console.error(
                "관리자용: Supabase 대시보드 → SQL Editor에서 위 SQL을 실행하세요."
              );
              console.error("현재 에러 상세:", {
                errorCode,
                errorStatus: error.status,
                errorDetails,
                errorHint,
                errorMessage: error.message,
                actualPostId: actualPostId,
                postExistsId: postExists?.id,
              });

              // 사용자에게는 간단한 메시지만 표시
              throw new Error(
                `글을 찾을 수 없어. 새로고침 해줘. (데이터베이스 설정 문제일 수 있어)`
              );
            }

            // 일반적인 외래 키 제약 위반
            throw new Error(`글을 찾을 수 없어. 새로고침 해줘.`);
          }

          // 중복 제약 조건 위반 (Unique constraint violation) - 에러 코드 23505
          if (
            errorCode === "23505" ||
            errorCode === "PGRST116" ||
            errorMsg.includes("duplicate") ||
            errorMsg.includes("unique constraint") ||
            errorMsg.includes("violates unique constraint")
          ) {
            throw new Error("중복된 요청이야. 잠시 후 다시 시도해줘.");
          }

          // 409 Conflict HTTP 상태 코드 처리
          // Supabase는 일부 제약 조건 위반을 409로 반환할 수 있음
          if (error.status === 409 || errorCode === "409") {
            // 에러 메시지에 따라 구체적인 안내
            if (
              errorMsg.includes("foreign key") ||
              errorDetails.includes("Key is not present in table")
            ) {
              // RLS 정책 문제 또는 외래 키 제약 위반
              // postId 확인은 성공했지만 INSERT 시점에 실패
              throw new Error(
                `글을 찾을 수 없어. 새로고침 해줘. (RLS 정책 또는 외래 키 제약 문제일 수 있어)`
              );
            }
            if (errorMsg.includes("duplicate") || errorMsg.includes("unique")) {
              throw new Error("중복된 요청이야. 잠시 후 다시 시도해줘.");
            }
            // 일반적인 409 에러 - 글 정보가 최신이 아닐 수 있음
            throw new Error(`글을 찾을 수 없어. 새로고침 해줘.`);
          }

          // 기타 에러 - 원본 메시지 포함
          const userMessage = error.message || "댓글 작성에 실패했어.";
          throw new Error(
            `${userMessage} (에러 코드: ${errorCode || "알 수 없음"})`
          );
        }
        return data;
      }

          nav("/");
          // 피드를 다시 렌더링하여 새로 작성한 글이 표시되도록 함
          setTimeout(() => render(), 100);
        } catch (err) {
          composeError.textContent = err?.message || String(err);
          composeError.classList.remove("hidden");
        } finally {
          updateComposeHint();
        }
      }

      // 게시 버튼 클릭
      $("#submitPostBtn").addEventListener("click", submitPost);

      // 단축키: Shift+Enter 또는 Cmd+Enter (Mac) / Ctrl+Enter (Windows/Linux)
      composeBody.addEventListener("keydown", (e) => {
        const isMac = navigator.platform.toUpperCase().indexOf("MAC") >= 0;
        const isCmdOrCtrl = isMac ? e.metaKey : e.ctrlKey;

        if (e.key === "Enter" && (e.shiftKey || isCmdOrCtrl)) {
          e.preventDefault();
          submitPost();
        }
      });

      /**
       * ============================
       * ✅ 12) 메인 렌더러
       * ============================
       */
      async function render() {
        updateComposeHint();
        await loadStats();

        const parts = parseHash();
        // routes:
        // #/                 => home
        // #/boards           => list active boards
        // #/boards/new       => create board
        // #/g/:slug          => board view
        // #/p/:id            => post detail

        try {
          if (!parts.length) return renderHome();

          if (parts[0] === "boards" && parts[1] === "new")
            return renderNewBoard();
          if (parts[0] === "boards") return renderBoards();

          if (parts[0] === "g" && parts[1]) return renderBoard(parts[1]);
          if (parts[0] === "p" && parts[1]) return renderPost(parts[1]);

          // fallback
          return renderHome();
        } catch (err) {
          viewEl.innerHTML = cardShell(`
      <div class="p-6">
        <h3 class="font-extrabold text-lg">에러</h3>
        <p class="mt-2 text-sm text-slate-300">데이터를 불러오다가 문제가 생겼어.</p>
        <pre class="mt-3 text-xs text-rose-200 whitespace-pre-wrap bg-black/30 border border-white/10 rounded-2xl p-3 overflow-auto">${esc(
          err?.message || String(err)
        )}</pre>
        <div class="mt-4 flex gap-2">
          <button class="tap px-3 py-2 rounded-xl bg-white/10 border border-white/10 hover:bg-white/15" onclick="location.hash='#/'">피드로</button>
          <button class="tap px-3 py-2 rounded-xl bg-white/10 border border-white/10 hover:bg-white/15" onclick="location.reload()">새로고침</button>
        </div>
      </div>
    `);
        }
      }

      window.addEventListener("hashchange", render);
      render();

      /**
       * ============================
       * ✅ 13) (옵션) 판 자동 비활성화 안내
       * ============================
       * Supabase에서 스케줄(예: 30분~1시간마다)로 아래 SQL을 실행하면 “죽은 판 숨김”이 완성됨.
       *
       * update public.boards
       * set is_active = false
       * where last_activity_at < now() - interval '24 hours';
       */
    </script>
    <script>
      (function () {
        const translations = {
          ko: {
            tagline: "흘린 말 하나가, 스토리가 되는 곳",
            heroTitle: "Flow - 익명커뮤니티",
            moreServices: "다른 서비스 보기",
            writeButton: "✍️ 글쓰기",
            tabFeed: "🏠 피드",
            tabBoards: "🧩 살아있는 판",
            tabNewBoard: "➕ 판 만들기",
            statusTitle: "오늘의 흐름",
            statusTagline: "글을 쓰면 생각이 정리 돼",
            statBoardsLabel: "판",
            statPostsLabel: "글",
            statCommentsLabel: "댓글",
            composeTitle: "✍️ 글쓰기",
            composeSubtitle: "판을 고르고, 한 번에 툭.",
            closeCompose: "닫기",
            composeLabelName: "닉네임(선택)",
            composeLabelBoard: "판 선택",
            composeLabelBody: "본문",
            composeHint: "쿨타임: 글 20초",
            composeButtonBoard: "판 먼저 만들기",
            composeButtonSubmit: "게시",
            placeholderNickname: "익명",
            placeholderBody: "요즘 드는 생각 한 줄…",
          },
          en: {
            tagline: "Flow — where every dropped word becomes a story",
            heroTitle: "Flow — Anonymous Community",
            moreServices: "See other services",
            writeButton: "✍️ Write",
            tabFeed: "🏠 Feed",
            tabBoards: "🧩 Active Boards",
            tabNewBoard: "➕ Create Board",
            statusTitle: "Today's Flow",
            statusTagline: "Writing clears your mind",
            statBoardsLabel: "Boards",
            statPostsLabel: "Posts",
            statCommentsLabel: "Comments",
            composeTitle: "✍️ Compose",
            composeSubtitle: "Pick a board and drop a thought.",
            closeCompose: "Close",
            composeLabelName: "Nickname (optional)",
            composeLabelBoard: "Select board",
            composeLabelBody: "Body",
            composeHint: "Cooldown: 20s per post",
            composeButtonBoard: "Create board first",
            composeButtonSubmit: "Post",
            placeholderNickname: "Anonymous",
            placeholderBody: "Share a thought in one line…",
          },
        };

        const supportedLangs = ["ko", "en"];
        const defaultLang = "ko";
        const storageKey = "flow_lang";
        const canonicalBase = "https://flow.funnyfunny.cloud/";
        const keywordsByLang = {
          ko: "Flow, 익명커뮤니티, 게시판, fun community",
          en: "Flow anonymous community, realtime boards, share thoughts",
        };
        let currentLang = defaultLang;


        function getTranslation(key) {
          return (
            (translations[currentLang] && translations[currentLang][key]) ??
            translations.ko[key] ??
            ""
          );
        }

        function applyTranslations(lang) {
          const nextLang = supportedLangs.includes(lang) ? lang : defaultLang;
          currentLang = nextLang;
          document.documentElement.lang = currentLang;

          document.querySelectorAll("[data-i18n]").forEach((el) => {
            const key = el.getAttribute("data-i18n");
            if (!key) return;
            const value = getTranslation(key);
            if (value) {
              el.textContent = value;
            }
          });

          document
            .querySelectorAll("[data-i18n-placeholder]")
            .forEach((el) => {
              const key = el.getAttribute("data-i18n-placeholder");
              if (!key) return;
              const value = getTranslation(key);
              if (value) {
                el.setAttribute("placeholder", value);
              }
            });

          document.querySelectorAll(".lang-switch button").forEach((btn) => {
            const isActive = btn.dataset.lang === currentLang;
            btn.classList.toggle("active", isActive);
          });
          SeoHelper.applySeoSettings({
            lang: currentLang,
            keywordsByLang,
            supportedLangs,
            defaultLang,
            canonicalBase,
          });
        }

        function setLang(lang, { persist = true, updateUrl = true } = {}) {
          const next = supportedLangs.includes(lang) ? lang : defaultLang;
          if (persist) {
            localStorage.setItem(storageKey, next);
          }
          if (updateUrl) {
            const url = new URL(window.location.href);
            url.searchParams.set("lang", next);
            window.history.replaceState({}, "", url.toString());
          }
          applyTranslations(next);
        }

        function detectLang() {
          const url = new URL(window.location.href);
          const param = url.searchParams.get("lang");
          if (supportedLangs.includes(param)) return param;
          const stored = localStorage.getItem(storageKey);
          if (supportedLangs.includes(stored)) return stored;
          const browserLang =
            navigator.languages && navigator.languages.length
              ? navigator.languages[0]
              : navigator.language;
          if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
            return "ko";
          }
          return defaultLang;
        }

        window.flowTranslate = {
          t: (key) => getTranslation(key),
          setLang,
          detectLang,
        };

        function initLangSwitcher() {
          document.querySelectorAll(".lang-switch button").forEach((btn) => {
            btn.addEventListener("click", () => {
              setLang(btn.dataset.lang, { persist: true, updateUrl: true });
            });
          });
        }

        function setup() {
          initLangSwitcher();
          setLang(detectLang(), { persist: true, updateUrl: false });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", setup);
        } else {
          setup();
        }
      })();
    </script>
