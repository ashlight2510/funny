<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🔥</div><div><h1>습관 연속 일수</h1><p class="sub">시작일·오늘 → 연속 일수</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>시작일</label><input type="date" id="start" /></div>
      <div class="field"><label>오늘 (기준일)</label><input type="date" id="today" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>연속 일수</span><span class="v" id="days"></span></div>

  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  var start=document.getElementById("start"), today=document.getElementById("today");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), daysEl=document.getElementById("days");
  var t=new Date(); today.value=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  btn.addEventListener("click",function(){
    var s=start.value, e=today.value; if(!s||!e){ res.classList.remove("show"); return; }
    var d1=new Date(s), d2=new Date(e); var diff=(d2-d1)/(24*60*60*1000);
    daysEl.textContent=diff<0?"—":Math.floor(diff)+"일"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
