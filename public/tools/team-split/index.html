  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#ef4444;--accent2:#3b82f6;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#dc2626,#ef4444);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field textarea{width:100%;min-height:100px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);font-size:14px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;}
    .team{margin-bottom:12px;} .team h4{margin:0 0 6px;font-size:14px;} .team.a h4{color:var(--accent);} .team.b h4{color:var(--accent2);}
    .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; } .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
body:has(#tool-share-block) { flex-wrap: wrap; }
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; width: 100%; flex: 0 0 100%; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }

<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⚽</div><div><h1>팀 나누기</h1><p class="sub">이름 입력 → A팀 B팀</p></div></div></header>
    <div class="panel">
      <div class="field"><label>이름 (한 줄에 하나씩)</label><textarea id="names" placeholder="철수&#10;영희&#10;민수&#10;지연"></textarea></div>
      <button type="button" class="btn" id="btnSplit">팀 나누기</button>
      <div class="result" id="result">
        <div class="team a"><h4>A팀</h4><div id="teamA"></div></div>
        <div class="team b"><h4>B팀</h4><div id="teamB"></div></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/team-split-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/random-name/">이름 랜덤</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){ function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  var names=document.getElementById("names"), btn=document.getElementById("btnSplit"), res=document.getElementById("result"), teamA=document.getElementById("teamA"), teamB=document.getElementById("teamB");
  btn.addEventListener("click",function(){ var arr=names.value.split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean); shuffle(arr); var mid=Math.ceil(arr.length/2); teamA.textContent=arr.slice(0,mid).join(", "); teamB.textContent=arr.slice(mid).join(", "); res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
