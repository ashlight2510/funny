<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">💾</div><div><h1>데이터 용량</h1><p class="sub">KB·MB·GB·TB 변환 (1024 기준)</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="row">
        <div class="field"><label>값</label><input type="number" id="val" value="1" step="any" /></div>
        <div class="field"><label>단위</label><select id="unit"><option value="KB">KB</option><option value="MB">MB</option><option value="GB" selected>GB</option><option value="TB">TB</option></select></div>
      </div>
      <button type="button" class="btn" id="btnCalc">변환</button>
      <div class="result" id="result">
        <div class="result-item"><span>KB</span><span class="v" id="KB"></span></div>
        <div class="result-item"><span>MB</span><span class="v" id="MB"></span></div>
        <div class="result-item"><span>GB</span><span class="v" id="GB"></span></div>
        <div class="result-item"><span>TB</span><span class="v" id="TB"></span></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/data-size-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  var K=1024; var toB={KB:K,MB:K*K,GB:K*K*K,TB:K*K*K*K};
  function fmt(x){ return x>=1?x.toFixed(4):x.toFixed(6); }
  var val=document.getElementById("val"), unit=document.getElementById("unit");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result");
  btn.addEventListener("click",function(){
    var v=parseFloat(val.value)||0; var u=unit.value; var bytes=v*toB[u];
    document.getElementById("KB").textContent=fmt(bytes/toB.KB); document.getElementById("MB").textContent=fmt(bytes/toB.MB);
    document.getElementById("GB").textContent=fmt(bytes/toB.GB); document.getElementById("TB").textContent=fmt(bytes/toB.TB);
    res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
