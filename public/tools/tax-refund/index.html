<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>세금 환급·추가납부 계산기 | 산출세액 vs 납부액 | FunnyFunny Cloud</title>
    <meta name="description" content="산출세액과 이미 낸 세금을 입력하면 환급액 또는 추가납부액을 계산합니다. 연말정산·종합소득세 참고용." />
    <meta property="og:title" content="세금 환급·추가납부 계산기 | FunnyFunny Cloud" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/tax-refund/" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/tax-refund/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #6366f1; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
      .result-item .v { font-weight: 700; color: var(--accent); }
      .result-item.refund .v { color: #22c55e; }
      .result-item.owe .v { color: #ef4444; }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">🧾</div>
          <div>
            <h1>세금 환급·추가납부 계산기</h1>
            <p class="sub">산출세액 vs 이미 낸 세금 → 환급 또는 추가납부</p>
          </div>
        </div>
      </header>
      <div class="panel">
        <h3>입력</h3>
        <div class="field">
          <label>산출세액 (원) — 연말정산·종합소득세 등</label>
          <input type="number" id="calculated" min="0" step="1000" value="1000000" />
        </div>
        <div class="field">
          <label>이미 낸 세금 (원) — 원천징수·예납 등</label>
          <input type="number" id="paid" min="0" step="1000" value="1200000" />
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item" id="resultRow">
            <span id="resultLabel"></span>
            <span class="v" id="resultValue"></span>
          </div>
          <p class="note">참고용입니다. 지방세·가산세 등은 별도이며, 정확한 금액은 국세청·연말정산서를 확인하세요.</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/tax-refund-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/salary-tax/">간이 세금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>
    <script>
      (function(){
        function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
        var calculated = document.getElementById("calculated");
        var paid = document.getElementById("paid");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var resultRow = document.getElementById("resultRow");
        var resultLabel = document.getElementById("resultLabel");
        var resultValue = document.getElementById("resultValue");
        btnCalc.addEventListener("click", function(){
          var calc = parseFloat(calculated.value) || 0;
          var p = parseFloat(paid.value) || 0;
          var diff = p - calc;
          resultRow.classList.remove("refund", "owe");
          if (diff > 0) {
            resultLabel.textContent = "환급 예상";
            resultValue.textContent = fmt(diff);
            resultRow.classList.add("refund");
          } else if (diff < 0) {
            resultLabel.textContent = "추가 납부";
            resultValue.textContent = fmt(-diff);
            resultRow.classList.add("owe");
          } else {
            resultLabel.textContent = "차이";
            resultValue.textContent = "0원";
          }
          result.classList.add("show");
        });
        document.getElementById("btnShare").addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById("tool-share-toast").textContent = "복사했어요"; document.getElementById("tool-share-toast").style.display = "inline"; setTimeout(function(){ document.getElementById("tool-share-toast").style.display = "none"; }, 1500); });
        });
      })();
    </script>
  </body>
</html>
