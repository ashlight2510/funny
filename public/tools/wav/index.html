<body>
  <div class="lang-switch">
    <button class="active">한국어</button>
    <button onclick="window.location.href='en.html'">English</button>
  </div>
  
  <div class="card">
    <h1>🎵 WAV → MP3 변환기</h1>
    <div class="muted" style="margin-bottom: 8px;">
      ✨ 변환은 브라우저에서만 수행됩니다. (서버 업로드 없음)<br>
      🔧 MP3 인코딩을 위해 ffmpeg.wasm을 로드합니다.
      <br><a href="guide.html" style="color: #667eea; text-decoration: none; font-weight: 600; margin-top: 8px; display: inline-block;">📖 사용 가이드 보기 →</a>
    </div>

    <div class="row" style="margin-top:16px;">
      <label for="wavFile">WAV 파일</label>
      <input id="wavFile" type="file" accept=".wav,audio/wav" />
    </div>

    <div class="row">
      <label for="bitrate">MP3 비트레이트</label>
      <select id="bitrate">
        <option value="96k">96 kbps</option>
        <option value="128k" selected>128 kbps</option>
        <option value="192k">192 kbps</option>
        <option value="256k">256 kbps</option>
        <option value="320k">320 kbps</option>
      </select>

      <button id="btnLoad">1) 변환 엔진 로드</button>
      <button id="btnConvert" disabled>2) MP3로 변환</button>
    </div>

    <div class="row">
      <div id="status" class="muted">상태: 대기 중</div>
    </div>

    <div class="row">
      <a id="download" href="#" download style="display:none; font-weight:700;">MP3 다운로드</a>
    </div>

    <div class="log" id="log"></div>

    <div class="tip-box">
      <div class="muted" style="margin:0;">
        <span class="warn">💡 팁</span>:
        파일이 크면(수십~수백 MB) 변환에 시간이 걸리고, 모바일은 메모리 부족으로 실패할 수 있어요.
      </div>
    </div>
    
    <div class="other-services">
      <a href="https://funnyfunny.cloud" target="_blank" rel="noopener noreferrer" class="other-services-btn">
        🌐 다른 서비스 보기
      </a>
    </div>

    <div id="tool-share-block">
      <button type="button" onclick="var u=location.href;if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){var t=document.getElementById('tool-share-toast');if(t){t.textContent='복사했어요';t.style.display='inline';setTimeout(function(){t.style.display='none';},1500);}});try{if(window.amplitude)window.amplitude.track('share_click',{method:'copy',tool:location.pathname.split('/').filter(Boolean).pop()||''});}catch(e){}">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>
  </div>

  <script src="./vendor/ffmpeg/util.min.js"></script>
  <script src="./vendor/ffmpeg/ffmpeg.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const wavFile = $("wavFile");
    const bitrate = $("bitrate");
    const btnLoad = $("btnLoad");
    const btnConvert = $("btnConvert");
    const status = $("status");
    const logBox = $("log");
    const download = $("download");

    const log = (msg) => {
      logBox.textContent += msg + "\n";
      logBox.scrollTop = logBox.scrollHeight;
    };

    function setStatus(text) {
      status.textContent = "상태: " + text;
    }

    let ffmpeg = null;
    let loaded = false;
    let fetchFileFn = null;
    let toBlobURLFn = null;

    btnLoad.addEventListener("click", async () => {
      const ffmpegNS = window.FFmpegWASM || window.FFmpegWasm || window.FFmpeg || {};
      const utilNS = window.FFmpegUtil || {};
      const { FFmpeg } = ffmpegNS;
      const { fetchFile, toBlobURL } = utilNS;

      if (!FFmpeg || !fetchFile || !toBlobURL) {
        setStatus("로컬 라이브러리 로드 실패 ❌");
        log("FFmpeg 로컬 스크립트를 불러오지 못했습니다.");
        btnLoad.disabled = true;
        btnConvert.disabled = true;
        return;
      }

      fetchFileFn = fetchFile;
      toBlobURLFn = toBlobURL;

      try {
        btnLoad.disabled = true;
        logBox.textContent = "";

        setStatus("변환 엔진 로드 중...");
        ffmpeg = new FFmpeg();
        ffmpeg.on("log", ({ message }) => {
          log(message);
        });

        const baseURL = "./vendor/ffmpeg";
        await ffmpeg.load({
          coreURL: await toBlobURLFn(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
          wasmURL: await toBlobURLFn(`${baseURL}/ffmpeg-core.wasm`, "application/wasm")
        });

        loaded = true;
        setStatus("로드 완료 ✅ 파일 선택 후 변환하세요");
        btnConvert.disabled = false;
      } catch (e) {
        console.error(e);
        setStatus("로드 실패 ❌ (콘솔 확인)");
        log("로드 실패: " + (e?.message ?? String(e)));
        btnLoad.disabled = false;
      }
    });

    btnConvert.addEventListener("click", async () => {
      if (!loaded || !ffmpeg) return;

      const file = wavFile.files?.[0];
      if (!file) {
        setStatus("WAV 파일을 먼저 선택하세요");
        return;
      }

      download.style.display = "none";
      download.href = "#";

      const inName = "input.wav";
      const outName = "output.mp3";

      try {
        btnConvert.disabled = true;
        setStatus("파일 로딩/쓰기 중...");
        logBox.textContent = "";

        await ffmpeg.writeFile(inName, await fetchFileFn(file));

        setStatus("변환 중... (브라우저가 잠시 버벅일 수 있어요)");
        await ffmpeg.exec([
          "-i", inName,
          "-codec:a", "libmp3lame",
          "-b:a", bitrate.value,
          "-vn",
          outName
        ]);

        setStatus("결과 추출/다운로드 준비 중...");
        const data = await ffmpeg.readFile(outName);

        const mp3Blob = new Blob([data], { type: "audio/mpeg" });
        const url = URL.createObjectURL(mp3Blob);

        const base = file.name.replace(/\\.wav$/i, "");
        download.download = base + ".mp3";
        download.href = url;
        download.style.display = "inline-block";
        download.textContent = "MP3 다운로드 (" + download.download + ")";

        setStatus("완료 ✅");
        log("변환 완료! 위의 다운로드 링크를 클릭하세요.");

        try {
          await ffmpeg.deleteFile(inName);
          await ffmpeg.deleteFile(outName);
        } catch (_) {}
      } catch (e) {
        console.error(e);
        setStatus("변환 실패 ❌ (콘솔 확인)");
        log("변환 실패: " + (e?.message ?? String(e)));
      } finally {
        btnConvert.disabled = false;
      }
    });
  </script>
</body>
