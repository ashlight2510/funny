<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⚖️</div><div><h1>손익분기점 계산기</h1><p class="sub">고정비·변동비·단가 → 손익분기 개수</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>고정비 (원/월)</label><input type="number" id="fixed" min="0" step="10000" value="5000000" /></div>
      <div class="field"><label>단위당 변동비 (원)</label><input type="number" id="variable" min="0" step="100" value="3000" /></div>
      <div class="field"><label>판매 단가 (원)</label><input type="number" id="price" min="0" step="100" value="10000" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>손익분기 판매 개수</span><span class="v" id="qty"></span></div>
        <p class="note">손익분기 = 고정비 ÷ (판매단가 − 변동비). 변동비 ≥ 단가면 분기점 없음.</p>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>

  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  var fixed=document.getElementById("fixed"), variable=document.getElementById("variable"), price=document.getElementById("price");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), qtyEl=document.getElementById("qty");
  btn.addEventListener("click",function(){
    var F=parseFloat(fixed.value)||0, v=parseFloat(variable.value)||0, p=parseFloat(price.value)||0;
    if(p<=v){ qtyEl.textContent="— (변동비가 단가 이상)"; res.classList.add("show"); return; }
    var q=Math.ceil(F/(p-v)); qtyEl.textContent=q.toLocaleString() + "개"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
