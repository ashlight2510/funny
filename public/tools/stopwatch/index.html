    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.footer-links a { color: var(--accent, #818cf8); text-decoration: none; } .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
body:has(#tool-share-block) { flex-wrap: wrap; }

<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⏱️</div><div><h1>스톱워치</h1><p class="sub">시작/일시/리셋</p></div></div></header>
    <div class="panel">
      <div class="result" id="out">0:00.0</div>
      <button type="button" class="btn" id="btnStart" style="background:#22c55e;">시작</button>
      <button type="button" class="btn btn-ghost" id="btnStop">일시정지</button>
      <button type="button" class="btn btn-ghost" id="btnReset">리셋</button>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>

  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){ var out=document.getElementById("out"), btnStart=document.getElementById("btnStart"), btnStop=document.getElementById("btnStop"), btnReset=document.getElementById("btnReset"); var start=0, elapsed=0, id=null;
  function show(){ var t=elapsed+(id?Date.now()-start:0); var m=Math.floor(t/60000), s=Math.floor((t%60000)/1000), ms=Math.floor((t%1000)/100); out.textContent=m+":"+(s<10?"0":"")+s+"."+ms; }
  btnStart.addEventListener("click",function(){ if(id) return; start=Date.now(); id=setInterval(show,100); });
  btnStop.addEventListener("click",function(){ if(id){ elapsed+=Date.now()-start; clearInterval(id); id=null; } });
  btnReset.addEventListener("click",function(){ if(id) clearInterval(id); id=null; elapsed=0; start=0; out.textContent="0:00.0"; });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
