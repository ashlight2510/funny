<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>동전 3번 | 3회 던지기 결과 | FunnyFunny Cloud</title>
  <meta name="description" content="동전을 3번 던진 결과(앞/뒤)를 랜덤으로 뽑습니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/coin-flip-3/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#eab308;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ca8a04,#eab308);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .btn{padding:14px 24px;border-radius:12px;border:none;font-weight:600;font-size:16px;cursor:pointer;background:var(--accent);color:#0f172a;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:center;font-size:22px;} .result.show{display:block;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🪙</div><div><h1>동전 3번</h1><p class="sub">3회 던지기</p></div></div></header>
    <div class="panel">
      <button type="button" class="btn" id="btnFlip">3번 던지기</button>
      <div class="result" id="result"><span id="out"></span></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/coin-flip-3-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/coin-flip/">동전 던지기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ var btn=document.getElementById("btnFlip"), res=document.getElementById("result"), out=document.getElementById("out");
  btn.addEventListener("click",function(){ var a=Math.random()<0.5?"앞":"뒤", b=Math.random()<0.5?"앞":"뒤", c=Math.random()<0.5?"앞":"뒤"; out.textContent=a+" · "+b+" · "+c; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
