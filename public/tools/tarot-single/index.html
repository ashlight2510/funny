<body>
  <div class="wrap">

  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){
  var cards=[["더 풀","새로운 시작이 다가온다."],["황제","결정을 내릴 때다."],["연인","선택이 중요해진다."],["전차","앞으로 나아가라."],["은둔자","잠시 쉬어도 좋다."],["휠 오브 포춘","흐름을 받아들이라."],["정의","공정함을 생각하라."],["매달린 사람","시각을 바꿔보라."],["죽음","끝은 새 시작이다."],["절제","균형을 찾으라."],["악마","유혹을 의식하라."],["탑","변화가 올 수 있다."],["별","희망을 가져라."],["달","직관을 믿어라."],["태양","밝은 에너지가 있다."],["심판","과거를 정리하라."],["월드","한 단계 완성이다."]];
  var btn=document.getElementById("btnPick"), res=document.getElementById("result"), card=document.getElementById("card"), desc=document.getElementById("desc");
  btn.addEventListener("click",function(){ var i=Math.floor(Math.random()*cards.length); card.textContent=cards[i][0]; desc.textContent=cards[i][1]; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
