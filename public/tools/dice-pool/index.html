<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>다이스 풀 | nD6 중 5 이상 개수 | FunnyFunny Cloud</title>
  <meta name="description" content="6면체 주사위 n개를 던져 5 이상이 나온 개수를 셉니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/dice-pool/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#7c3aed;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6d28d9,#7c3aed);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;} .result .v{font-weight:700;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🎲</div><div><h1>다이스 풀</h1><p class="sub">nD6 중 5 이상 개수</p></div></div></header>
    <div class="panel">
      <div class="field"><label>주사위 개수</label><input type="number" id="n" value="5" min="1" max="20" /></div>
      <button type="button" class="btn" id="btnRoll">던지기</button>
      <div class="result" id="result">
        <div>결과: <span class="v" id="vals"></span></div>
        <div>5 이상 개수: <span class="v" id="count"></span></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/dice-pool-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/dice/">주사위</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ var n=document.getElementById("n"), btn=document.getElementById("btnRoll"), res=document.getElementById("result"), valsEl=document.getElementById("vals"), countEl=document.getElementById("count");
  btn.addEventListener("click",function(){ var k=Math.max(1,Math.min(20,parseInt(n.value,10)||5)); var arr=[]; for(var i=0;i<k;i++) arr.push(Math.floor(Math.random()*6)+1); var c=arr.filter(function(x){ return x>=5; }).length; valsEl.textContent=arr.join(", "); countEl.textContent=c; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
