    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}

<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⏱️</div><div><h1>72법칙·배증 기간</h1><p class="sub">연 수익률 % → 원금 2배 걸리는 년수</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>연 수익률 (%)</label><input type="number" id="rate" min="0.1" max="50" step="0.1" value="7" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>72법칙 (대략)</span><span class="v" id="rule72"></span></div>
        <div class="result-item"><span>정확한 년수</span><span class="v" id="exact"></span></div>
        <p class="note">72법칙: 72 ÷ 연수익률 ≈ 2배 년수. 정확식: ln(2)/ln(1+r).</p>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/doubling-time-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/compound-interest/">복리 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){
  var rate=document.getElementById("rate"), btn=document.getElementById("btnCalc"), res=document.getElementById("result");
  var r72=document.getElementById("rule72"), exactEl=document.getElementById("exact");
  btn.addEventListener("click",function(){
    var r=(parseFloat(rate.value)||0)/100; if(r<=0){ res.classList.remove("show"); return; }
    r72.textContent=(72/ (r*100)).toFixed(1)+"년"; exactEl.textContent=(Math.log(2)/Math.log(1+r)).toFixed(1)+"년"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
