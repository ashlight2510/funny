  <script>
(function(){
  var list=[["♈ 양자리","오늘은 작은 도전이 좋은 날."],["♉ 황소자리","안정을 추구하는 하루."],["♊ 쌍둥이자리","소통이 빛을 발하는 날."],["♋ 게자리","감정에 귀 기울이세요."],["♌ 사자자리","당당함이 통하는 날."],["♍ 처녀자리","꼼꼼함이 도움이 됩니다."],["♎ 천칭자리","균형을 찾는 하루."],["♏ 전갈자리","깊이 있는 대화가 좋아요."],["♐ 사수자리","새로운 경험이 찾아옵니다."],["♑ 염소자리","목표에 한 걸음 다가가는 날."],["♒ 물병자리","아이디어가 샘솟는 날."],["♓ 물고기자리","직관을 믿어보세요."]];
  var btn=document.getElementById("btnPick"), res=document.getElementById("result"), sign=document.getElementById("sign"), msg=document.getElementById("msg");
  btn.addEventListener("click",function(){ var i=Math.floor(Math.random()*list.length); sign.textContent=list[i][0]; msg.textContent=list[i][1]; res.classList.add("show"); });

})();
