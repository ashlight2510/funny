          if (key === 'heroTitle') el.innerHTML = t.heroTitle;
          else if (t[key]) el.textContent = t[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.dataset.i18nPlaceholder;
          if (t[key]) el.placeholder = t[key];
        });
        document.querySelectorAll('.langBtn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        if (typeof applyLang === 'function') applyLang(lang);
      }

      // ============================
      // Supabase 연결 (flow와 동일)
      // ============================
      const SUPABASE_URL = "https://vpezjsuzwmeozaytcqyv.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZXpqc3V6d21lb3pheXRjcXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxMDA0OTIsImV4cCI6MjA3OTY3NjQ5Mn0.Fyjj5yrV2-6w1OKnQXWaL_-7_r1XpuUl-UQq6e6e5vc";
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // ============================
      // 감정 설정
      // ============================
      const EMOTIONS = {
        hui: { emoji: '😊', color: 'hui', desc: '기쁨', slug: 'hui-joy' },
        no: { emoji: '😤', color: 'no', desc: '분노', slug: 'no-anger' },
        ae: { emoji: '💕', color: 'ae', desc: '사랑', slug: 'ae-love' },
        rak: { emoji: '🎉', color: 'rak', desc: '즐거움', slug: 'rak-joy' }
      };

      function getEmotionLabel(emotion) {
        return EMOTION_LABELS[getLang()]?.[emotion] || EMOTION_LABELS.ko[emotion];
      }

      // ============================
      // 상태
      // ============================
      let currentEmotion = 'all';
      let currentSort = 'hot';
      let posts = [];
      let offset = 0;
      const LIMIT = 20;

      // ============================
      // 유틸
      // ============================
      const $ = sel => document.querySelector(sel);
      const $$ = sel => document.querySelectorAll(sel);

      function esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function timeAgo(iso) {
        const diff = Math.max(0, Date.now() - new Date(iso).getTime());
        const m = Math.floor(diff / 60000);
        const ta = I18N[getLang()]?.timeAgo || I18N.en.timeAgo;
        if (m < 1) return ta.just;
        if (m < 60) return `${m}${ta.min}`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h}${ta.hour}`;
        return `${Math.floor(h / 24)}${ta.day}`;
      }

      function getAnonId() {
        let v = localStorage.getItem('emote_anon');
        if (!v) {
          v = crypto?.randomUUID?.() || Date.now() + '-' + Math.random().toString(16).slice(2);
          localStorage.setItem('emote_anon', v);
        }
        return v;
      }

      function inCooldown() {
        const until = Number(localStorage.getItem('emote_cd') || '0');
        return Date.now() < until;
      }

      function setCooldown(ms) {
        localStorage.setItem('emote_cd', String(Date.now() + ms));
      }

      const anonId = getAnonId();

      // 감정 추출 (본문 또는 태그에서)
      function detectEmotion(post) {
        const body = (post.body || '').toLowerCase();
        const boardSlug = post.board?.slug || '';
        for (const [key, val] of Object.entries(EMOTIONS)) {
          if (boardSlug.includes(key) || boardSlug.includes(val.slug)) return key;
        }
        // 이모지 기반 추측
        if (/😊|기쁨|좋|행복|감사/.test(body)) return 'hui';
        if (/😤|화|열받|짜증|분노|억울/.test(body)) return 'no';
        if (/💕|사랑|설렘|좋아|연인|감동/.test(body)) return 'ae';
        if (/🎉|재밌|웃|ㅋ|ㅎ|즐거|신남/.test(body)) return 'rak';
        // 랜덤 폴백
        const keys = Object.keys(EMOTIONS);
        return keys[Math.abs(hashCode(post.id || '')) % keys.length];
      }

      function hashCode(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
        return h;
      }

      // HOT 점수 계산 (추천 + 시간 감쇠)
      function hotScore(post) {
        const empathy = post.empathy_count || 0;
        const comments = post.comment_count || 0;
        const age = (Date.now() - new Date(post.created_at).getTime()) / 3600000; // hours
        return (empathy * 2 + comments) / Math.pow(age + 2, 1.3);
      }

      // ============================
      // 오늘의 질문
      // ============================
      function setDailyQuestion() {
        const questions = DAILY_QUESTIONS[getLang()] || DAILY_QUESTIONS.en;
        const dayIdx = new Date().getDate() % questions.length;
        const q = questions[dayIdx];
        $('#questionText').textContent = q.q;
        $('#answerQuestionBtn').dataset.emotion = q.emotion;
      }

      $('#answerQuestionBtn').addEventListener('click', () => {
        const emotion = $('#answerQuestionBtn').dataset.emotion;
        const questions = DAILY_QUESTIONS[getLang()] || DAILY_QUESTIONS.en;
        openWriteModal(emotion, questions.find(q => q.emotion === emotion)?.q);
      });

      function applyLang(lang) {
        setDailyQuestion();
        loadEmotionRatio();
        renderFeed();
      }

      document.querySelectorAll('.langBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          setLang(btn.dataset.lang);
        });
      });

      // ============================
      // 감정 비율 로드
      // ============================
      async function loadEmotionRatio() {
        try {
          const { data } = await sb.from('posts').select('id, body, board:boards(slug)').eq('is_hidden', false).limit(200);
          if (!data) return;
          const counts = { hui: 0, no: 0, ae: 0, rak: 0 };
          data.forEach(p => {
            const e = detectEmotion(p);
            if (counts[e] !== undefined) counts[e]++;
          });
          const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
          const labels = EMOTION_LABELS[getLang()] || EMOTION_LABELS.ko;
          const ratio = $('#emotionRatio');
          ratio.innerHTML = `
            <span class="px-2 py-1 rounded-full bg-hui-100 text-hui-600">${labels.hui} ${Math.round(counts.hui / total * 100)}%</span>
            <span class="px-2 py-1 rounded-full bg-no-100 text-no-600">${labels.no} ${Math.round(counts.no / total * 100)}%</span>
            <span class="px-2 py-1 rounded-full bg-ae-100 text-ae-600">${labels.ae} ${Math.round(counts.ae / total * 100)}%</span>
            <span class="px-2 py-1 rounded-full bg-rak-100 text-rak-600">${labels.rak} ${Math.round(counts.rak / total * 100)}%</span>
          `;
        } catch (e) { console.error(e); }
      }

      // ============================
      // 피드 로드
      // ============================
      async function loadFeed(append = false) {
        if (!append) {
          offset = 0;
          const loading = I18N[getLang()]?.loading || 'Loading...';
          $('#feed').innerHTML = `<div class="text-center py-12 text-slate-400">${loading}</div>`;
        }

        try {
          let q = sb.from('posts')
            .select('id, body, author_name, anon_id, created_at, comment_count, empathy_count, is_hidden, board:boards(id, slug, title)')
            .eq('is_hidden', false)
            .range(offset, offset + LIMIT - 1);

          if (currentSort === 'new') {
            q = q.order('created_at', { ascending: false });
          } else {
            q = q.order('empathy_count', { ascending: false });
          }

          const { data, error } = await q;
          if (error) throw error;

          let filtered = data || [];

          // 감정 필터
          if (currentEmotion !== 'all') {
            filtered = filtered.filter(p => detectEmotion(p) === currentEmotion);
          }

          // HOT 정렬 시 재정렬
          if (currentSort === 'hot') {
            filtered.sort((a, b) => hotScore(b) - hotScore(a));
          }

          if (append) {
            posts = [...posts, ...filtered];
          } else {
            posts = filtered;
          }

          renderFeed();
          offset += LIMIT;

          $('#loadMoreBtn').classList.toggle('hidden', (data?.length || 0) < LIMIT);
        } catch (e) {
          console.error(e);
          const msg = I18N[getLang()]?.alert?.loadFail || 'Load failed';
          $('#feed').innerHTML = `<div class="text-center py-12 text-red-400">${msg}</div>`;
        }
      }

      function renderFeed() {
        const t = I18N[getLang()] || I18N.en;
        const anonLabel = t.anonymousLabel || 'Anonymous';
        if (posts.length === 0) {
          $('#feed').innerHTML = `
            <div class="glass rounded-2xl p-8 text-center">
              <p class="text-4xl mb-3">📝</p>
              <p class="font-bold text-slate-600">${t.emptyFeed}</p>
              <p class="text-sm text-slate-400 mt-1">${t.emptyFeedSub}</p>
              <button onclick="openWriteModal()" class="tap mt-4 px-5 py-2 rounded-xl bg-gradient-to-r from-amber-400 to-pink-400 text-white font-bold">
                ${t.writeCta}
              </button>
            </div>
          `;
          return;
        }

        $('#feed').innerHTML = posts.map((p, i) => {
          const emotion = detectEmotion(p);
          const em = EMOTIONS[emotion];
          const label = getEmotionLabel(emotion);
          const isHot = p.empathy_count >= 3;
          const summary = extractSummary(p.body);
          const preview = p.body.slice(0, 120) + (p.body.length > 120 ? '...' : '');

          return `
            <article class="glass rounded-2xl p-4 card-enter cursor-pointer hover:shadow-lg transition-shadow" data-post-id="${p.id}" style="animation-delay: ${i * 50}ms">
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-full bg-${em.color}-100 flex items-center justify-center text-xl flex-shrink-0">
                  ${em.emoji}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-${em.color}-100 text-${em.color}-700">${em.emoji} ${label}</span>
                    ${isHot ? '<span class="px-2 py-0.5 rounded-full text-xs font-bold text-white hot-badge">🔥 HOT</span>' : ''}
                    <span class="text-xs text-slate-400">${esc(p.author_name || anonLabel)} · ${timeAgo(p.created_at)}</span>
                  </div>
                  ${summary ? `<p class="mt-1 font-bold text-slate-800">${esc(summary)}</p>` : ''}
                  <p class="mt-1 text-sm text-slate-600 line-clamp-2">${esc(preview)}</p>
                  <div class="mt-2 flex items-center gap-3 text-xs text-slate-500">
                    <span class="flex items-center gap-1">❤️ ${p.empathy_count || 0}</span>
                    <span class="flex items-center gap-1">💬 ${p.comment_count || 0}</span>
                  </div>
                </div>
              </div>
            </article>
          `;
        }).join('');

        // 클릭 이벤트
        $$('#feed article[data-post-id]').forEach(el => {
          el.addEventListener('click', () => openDetail(el.dataset.postId));
        });
      }

      function extractSummary(body) {
        // 첫 줄이 짧으면 요약으로 사용
        const lines = body.split('\n').filter(l => l.trim());
        if (lines[0] && lines[0].length <= 50 && lines.length > 1) {
          return lines[0];
        }
        return '';
      }

      // ============================
      // 상세 보기
      // ============================
      async function openDetail(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;

        const t = I18N[getLang()] || I18N.en;
        const emotion = detectEmotion(post);
        const em = EMOTIONS[emotion];
        const label = getEmotionLabel(emotion);

        // 댓글 로드
        const { data: comments } = await sb.from('comments')
          .select('id, body, author_name, created_at')
          .eq('post_id', postId)
          .order('created_at', { ascending: true });

        const anonLabel = t.anonymousLabel || 'Anonymous';
        const commentsHtml = (comments || []).map(c => `
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-2 text-xs text-slate-500 mb-1">
              <span class="font-semibold text-slate-700">${esc(c.author_name || anonLabel)}</span>
              <span>·</span>
              <span>${timeAgo(c.created_at)}</span>
            </div>
            <p class="text-sm text-slate-700">${esc(c.body)}</p>
          </div>
        `).join('');

        $('#detailContent').innerHTML = `
          <div class="p-4 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="px-2 py-1 rounded-full text-sm font-bold bg-${em.color}-100 text-${em.color}-700">${em.emoji} ${label}</span>
              <span class="text-sm text-slate-500">${esc(post.author_name || t.anonymousLabel)} · ${timeAgo(post.created_at)}</span>
            </div>
            <button onclick="closeDetail()" class="tap px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600 font-semibold hover:bg-slate-200">${t.close}</button>
          </div>
          <div class="p-4">
            <p class="text-slate-800 whitespace-pre-wrap leading-relaxed">${esc(post.body)}</p>
            <div class="mt-4 flex items-center gap-4">
              <button onclick="empathize('${postId}')" class="tap flex items-center gap-2 px-4 py-2 rounded-xl bg-pink-50 text-pink-600 font-semibold border border-pink-200 hover:bg-pink-100">
                ❤️ ${t.empathize} ${post.empathy_count || 0}
              </button>
              <span class="text-sm text-slate-500">💬 ${t.comments} ${post.comment_count || 0}</span>
            </div>
          </div>
          <div class="p-4 border-t border-slate-200">
            <h4 class="font-bold text-slate-700 mb-3">💬 ${t.comments}</h4>
            <div class="space-y-2 mb-4 max-h-60 overflow-y-auto">
              ${commentsHtml || `<p class="text-sm text-slate-400">${t.noComments}</p>`}
            </div>
            <div class="flex gap-2">
              <input id="commentInput" type="text" maxlength="500" placeholder="${t.commentPlaceholder}" class="flex-1 px-3 py-2 rounded-xl bg-white border border-slate-200 outline-none focus:border-amber-400" />
              <button onclick="submitComment('${postId}')" class="tap px-4 py-2 rounded-xl bg-amber-400 text-white font-bold">${t.postComment}</button>
            </div>
          </div>
        `;

        $('#detailModal').classList.remove('hidden');
      }

      function closeDetail() {
        $('#detailModal').classList.add('hidden');
      }

      $('#detailModal').addEventListener('click', e => {
        if (e.target === $('#detailModal') || e.target.classList.contains('modal-overlay')) {
          closeDetail();
        }
      });

      // ============================
      // 공감 / 댓글
      // ============================
      async function empathize(postId) {
        const t = I18N[getLang()]?.alert || I18N.en.alert;
        const key = `emote_emp_${postId}`;
        if (localStorage.getItem(key)) {
          alert(t.alreadyEmpathy);
          return;
        }
        try {
          await sb.rpc('increment_empathy', { row_id: postId });
          localStorage.setItem(key, '1');
          alert(t.empathyDone);
          loadFeed();
          closeDetail();
        } catch (e) {
          console.error(e);
          alert(t.empathyFail);
        }
      }

      async function submitComment(postId) {
        const t = I18N[getLang()]?.alert || I18N.en.alert;
        const body = $('#commentInput').value.trim();
        if (!body) return alert(t.enterComment);
        if (inCooldown()) return alert(t.cooldown);

        try {
          const anonLabel = I18N[getLang()]?.anonymousLabel || 'Anonymous';
          const { error } = await sb.from('comments').insert({
            post_id: postId,
            body,
            author_name: anonLabel,
            anon_id: anonId
          });
          if (error) throw error;
          setCooldown(10000);
          openDetail(postId);
        } catch (e) {
          console.error(e);
          alert(t.commentFail);
        }
      }

      // ============================
      // 글쓰기 모달
      // ============================
      let selectedEmotion = '';

      const PREFILL_PREFIX = { ko: '[오늘의 질문: ', en: "[Today's question: " };
      const PREFILL_SUFFIX = { ko: ']\n\n', en: ']\n\n' };

      function openWriteModal(emotion = '', prefill = '') {
        $('#writeModal').classList.remove('hidden');
        const lang = getLang();
        const prefix = PREFILL_PREFIX[lang] || PREFILL_PREFIX.en;
        const suffix = PREFILL_SUFFIX[lang] || PREFILL_SUFFIX.en;
        $('#writeBody').value = prefill ? `${prefix}${prefill}${suffix}` : '';
        $('#writeCount').textContent = `${$('#writeBody').value.length}/5000`;
        if (emotion) selectWriteEmotion(emotion);
      }

      function closeWriteModal() {
        $('#writeModal').classList.add('hidden');
        selectedEmotion = '';
        $$('.writeEmotionBtn').forEach(b => b.classList.remove('ring-2', 'ring-offset-2'));
        $('#templateHint').classList.add('hidden');
      }

      $('#openWriteBtn').addEventListener('click', () => openWriteModal());
      $('#closeWriteBtn').addEventListener('click', closeWriteModal);
      $('#writeModal').addEventListener('click', e => {
        if (e.target === $('#writeModal') || e.target.classList.contains('modal-overlay')) {
          closeWriteModal();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (!$('#writeModal').classList.contains('hidden')) closeWriteModal();
        else if (!$('#detailModal').classList.contains('hidden')) closeDetail();
      });

      function selectWriteEmotion(emotion) {
        selectedEmotion = emotion;
        $$('.writeEmotionBtn').forEach(b => {
          const isActive = b.dataset.writeEmotion === emotion;
          b.classList.toggle('ring-2', isActive);
          b.classList.toggle('ring-offset-2', isActive);
        });
        $('#templateHint').classList.remove('hidden');
        const templates = TEMPLATES[getLang()] || TEMPLATES.en;
        $('#templateText').textContent = templates[emotion];
      }

      $$('.writeEmotionBtn').forEach(btn => {
        btn.addEventListener('click', () => selectWriteEmotion(btn.dataset.writeEmotion));
      });

      $('#writeBody').addEventListener('input', () => {
        $('#writeCount').textContent = `${$('#writeBody').value.length}/5000`;
      });

      $('#writeBody').addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          $('#submitWriteBtn').click();
        }
      });

      $('#submitWriteBtn').addEventListener('click', async () => {
        const t = I18N[getLang()]?.alert || I18N.en.alert;
        const anonLabel = I18N[getLang()]?.anonymousLabel || 'Anonymous';
        if (!selectedEmotion) return alert(t.selectEmotion);
        const body = $('#writeBody').value.trim();
        if (!body) return alert(t.enterBody);
        if (inCooldown()) return alert(t.cooldown);

        const nickname = $('#writeNickname').value.trim() || anonLabel;

        try {
          // 해당 감정의 board 찾기 또는 생성
          let { data: board } = await sb.from('boards').select('id').eq('slug', EMOTIONS[selectedEmotion].slug).single();

          if (!board) {
            const { data: newBoard, error: createErr } = await sb.from('boards').insert({
              slug: EMOTIONS[selectedEmotion].slug,
              title: `${EMOTIONS[selectedEmotion].emoji} ${EMOTIONS[selectedEmotion].label} (${EMOTIONS[selectedEmotion].desc})`,
              description: `${EMOTIONS[selectedEmotion].desc} 감정의 썰을 나누는 공간`,
              is_active: true
            }).select().single();
            if (createErr) throw createErr;
            board = newBoard;
          }

          const { error } = await sb.from('posts').insert({
            board_id: board.id,
            body,
            author_name: nickname,
            anon_id: anonId
          });

          if (error) throw error;

          setCooldown(30000);
          closeWriteModal();
          loadFeed();
          loadEmotionRatio();
          alert(t.postSuccess);
        } catch (e) {
          console.error(e);
          const errMsg = getLang() === 'ko' ? '등록 실패: ' : 'Post failed: ';
          $('#writeError').textContent = errMsg + (e.message || '');
          $('#writeError').classList.remove('hidden');
        }
      });

      // ============================
      // 탭 이벤트
      // ============================
      $$('.emotion-btn[data-emotion]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentEmotion = btn.dataset.emotion;
          $$('.emotion-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadFeed();
        });
      });

      $$('.sortBtn[data-sort]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentSort = btn.dataset.sort;
          $$('.sortBtn').forEach(b => {
            b.classList.remove('bg-orange-100', 'text-orange-700', 'border-orange-200');
            b.classList.add('bg-slate-100', 'text-slate-600', 'border-slate-200');
          });
          btn.classList.remove('bg-slate-100', 'text-slate-600', 'border-slate-200');
          btn.classList.add('bg-orange-100', 'text-orange-700', 'border-orange-200');
          loadFeed();
        });
      });

      $('#loadMoreBtn').addEventListener('click', () => loadFeed(true));

      // ============================
      // 초기화
      // ============================
      setLang(getLang());
      loadFeed();
    </script><div style="text-align:center;margin:16px 0;font-size:14px;"><a href="https://funnyfunny.cloud/guide/emote-emotion/">사용 가이드</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div><div id="tool-share-block" style="text-align:center;margin:8px 0;font-size:13px;">

<span id="tool-share-toast" style="display:none;margin-left:8px;color:#666;font-size:12px;"></span>
</div>
