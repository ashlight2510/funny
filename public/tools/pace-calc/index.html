<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>페이스 계산기 | 거리·시간 → km당 pace | FunnyFunny Cloud</title>
  <meta name="description" content="주행/주파 거리와 소요 시간을 입력하면 km당 페이스(분:초)를 계산합니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/pace-calc/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#2563eb;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#2563eb);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .panel h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--muted);}
    .field{margin-bottom:14px;} .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);font-size:14px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;}
    .result-item{display:flex;justify-content:space-between;padding:8px 0;} .result-item .v{font-weight:700;color:var(--accent);}
    .note{font-size:12px;color:var(--muted);margin-top:12px;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🏃</div><div><h1>페이스 계산기</h1><p class="sub">거리·시간 → km당 pace(분:초)</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="row">
        <div class="field"><label>거리 (km)</label><input type="number" id="distance" min="0.1" step="0.1" value="5" /></div>
        <div class="field"><label>소요 시간 (분)</label><input type="number" id="mins" min="0" step="0.5" value="30" /></div>
      </div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>페이스 (분/km)</span><span class="v" id="pace"></span></div>
        <p class="note">시간(분) ÷ 거리(km). 러닝·조정 등에 참고하세요.</p>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/pace-calc-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/marathon-pace/">마라톤 페이스</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){
  var distance=document.getElementById("distance"), mins=document.getElementById("mins");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), paceEl=document.getElementById("pace");
  btn.addEventListener("click",function(){
    var d=parseFloat(distance.value)||0, m=parseFloat(mins.value)||0;
    if(d<=0){ res.classList.remove("show"); return; }
    var paceMin=m/d; var pMin=Math.floor(paceMin), pSec=Math.round((paceMin-pMin)*60);
    paceEl.textContent=pMin+":"+(pSec<10?"0":"")+pSec+" /km"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
