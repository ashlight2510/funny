<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>제시어 (몸으로 말해요) | 제시어 랜덤 | FunnyFunny Cloud</title>
  <meta name="description" content="제시어 목록을 입력하거나 기본 목록에서 하나를 랜덤으로 뽑습니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/charade-word/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#ea580c;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#c2410c,#ea580c);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field textarea{width:100%;min-height:80px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:24px;font-weight:700;} .result.show{display:block;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🎭</div><div><h1>제시어 (몸으로 말해요)</h1><p class="sub">제시어 랜덤</p></div></div></header>
    <div class="panel">
      <div class="field"><label>제시어 (한 줄에 하나, 비우면 기본 사용)</label><textarea id="words" placeholder="비우면 기본 제시어 사용"></textarea></div>
      <button type="button" class="btn" id="btnPick">뽑기</button>
      <div class="result" id="result"><span id="out"></span></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/charade-word-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/pictionary-word/">그림 제시어</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ var def=["고양이","자동차","피자","축구","기타","비행기","선생님","의사","영화","노래방","춤","수영","바다","산","눈사람","생일","결혼","이사","전화","컴퓨터"];
  var words=document.getElementById("words"), btn=document.getElementById("btnPick"), res=document.getElementById("result"), out=document.getElementById("out");
  btn.addEventListener("click",function(){ var arr=words.value.split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean); if(arr.length===0) arr=def; out.textContent=arr[Math.floor(Math.random()*arr.length)]; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
