<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">📆</div><div><h1>영업일 계산</h1><p class="sub">두 날짜 사이 영업일(주말 제외)</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="row">
        <div class="field"><label>시작일</label><input type="date" id="start" /></div>
        <div class="field"><label>종료일</label><input type="date" id="end" /></div>
      </div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>총 일수</span><span class="v" id="total"></span></div>
        <div class="result-item"><span>영업일 (토·일 제외)</span><span class="v" id="business"></span></div>
        <p class="note">토·일만 제외. 공휴일은 포함됩니다.</p>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>

  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/business-days-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/datecalc/">날짜 차이</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  function parseDate(s){ var p=s.split("-"); return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10)); }
  function daysBetween(a,b){ return Math.round((b-a)/(24*60*60*1000))+1; }
  function businessDays(a,b){ var d=0; for(var t=new Date(a); t<=b; t.setDate(t.getDate()+1)){ var w=t.getDay(); if(w!==0&&w!==6)d++; } return d; }
  var start=document.getElementById("start"), end=document.getElementById("end");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), totalEl=document.getElementById("total"), busEl=document.getElementById("business");
  var today=new Date(); start.value=today.toISOString().slice(0,10); var e=new Date(today); e.setDate(e.getDate()+30); end.value=e.toISOString().slice(0,10);
  btn.addEventListener("click",function(){
    var a=parseDate(start.value), b=parseDate(end.value); if(isNaN(a.getTime())||isNaN(b.getTime())||a>b){ res.classList.remove("show"); return; }
    totalEl.textContent=daysBetween(a,b)+"일"; busEl.textContent=businessDays(new Date(a),new Date(b))+"일"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
