<head>

  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#f97316;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ea580c,#f97316);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);}
    .btn{padding:14px 24px;border-radius:12px;border:none;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px;}
    .result{text-align:center;font-size:28px;font-weight:700;margin-top:16px;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
    <meta name="description" content="랜덤 시간 후 알림." />
    <meta property="og:title" content="폭탄 타이머" />
    <meta property="og:description" content="랜덤 시간 후 알림." />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />

    <meta property="og:url" content="https://funnyfunny.cloud/tools/timer-bomb/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="폭탄 타이머" />
    <meta name="twitter:description" content="랜덤 시간 후 알림." />
    <meta name="twitter:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />

  </head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">💣</div><div><h1>폭탄 타이머</h1><p class="sub">랜덤 시간 후 알림</p></div></div></header>
    <div class="panel">
      <div class="row">
        <div class="field"><label>최소 (초)</label><input type="number" id="min" value="5" min="1" /></div>
        <div class="field"><label>최대 (초)</label><input type="number" id="max" value="30" min="1" /></div>
      </div>
      <button type="button" class="btn" id="btnStart">시작</button>
      <div class="result" id="out">—</div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/timer-bomb-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/countdown-timer/">카운트다운</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ var min=document.getElementById("min"), max=document.getElementById("max"), btn=document.getElementById("btnStart"), out=document.getElementById("out"); var id=null;
  btn.addEventListener("click",function(){ if(id) return; var a=parseInt(min.value,10)||5, b=parseInt(max.value,10)||30; if(a>b){ var t=a;a=b;b=t; } var sec=Math.floor(Math.random()*(b-a+1))+a; out.textContent=sec+"초 후 터짐!"; id=setTimeout(function(){ id=null; out.textContent="💥 터졌다!"; },sec*1000); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
