        en: {

          introDesc:
            "You thought it was the cold,<br />but it may be a <span class=\"text-white font-semibold\">pattern that repeats every year</span>.",
          startButton: "Start (1 min)",
          progressLabel: "Progress",
          questionPlaceholder: "Question",

          shareLabel: "📢 Share text",
          restartButton: "Try again",
          shareText: "This winter, what breaks me is not the cold but {title}",
          questions: [
            {
              q: "What falls apart first in winter?",
              a: ["Energy", "Motivation", "Routine", "Mindset"],
              t: ["cold", "bed", "bed", "emotion"],
            },
            {
              q: "What increases the most in winter?",
              a: ["Staying in bed", "Delivery", "Phone time", "Doing nothing"],

            {

              a: ["Outside is risky", "Another year is over", "Do it in spring", "What is wrong with me"],

              a: ["Paused", "Sinking", "Holding on", "Sorting out"],

          results: {

              desc:

              action: "Two cups of warm water + 10 minutes of sunlight",
              img: "https://loremflickr.com/800/400/winter,sunlight?lock=1",
            },
            bed: {
              title: "🛌 Blanket Swallowed",
              desc:
                "The blanket is no longer rest, it is escape. Time disappears there.",
              action: "Stand by an open window for 5 minutes after waking",

            },
            dopamine: {
              title: "📱 Dopamine Hibernator",
              desc:
                "Winter needs structure, not more stimulation. Scrolling eats the day.",
              action: "Block one app for today",
              img: "https://loremflickr.com/800/400/phone,dark?lock=3",
            },
            emotion: {
              title: "🧊 Emotion Cooling Type",
              desc: "You are not alone, you are closed off.",
              action: "Check in with one comfortable person",
              img: "https://loremflickr.com/800/400/winter,alone?lock=4",
            },
            stable: {
              title: "❄️ Winter Stable",
              desc:
                "You are handling winter fairly well. Just do not get too relaxed.",
              action: "Keep one routine steady",
              img: "https://loremflickr.com/800/400/winter,calm?lock=5",
            },
          },
        },
      };

      const defaultLang = "ko";
      const supportedLangs = ["ko", "en"];
      let currentLang = defaultLang;

      function getPack() {
        return translations[currentLang] || translations.ko;
      }

      function t(key, vars = {}) {
        const pack = getPack();
        const template = pack[key] ?? translations.ko[key] ?? key;
        if (typeof template !== "string") return template;
        return template.replace(/\{(\w+)\}/g, (_, token) =>
          vars[token] !== undefined ? vars[token] : `{${token}}`
        );
      }

      let index = 0;
      let score = {};

      const intro = document.getElementById("intro");
      const quiz = document.getElementById("quiz");
      const result = document.getElementById("result");

      const qEl = document.getElementById("question");
      const aEl = document.getElementById("answers");
      const qIndexEl = document.getElementById("qIndex");

      document.getElementById("startBtn").onclick = () => {
        intro.classList.add("hidden");
        quiz.classList.remove("hidden");
        render();
      };

      function render() {
        const q = getPack().questions[index];
        qIndexEl.textContent = index + 1;
        qEl.textContent = q.q;
        aEl.innerHTML = "";
        q.a.forEach((txt, i) => {
          const b = document.createElement("button");
          b.className =
            "p-4 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition text-left";
          b.textContent = txt;
          b.onclick = () => pick(q.t[i]);
          aEl.appendChild(b);
        });
      }

      function pick(type) {
        score[type] = (score[type] || 0) + 1;
        index++;
        const questions = getPack().questions;
        if (index >= questions.length) return showResult();
        render();
      }

      function showResult() {
        quiz.classList.add("hidden");
        result.classList.remove("hidden");
        const top = Object.keys(score).sort((a, b) => score[b] - score[a])[0];
        const r = getPack().results[top];
        document.getElementById("resultTitle").textContent = r.title;
        document.getElementById("resultDesc").textContent = r.desc;
        document.getElementById("resultAction").textContent = r.action;
        document.getElementById("resultImg").src = r.img;
        document.getElementById(
          "shareText"
        ).textContent = t("shareText", { title: r.title });
      }
      document.getElementById("restartBtn").onclick = () => location.reload();

      function applyTranslations() {
        document.title = t("metaTitle");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          const key = el.dataset.i18nHtml;
          const value = t(key);
          if (value && value !== key) {
            el.innerHTML = value;
          }
        });
      }

      function setLang(lang, options = {}) {
        const nextLang = translations[lang] ? lang : defaultLang;
        currentLang = nextLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === nextLang);
        });
        applyTranslations();
        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
        if (!intro.classList.contains("hidden")) {
          return;
        }
        if (!quiz.classList.contains("hidden")) {
          render();
          return;
        }
        if (!result.classList.contains("hidden")) {
          showResult();
        }
      }

      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const paramLang = params.get("lang");
        if (supportedLangs.includes(paramLang)) return paramLang;
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) return stored;
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }

      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          setLang(button.dataset.lang, { updateUrl: true });
        });
      });

      setLang(detectLang(), { updateUrl: false });
    </script>
