  <script>
(function(){ var list=[["#ef4444","불타는 에너지"],["#f97316","따뜻한 활력"],["#eab308","밝은 기분"],["#22c55e","편안한 안정"],["#06b6d4","시원한 청량"],["#3b82f6","차분한 집중"],["#8b5cf6","몽환적"],["#ec4899","설렘"]];
  var btn=document.getElementById("btnPick"), res=document.getElementById("result"), ring=document.getElementById("ring"), out=document.getElementById("out");
  btn.addEventListener("click",function(){ var i=Math.floor(Math.random()*list.length); ring.style.background=list[i][0]; out.textContent=list[i][1]; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
