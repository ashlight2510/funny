<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>점수 기록 | 2~4인 점수 | FunnyFunny Cloud</title>
  <meta name="description" content="2~4명 점수를 +/- 로 기록합니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/score-keeper/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#0ea5e9;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0284c7,#0ea5e9);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .player{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .player input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b1220;color:var(--text);}
    .player .score{font-size:20px;font-weight:700;min-width:3ch;}
    .btn-sm{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">📋</div><div><h1>점수 기록</h1><p class="sub">2~4인 점수</p></div></div></header>
    <div class="panel">
      <div class="player"><input type="text" id="n1" value="1번" /><span class="score" id="s1">0</span><button type="button" class="btn-sm" id="p1" style="background:#22c55e;">+</button><button type="button" class="btn-sm btn-ghost" id="m1">−</button></div>
      <div class="player"><input type="text" id="n2" value="2번" /><span class="score" id="s2">0</span><button type="button" class="btn-sm" id="p2" style="background:#22c55e;">+</button><button type="button" class="btn-sm btn-ghost" id="m2">−</button></div>
      <div class="player"><input type="text" id="n3" value="3번" /><span class="score" id="s3">0</span><button type="button" class="btn-sm" id="p3" style="background:#22c55e;">+</button><button type="button" class="btn-sm btn-ghost" id="m3">−</button></div>
      <div class="player"><input type="text" id="n4" value="4번" /><span class="score" id="s4">0</span><button type="button" class="btn-sm" id="p4" style="background:#22c55e;">+</button><button type="button" class="btn-sm btn-ghost" id="m4">−</button></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/score-keeper-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/scoreboard/">스코어보드</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn-sm btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ var s=[0,0,0,0], els=[document.getElementById("s1"),document.getElementById("s2"),document.getElementById("s3"),document.getElementById("s4")];
  for(var i=0;i<4;i++){ (function(j){ document.getElementById("p"+(j+1)).addEventListener("click",function(){ s[j]++; els[j].textContent=s[j]; }); document.getElementById("m"+(j+1)).addEventListener("click",function(){ s[j]=Math.max(0,s[j]-1); els[j].textContent=s[j]; }); })(i); }
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
