<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🛵</div><div><h1>배달비 모아보기</h1><p class="sub">1회 평균·월 횟수 → 월/연 비용</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="row">
        <div class="field"><label>1회 평균 배달비 (원)</label><input type="number" id="perOrder" min="0" value="12000" /></div>
        <div class="field"><label>월 주문 횟수 (회)</label><input type="number" id="perMonth" min="0" max="60" value="8" /></div>
      </div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>월 비용</span><span class="v" id="monthly"></span></div>
        <div class="result-item"><span>연 비용</span><span class="v" id="yearly"></span></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>

  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
  var perOrder=document.getElementById("perOrder"), perMonth=document.getElementById("perMonth");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), mEl=document.getElementById("monthly"), yEl=document.getElementById("yearly");
  btn.addEventListener("click",function(){
    var p=parseFloat(perOrder.value)||0, m=parseFloat(perMonth.value)||0;
    mEl.textContent=fmt(p*m); yEl.textContent=fmt(p*m*12); res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
