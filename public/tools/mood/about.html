      <h1>기분전환도우미</h1>
      <div class="about-body">
        <p>괜찮아질 필요 없어. 좋아질 필요도 없어. 지금 상태 그대로 잠깐 쉬면 돼.</p>
        <p>이 서비스는 힘내라고 하지도, 계획 세우라고 하지도, 긍정적으로 생각하라고 강요하지도 않아.</p>
        <p>버튼 하나 누르면 지금 기분을 살짝 다른 방향으로 밀어줄 뿐이야.</p>
        <p>생각 안 해도 되고, 선택 잘못해도 되고, 결과 마음에 안 들면 그냥 닫아도 돼.</p>
        <p>그래서 이름도 도우미야. 코치도, 상담사도 아니야.</p>
