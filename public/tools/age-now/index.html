  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">🎂</div>
          <div>
            <h1>만 나이·D-day 계산기</h1>
            <p class="sub">생년월일로 만 나이, 연 나이, 다음 생일 D-day</p>
          </div>
        </div>
      </header>
      <div class="panel">
        <h3>생년월일</h3>
        <div class="field">
          <label>생년월일</label>
          <input type="date" id="birth" value="1990-01-15" />
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>만 나이</span><span class="v" id="age"></span></div>
          <div class="result-item"><span>연 나이 (한국)</span><span class="v" id="koreanAge"></span></div>
          <div class="result-item"><span>다음 생일 D-day</span><span class="v" id="dday"></span></div>
          <p class="note">오늘 기준입니다. 만 나이는 생일 지났으면 +1, 전이면 그대로.</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/age-now-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/datecalc/">날짜 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>
    <script>
      (function(){
        var birth = document.getElementById("birth");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var ageEl = document.getElementById("age");
        var koreanAgeEl = document.getElementById("koreanAge");
        var ddayEl = document.getElementById("dday");
        btnCalc.addEventListener("click", function(){
          var s = birth.value;
          if (!s) { result.classList.remove("show"); return; }
          var b = new Date(s);
          var today = new Date();
          today.setHours(0,0,0,0);
          b.setHours(0,0,0,0);
          var manAge = today.getFullYear() - b.getFullYear();
          if (today.getMonth() < b.getMonth() || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate())) manAge--;
          var kAge = today.getFullYear() - b.getFullYear() + 1;
          var nextBday = new Date(today.getFullYear(), b.getMonth(), b.getDate());
          if (nextBday < today) nextBday.setFullYear(nextBday.getFullYear() + 1);
          var diff = Math.ceil((nextBday - today) / (24*60*60*1000));
          ageEl.textContent = manAge + "세";
          koreanAgeEl.textContent = kAge + "세";
          ddayEl.textContent = "D-" + diff;
          result.classList.add("show");
        });
        document.getElementById("btnShare").addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById("tool-share-toast").textContent = "복사했어요"; document.getElementById("tool-share-toast").style.display = "inline"; setTimeout(function(){ document.getElementById("tool-share-toast").style.display = "none"; }, 1500); });
        });
      })();
    </script>
  </body>
