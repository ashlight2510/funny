<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>숫자 랜덤 | 최소~최대 범위 | FunnyFunny Cloud</title>
  <meta name="description" content="최소값과 최대값을 입력하면 그 사이 정수 하나를 랜덤으로 뽑습니다." />

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#06b6d4;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0891b2,#06b6d4);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);font-size:14px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:24px;font-weight:700;} .result.show{display:block;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
    <meta name="description" content="최소~최대 범위." />
    <meta property="og:title" content="숫자 랜덤" />
    <meta property="og:description" content="최소~최대 범위." />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/random-number/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="숫자 랜덤" />
    <meta name="twitter:description" content="최소~최대 범위." />
    <meta name="twitter:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />

  </head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🔢</div><div><h1>숫자 랜덤</h1><p class="sub">최소~최대 범위</p></div></div></header>
    <div class="panel">
      <div class="row">
        <div class="field"><label>최소</label><input type="number" id="min" value="1" /></div>
        <div class="field"><label>최대</label><input type="number" id="max" value="100" /></div>
      </div>
      <button type="button" class="btn" id="btnPick">뽑기</button>
      <div class="result" id="result"><span id="out"></span></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/random-number-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/dice/">주사위</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ function randInt(a,b){ a=Math.ceil(a); b=Math.floor(b); return Math.floor(Math.random()*(b-a+1))+a; }
  var min=document.getElementById("min"), max=document.getElementById("max"), btn=document.getElementById("btnPick"), res=document.getElementById("result"), out=document.getElementById("out");
  btn.addEventListener("click",function(){ var a=parseFloat(min.value)||0, b=parseFloat(max.value)||0; if(a>b){ var t=a;a=b;b=t; } out.textContent=randInt(a,b); res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
