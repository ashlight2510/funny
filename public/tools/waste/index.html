      const defaultLang = "ko";

      let currentLang = defaultLang;

      function getPack() {
        return translations[currentLang] || translations.ko;
      }

      function t(key, vars = {}) {
        const pack = getPack();
        const template = pack[key] ?? translations.ko[key] ?? key;
        if (typeof template !== "string") return template;
        return template.replace(/\{(\w+)\}/g, (_, token) =>
          vars[token] !== undefined ? vars[token] : `{${token}}`
        );
      }

      const $start = document.getElementById("start");
      const $quiz = document.getElementById("quiz");
      const $result = document.getElementById("result");
      const $q = document.getElementById("q");
      const $sub = document.getElementById("sub");
      const $choices = document.getElementById("choices");
      const $bar = document.getElementById("bar");
      const $step = document.getElementById("step");

      let idx = 0;
      let score = 0;

      function setView(v) {
        $start.classList.toggle("hidden", v !== "start");
        $quiz.classList.toggle("hidden", v !== "quiz");
        $result.classList.toggle("hidden", v !== "result");
      }

      function render() {
        const questions = getPack().questions;
        const total = questions.length;
        const cur = questions[idx];
        $step.textContent = t("step", { current: idx + 1, total });
        $bar.style.width = `${Math.round((idx / total) * 100)}%`;

        $q.textContent = cur.q;
        $sub.textContent = cur.sub || "";

        $choices.innerHTML = "";
        cur.a.forEach(([label, val]) => {
          const btn = document.createElement("button");
          btn.className =
            "tap text-left rounded-2xl border border-white/10 bg-slate-900/40 hover:bg-slate-900/55 transition p-4";
          btn.innerHTML = `
          <div class="font-bold">${label}</div>
          <div class="text-xs text-slate-400 mt-1">${t("tapHint")}</div>
        `;
          btn.addEventListener("click", () => {
            score += val;
            idx += 1;
            if (idx >= total) showResult();
            else render();
          });
          $choices.appendChild(btn);
        });
      }

      function pickType(s) {
        const types = getPack().types;
        return types.find((t) => s >= t.min && s <= t.max) || types[types.length - 1];

      function toPercent(s) {
        const max = getPack().questions.length * 3;
        return Math.round((s / max) * 100);
      }

      function showResult() {
        const t = pickType(score);
        const pct = toPercent(score);

        document.getElementById("typeTitle").textContent = t.title;
        document.getElementById("typeDesc").textContent = t.desc;
        document.getElementById("meme").textContent = t.meme;
        document.getElementById("pct").textContent = `${pct}%`;

        $bar.style.width = "100%";
        setView("result");
        setTimeout(
          () => $result.scrollIntoView({ behavior: "smooth", block: "start" }),
          60
        );
      }

      function resetAll() {
        idx = 0;
        score = 0;
        setView("start");
      }

      function buildShareText() {
        const t = pickType(score);
        const pct = toPercent(score);
        return [
          getPack().shareTitle,
          "",
          `${getPack().shareScore}: ${pct}%`,
          `${getPack().shareType}: ${t.title}`,
          `${getPack().shareLine}: ${t.meme}`,
        ].join("\n");
      }

      document.getElementById("startBtn").addEventListener("click", () => {
        idx = 0;
        score = 0;
        setView("quiz");
        render();
        setTimeout(
          () => $quiz.scrollIntoView({ behavior: "smooth", block: "start" }),
          60
        );
      });

      document.getElementById("restartBtn").addEventListener("click", resetAll);

      document.getElementById("copyBtn").addEventListener("click", async () => {
        const text = buildShareText();
        try {
          await navigator.clipboard.writeText(text);
          alert(getPack().copyToast);
        } catch {
          prompt(getPack().copyPrompt, text);
        }
      });

      document
        .getElementById("shareBtn")
        .addEventListener("click", async () => {
          const text = buildShareText();
          const url = location.href;
          if (navigator.share) {
            try {
              await navigator.share({
                title: getPack().title,
                text,
                url,
              });
              return;
            } catch {}
          }
          try {
            await navigator.clipboard.writeText(text + "\n\n" + url);
            alert(getPack().shareToast);
          } catch {
            prompt(getPack().copyPrompt, text + "\n\n" + url);
          }
        });

      document.getElementById("toCalcBtn").addEventListener("click", () => {
        window.open("https://funnyfunny.cloud/", "_blank");
      });

      function applyTranslations() {
        document.title = t("metaTitle");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
      }

      function setLang(lang, options = {}) {
        const nextLang = translations[lang] ? lang : defaultLang;
        currentLang = nextLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === nextLang);
        });
        applyTranslations();
        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
        if (!$start.classList.contains("hidden")) return;
        if (!$quiz.classList.contains("hidden")) {
          render();
          return;
        }
        if (!$result.classList.contains("hidden")) {
          showResult();
        }
      }

      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const paramLang = params.get("lang");
        if (supportedLangs.includes(paramLang)) return paramLang;
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) return stored;
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }

      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          setLang(button.dataset.lang, { updateUrl: true });
        });
      });

      setLang(detectLang(), { updateUrl: false });
    </script>
