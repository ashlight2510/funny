<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">✋</div><div><h1>가위바위보 확장</h1><p class="sub">5가지 (도마뱀·스팍)</p></div></div></header>
    <div class="panel">
      <p style="color:var(--muted);margin-bottom:12px;">하나를 고르세요.</p>
      <div class="choices">
        <button type="button" data-choice="0">✌️ 가위</button>
        <button type="button" data-choice="1">✊ 바위</button>
        <button type="button" data-choice="2">🖐️ 보</button>
        <button type="button" data-choice="3">🦎 도마뱀</button>
        <button type="button" data-choice="4">🖖 스팍</button>
      </div>
      <div class="result" id="result">
        <div>나: <span class="v" id="mine"></span></div>
        <div>컴퓨터: <span class="v" id="cpu"></span></div>
        <div>결과: <span class="v" id="win"></span></div>
      </div>

  <script>
(function(){ var names=["가위","바위","보","도마뱀","스팍"]; var beats=[[2,3],[0,4],[1,3],[4,1],[0,2]]; var res=document.getElementById("result"), mineEl=document.getElementById("mine"), cpuEl=document.getElementById("cpu"), winEl=document.getElementById("win");
  document.querySelectorAll(".choices button").forEach(function(btn){ btn.addEventListener("click",function(){ var m=parseInt(btn.dataset.choice,10), c=Math.floor(Math.random()*5); mineEl.textContent=names[m]; cpuEl.textContent=names[c]; var win= m===c?"무승부":beats[m].indexOf(c)>=0?"승":"패"; winEl.textContent=win; res.classList.add("show"); }); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
