<head>

  <meta name="description" content="화면이 변할 때 클릭하면 반응 속도(ms)를 측정합니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/reaction-test/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#14b8a6;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0d9488,#14b8a6);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px;text-align:center;min-height:120px;cursor:pointer;}
    .panel.wait{background:#1e3a5f;} .panel.go{background:#166534;}
    .panel .msg{font-size:24px;font-weight:700;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
    <meta name="description" content="클릭 반응 ms." />
    <meta property="og:title" content="반응 속도" />
    <meta property="og:description" content="클릭 반응 ms." />

    <meta name="twitter:title" content="반응 속도" />

  </head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⚡</div><div><h1>반응 속도</h1><p class="sub">클릭 반응 ms</p></div></div></header>
    <div class="panel" id="panel">
      <div class="msg" id="msg">클릭해서 시작</div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/reaction-test-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/quick-draw/">빠른 손</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ var panel=document.getElementById("panel"), msg=document.getElementById("msg"); var state="idle", goTime=0, id=null;
  panel.addEventListener("click",function(){
    if(state==="idle"){ msg.textContent="초록이 되면 클릭!"; panel.className="panel wait"; state="wait"; var delay=1000+Math.random()*3000; id=setTimeout(function(){ id=null; panel.className="panel go"; state="go"; goTime=Date.now(); msg.textContent="클릭!"; },delay); return; }
    if(state==="wait"){ if(id) clearTimeout(id); id=null; msg.textContent="너무 빨라요. 다시 클릭"; state="idle"; panel.className="panel"; return; }
    if(state==="go"){ var ms=Date.now()-goTime; msg.textContent=ms+" ms"; state="idle"; panel.className="panel"; }
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
