        ko: {
          metaTitle: "집 못 산 죄 계산기",
          heroTitle: "🏠 집 못 산 죄 계산기",
          subtitle: "그때 집을 샀다면... 지금 얼마였을까?",

          yearLabel: "📅 기준 연도",
          sizeLabel: "📐 평수",
          regionPlaceholder: "지역을 선택하세요",
          yearPlaceholder: "연도를 선택하세요",
          sizePlaceholder: "평수를 선택하세요",
          calculateButton: "💰 계산하기",
          pastPriceLabel: "기준년도 당시 가격",
          currentYearLabel: "{year}년 현재 가격",
          resultTitleTemplate: "🏡 {region} 아파트 {size}평대",
          lossLabel: "당신이 안 산 대가",
          bonusTitle: "🤣 집값 대신 산 것들",
          copyButton: "🔗 링크 복사",
          funnyLink: "😄 FunnyFunny",
          moreTests: "더 많은 테스트 해보기",
          alertMissing: "모든 항목을 선택해주세요!",
          alertNoData: "해당 지역/평수의 데이터가 없습니다.",
          alertFetch: "데이터를 불러올 수 없습니다.",
          copySuccess: "링크가 복사되었습니다!",
        },
        en: {
          metaTitle: "Home Price Opportunity Cost Calculator",
          heroTitle: "🏠 Home Price Missed Gains Calculator",
          subtitle:
            "What would it be worth today if you had bought back then?",
          regionLabel: "📍 Choose a neighborhood",
          yearLabel: "📅 Reference year",
          sizeLabel: "📐 Apartment size",
          regionPlaceholder: "Select a region",
          yearPlaceholder: "Pick a year",
          sizePlaceholder: "Choose a size range",
          calculateButton: "💰 Calculate",
          pastPriceLabel: "Price back then",
          currentYearLabel: "Current price ({year})",
          resultTitleTemplate: "{region} apartment {size}평대",
          lossLabel: "Opportunity cost",
          bonusTitle: "Things you could've bought instead",
          copyButton: "🔗 Copy link",
          funnyLink: "😄 FunnyFunny",
          moreTests: "Try more tests",
          alertMissing: "Please fill out every field!",
          alertNoData: "No data for the selected region/size.",
          alertFetch: "Unable to load data.",
          copySuccess: "Link copied!",
        },
      };
      const defaultLang = "ko";
      const supportedLangs = ["ko", "en"];
      let currentLang = defaultLang;

      function getPack() {
        return translations[currentLang] || translations.ko;
      }

      function formatTemplate(template, vars = {}) {
        if (typeof template !== "string") return "";
        return template.replace(/\{(.*?)\}/g, (_, key) =>
          vars[key] !== undefined ? vars[key] : ""
        );
      }

      function t(key, vars = {}) {
        const pack = getPack();
        const value =
          (pack && pack[key]) || translations.ko[key] || key || "";
        return formatTemplate(value, vars);
      }

      function getCurrentYearForLabel() {
        return window.currentYear || new Date().getFullYear();
      }

      function updateCurrentYearLabel() {
        const label = document.getElementById("currentYearLabel");
        if (!label) return;
        label.textContent = t("currentYearLabel", {
          year: getCurrentYearForLabel(),
        });
      }

      function updateMoreTestsText() {
        const moreBtn = document.getElementById("more-tests-btn");
        if (moreBtn) {
          moreBtn.textContent = t("moreTests");
        }
      }

      window.updateMoreTestsText = updateMoreTestsText;

      function applyTranslations() {
        document.title = t("metaTitle");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.dataset.i18n;
          if (!key) return;
          const text = t(key);
          el.textContent = text;
        });
        updateCurrentYearLabel();
        updateMoreTestsText();
      }

      function setLang(lang, options = {}) {
        const nextLang = translations[lang] ? lang : defaultLang;
        currentLang = nextLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.lang === nextLang
          );
        });
        applyTranslations();
        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
      }

      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const langParam = params.get("lang");
        if (supportedLangs.includes(langParam)) {
          return langParam;
        }
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) {
          return stored;
        }
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }

      document.addEventListener("DOMContentLoaded", () => {
        document
          .querySelectorAll(".lang-switch button")
          .forEach((button) => {
            button.addEventListener("click", () => {
              setLang(button.dataset.lang, { updateUrl: true });
            });
          });
        setLang(detectLang(), { updateUrl: false });
      });
    </script>

      const currentYear = new Date().getFullYear();
      window.currentYear = currentYear;

      // 연도 옵션 생성 (2015년부터 현재 연도까지)
      const yearSelect = document.getElementById("year");
      for (let year = 2015; year <= currentYear; year++) {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year + "년";

        .sort()
        .forEach((region) => {
          const option = document.createElement("option");
          option.value = region;
          option.textContent = region;
          regionSelect.appendChild(option);
        });

      function formatPrice(price) {
        if (price >= 100000000) {
          return (price / 100000000).toFixed(1) + "억 원";
        } else if (price >= 10000) {
          return (price / 10000).toFixed(0) + "만 원";
        }
        return price.toLocaleString() + "원";
      }

      // 연도별 가격 보간 함수
      function getPriceForYear(regionData, size, targetYear) {
        const sizeData = regionData[size];
        if (!sizeData) return null;

        // 정확한 연도 데이터가 있으면 그대로 반환
        if (sizeData[targetYear]) {
          return sizeData[targetYear];
        }

        // 사용 가능한 연도 목록 정렬
        const availableYears = Object.keys(sizeData)
          .map(Number)
          .sort((a, b) => a - b);

        // 2015년보다 이전이면 2015년 데이터 사용
        if (targetYear < availableYears[0]) {
          return sizeData[availableYears[0]];
        }

        // 최신 연도보다 이후면 최신 연도 데이터 사용
        if (targetYear > availableYears[availableYears.length - 1]) {
          return sizeData[availableYears[availableYears.length - 1]];
        }

        // 가장 가까운 이전 연도와 이후 연도 찾기
        let prevYear = null;
        let nextYear = null;

        for (let i = 0; i < availableYears.length; i++) {
          if (availableYears[i] < targetYear) {
            prevYear = availableYears[i];
          } else if (availableYears[i] > targetYear) {
            nextYear = availableYears[i];
            break;
          }
        }

        // 이전 연도만 있으면 그대로 사용
        if (prevYear !== null && nextYear === null) {
          return sizeData[prevYear];
        }

        // 이후 연도만 있으면 그대로 사용
        if (prevYear === null && nextYear !== null) {
          return sizeData[nextYear];
        }

        // 양쪽 연도가 있으면 선형 보간
        if (prevYear !== null && nextYear !== null) {
          const prevPrice = sizeData[prevYear];
          const nextPrice = sizeData[nextYear];
          const yearDiff = nextYear - prevYear;
          const priceDiff = nextPrice - prevPrice;
          const ratio = (targetYear - prevYear) / yearDiff;
          return Math.round(prevPrice + priceDiff * ratio);
        }

        return null;
      }

      function calculate() {
        const region = document.getElementById("region").value;
        const year = parseInt(document.getElementById("year").value);
        const size = document.getElementById("size").value;

        if (!region || !year || !size) {
          alert(t("alertMissing"));
          return;
        }

        const regionData = priceData[region];
        if (!regionData || !regionData[size]) {
          alert(t("alertNoData"));
          return;
        }

        // 보간 함수를 사용하여 가격 계산
        const pastPrice = getPriceForYear(regionData, size, year);
        const currentPrice = getPriceForYear(regionData, size, currentYear);

        if (pastPrice === null || currentPrice === null) {
          alert(t("alertFetch"));
          return;
        }

        const loss = currentPrice - pastPrice;

        // 결과 표시
        document.getElementById("resultTitle").textContent = t(
          "resultTitleTemplate",
          { region, size }
        );
        document.getElementById("pastPrice").textContent =
          formatPrice(pastPrice);
        document.getElementById("currentYearLabel").textContent = t(
          "currentYearLabel",
          { year: currentYear }
        );
        document.getElementById("currentPrice").textContent =
          formatPrice(currentPrice);
        document.getElementById("lossAmount").textContent = formatPrice(loss);

        // 보너스 분석
        const bonusItems = calculateBonusItems(loss);
        const bonusContainer = document.getElementById("bonusItems");
        bonusContainer.innerHTML = "";
        bonusItems.forEach((item) => {
          const div = document.createElement("div");
          div.className = "bonus-item";
          div.innerHTML = `<span>${item.name}</span><span><strong>${item.count}</strong></span>`;
          bonusContainer.appendChild(div);
        });

        document.getElementById("result").classList.add("show");
      }

      function calculateBonusItems(loss) {
        // 각 항목의 평균 가격
        const items = [
          { name: "🍕 배달음식", price: 15000 },
          { name: "☕ 카페라떼", price: 5000 },
          { name: "🚕 택시", price: 8000 },
          { name: "🎧 에어팟", price: 250000 },
          { name: "🍺 맥주", price: 5000 },
          { name: "🍔 햄버거", price: 12000 },
        ];

        return items.map((item) => ({
          name: item.name,
          count:
            Math.floor(loss / item.price).toLocaleString() +
            (item.name.includes("에어팟") ? "개" : "개"),
        }));
      }
