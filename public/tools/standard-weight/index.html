<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>표준체중·권장 체중 계산기 | 키·성별 | FunnyFunny Cloud</title>
    <meta name="description" content="키와 성별을 입력하면 표준체중·권장 체중 범위(BMI 18.5~24.9)를 계산합니다. 무료 표준체중 계산기." />
    <meta property="og:title" content="표준체중·권장 체중 계산기 | FunnyFunny Cloud" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/standard-weight/" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/standard-weight/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #14b8a6; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #0b1220; }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
      .result-item .v { font-weight: 700; color: var(--accent); }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">⚖️</div>
          <div>
            <h1>표준체중·권장 체중 계산기</h1>
            <p class="sub">키·성별로 표준체중·BMI 정상 범위 (18.5~24.9)</p>
          </div>
        </div>
      </header>
      <div class="panel">
        <h3>입력</h3>
        <div class="field">
          <label>키 (cm)</label>
          <input type="number" id="height" min="100" max="250" step="0.1" value="170" />
        </div>
        <div class="field">
          <label>성별</label>
          <select id="gender">
            <option value="m">남성</option>
            <option value="f">여성</option>
          </select>
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>표준체중 (Broca)</span><span class="v" id="broca"></span></div>
          <div class="result-item"><span>권장 체중 (BMI 18.5~24.9)</span><span class="v" id="range"></span></div>
          <p class="note">표준체중 = (키-100)×0.9. 권장 = BMI 18.5~24.9 기준 kg. 참고용이며 개인차 있습니다.</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/standard-weight-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/bmi-check/">BMI 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>
    <script>
      (function(){
        var height = document.getElementById("height");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var brocaEl = document.getElementById("broca");
        var rangeEl = document.getElementById("range");
        btnCalc.addEventListener("click", function(){
          var h = parseFloat(height.value) / 100;
          if (!h || h <= 0) { result.classList.remove("show"); return; }
          var broca = (height.value - 100) * 0.9;
          var minKg = (18.5 * h * h).toFixed(1);
          var maxKg = (24.9 * h * h).toFixed(1);
          brocaEl.textContent = broca.toFixed(1) + " kg";
          rangeEl.textContent = minKg + " ~ " + maxKg + " kg";
          result.classList.add("show");
        });
        document.getElementById("btnShare").addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById("tool-share-toast").textContent = "복사했어요"; document.getElementById("tool-share-toast").style.display = "inline"; setTimeout(function(){ document.getElementById("tool-share-toast").style.display = "none"; }, 1500); });
        });
      })();
    </script>
  </body>
</html>
