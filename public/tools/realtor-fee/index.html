<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>부동산 중개수수료 계산기 | 상한 요율 | FunnyFunny Cloud</title>
    <meta name="description" content="거래 금액을 입력하면 부동산 중개수수료 상한을 계산합니다. 매매·전세·월세 구분. 무료 중개수수료 계산기." />
    <meta property="og:title" content="부동산 중개수수료 계산기 | FunnyFunny Cloud" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/realtor-fee/" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/realtor-fee/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #e11d48; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #be123c 0%, #e11d48 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
      .result-item .v { font-weight: 700; color: var(--accent); }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">🏢</div>
          <div>
            <h1>부동산 중개수수료 계산기</h1>
            <p class="sub">거래 금액별 수수료 상한 (공인중개사법)</p>
          </div>
        </div>
      </header>
      <div class="panel">
        <h3>입력</h3>
        <div class="field">
          <label>거래 유형</label>
          <select id="type">
            <option value="sale">매매</option>
            <option value="jeonse">전세</option>
            <option value="monthly">월세</option>
          </select>
        </div>
        <div class="field">
          <label>거래 금액 (원) — 매매/전세는 계약금액, 월세는 보증금+연월세</label>
          <input type="number" id="amount" min="0" step="1000000" value="300000000" />
        </div>
        <div class="field" id="monthlyWrap" style="display:none;">
          <label>월세 (원) — 연월세 계산용</label>
          <input type="number" id="monthlyRent" min="0" step="10000" value="500000" />
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>수수료 상한 (전체)</span><span class="v" id="totalFee"></span></div>
          <div class="result-item"><span>당사자 1인 부담 상한</span><span class="v" id="halfFee"></span></div>
          <p class="note">공인중개사법 상한 요율 기준. 지역·실거래는 다를 수 있으며, VAT 별도일 수 있습니다.</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/realtor-fee-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/rent/">보증금·월세 환산</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>
    <script>
      (function(){
        function feeSchedule(amount, type){
          var a = amount;
          if (type === "monthly") return feeMonthly(a);
          if (type === "jeonse") {
            if (a <= 50000000) return a * 0.005;
            if (a <= 100000000) return 250000 + (a - 50000000) * 0.004;
            if (a <= 600000000) return 450000 + (a - 100000000) * 0.003;
            return 2130000 + (a - 600000000) * 0.004;
          }
          if (a <= 50000000) return a * 0.006;
          if (a <= 200000000) return 300000 + (a - 50000000) * 0.005;
          if (a <= 600000000) return 1050000 + (a - 200000000) * 0.004;
          if (a <= 900000000) return 2650000 + (a - 600000000) * 0.003;
          return 3550000 + (a - 900000000) * 0.002;
        }
        function feeMonthly(amount){
          var a = amount;
          if (a <= 50000000) return a * 0.005;
          if (a <= 100000000) return 250000 + (a - 50000000) * 0.004;
          if (a <= 600000000) return 450000 + (a - 100000000) * 0.003;
          return 2130000 + (a - 600000000) * 0.004;
        }
        function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
        var type = document.getElementById("type");
        var amount = document.getElementById("amount");
        var monthlyWrap = document.getElementById("monthlyWrap");
        var monthlyRent = document.getElementById("monthlyRent");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var totalFee = document.getElementById("totalFee");
        var halfFee = document.getElementById("halfFee");
        type.addEventListener("change", function(){ monthlyWrap.style.display = type.value === "monthly" ? "block" : "none"; });
        btnCalc.addEventListener("click", function(){
          var amt = parseFloat(amount.value) || 0;
          if (type.value === "monthly") amt = amt + parseFloat(monthlyRent.value || 0) * 12;
          if (amt <= 0) { result.classList.remove("show"); return; }
          var fee = feeSchedule(amt, type.value);
          totalFee.textContent = fmt(fee);
          halfFee.textContent = fmt(fee / 2);
          result.classList.add("show");
        });
        document.getElementById("btnShare").addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById("tool-share-toast").textContent = "복사했어요"; document.getElementById("tool-share-toast").style.display = "inline"; setTimeout(function(){ document.getElementById("tool-share-toast").style.display = "none"; }, 1500); });
        });
      })();
    </script>
  </body>
</html>
