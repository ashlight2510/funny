<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🎫</div><div><h1>이용당 수수료</h1><p class="sub">연 회비 ÷ 연 이용 횟수 → 1회당 비용</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>연 회비 (원)</label><input type="number" id="annual" min="0" step="1000" value="300000" /></div>
      <div class="field"><label>연 이용 횟수 (회)</label><input type="number" id="uses" min="1" max="365" value="24" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>1회당 비용</span><span class="v" id="perUse"></span></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>

  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
  var annual=document.getElementById("annual"), uses=document.getElementById("uses");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), perEl=document.getElementById("perUse");
  btn.addEventListener("click",function(){
    var a=parseFloat(annual.value)||0, u=parseInt(uses.value,10)||1;
    if(u<=0){ res.classList.remove("show"); return; }
    perEl.textContent=fmt(a/u); res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
