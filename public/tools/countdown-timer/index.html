<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카운트다운 타이머 | 분·초 | FunnyFunny Cloud</title>
  <meta name="description" content="분·초를 설정하고 카운트다운합니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/countdown-timer/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#ef4444;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#dc2626,#ef4444);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);font-size:14px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;margin:4px;}
    .result{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:center;font-size:36px;font-weight:700;}
    .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; } .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }

  </style>
    <meta name="description" content="분·초." />
    <meta property="og:title" content="카운트다운 타이머" />
    <meta property="og:description" content="분·초." />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/countdown-timer/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="카운트다운 타이머" />
    <meta name="twitter:description" content="분·초." />
    <meta name="twitter:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />

  </head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⏱️</div><div><h1>카운트다운 타이머</h1><p class="sub">분·초</p></div></div></header>
    <div class="panel">
      <div class="row">
        <div class="field"><label>분</label><input type="number" id="min" value="1" min="0" /></div>
        <div class="field"><label>초</label><input type="number" id="sec" value="0" min="0" max="59" /></div>
      </div>
      <button type="button" class="btn" id="btnStart">시작</button><button type="button" class="btn btn-ghost" id="btnStop">정지</button>
      <div class="result" id="result"><span id="out">1:00</span></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/countdown-timer-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/stopwatch/">스톱워치</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){ var min=document.getElementById("min"), sec=document.getElementById("sec"), btnStart=document.getElementById("btnStart"), btnStop=document.getElementById("btnStop"), out=document.getElementById("out"); var total=0, id=null;
  function display(t){ var m=Math.floor(t/60), s=t%60; out.textContent=m+":"+(s<10?"0":"")+s; }
  btnStart.addEventListener("click",function(){ if(id) return; total=parseInt(min.value,10)||0; total=total*60+(parseInt(sec.value,10)||0); if(total<=0) return; display(total); id=setInterval(function(){ total--; display(total); if(total<=0){ clearInterval(id); id=null; out.textContent="Time's up!"; } },1000); });
  btnStop.addEventListener("click",function(){ if(id){ clearInterval(id); id=null; } });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
