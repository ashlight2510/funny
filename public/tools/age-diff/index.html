    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🎂</div><div><h1>나이 차이 계산</h1><p class="sub">두 생년월일 → 나이 차이(년·일)</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="row">
        <div class="field"><label>생년월일 1</label><input type="date" id="birth1" /></div>
        <div class="field"><label>생년월일 2</label><input type="date" id="birth2" /></div>
      </div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>차이 (일)</span><span class="v" id="days"></span></div>
        <div class="result-item"><span>차이 (대략 년)</span><span class="v" id="years"></span></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/age-diff-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/age-now/">만 나이</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  var b1=document.getElementById("birth1"), b2=document.getElementById("birth2");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), daysEl=document.getElementById("days"), yearsEl=document.getElementById("years");
  btn.addEventListener("click",function(){
    var d1=new Date(b1.value+"T12:00:00"), d2=new Date(b2.value+"T12:00:00");
    if(isNaN(d1.getTime())||isNaN(d2.getTime())){ res.classList.remove("show"); return; }
    var diffMs=Math.abs(d2-d1); var days=Math.floor(diffMs/(24*60*60*1000)); var years=(days/365).toFixed(1);
    daysEl.textContent=days+"일"; yearsEl.textContent=years+"년"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
