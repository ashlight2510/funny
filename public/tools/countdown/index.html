  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#dc2626;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#b91c1c,#dc2626);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .panel h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--muted);}
    .field{margin-bottom:14px;} .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);font-size:14px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;}
    .result-item{display:flex;justify-content:space-between;padding:8px 0;} .result-item .v{font-weight:700;color:var(--accent);font-size:18px;}
    .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; } .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }

<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">⏳</div><div><h1>D-day 카운트다운</h1><p class="sub">목표일까지 며칠 남았는지</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>목표일</label><input type="date" id="target" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>D-day</span><span class="v" id="dday"></span></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/countdown-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/datecalc/">날짜 차이</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  var target=document.getElementById("target"); var t=new Date(); t.setMonth(t.getMonth()+1); target.value=t.toISOString().slice(0,10);
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), ddayEl=document.getElementById("dday");
  btn.addEventListener("click",function(){
    var d=new Date(target.value+"T12:00:00"); var today=new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0);
    var diff=Math.ceil((d-today)/(24*60*60*1000));
    if(diff>0) ddayEl.textContent="D-"+diff; else if(diff===0) ddayEl.textContent="D-Day"; else ddayEl.textContent="D+"+(-diff);
    res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
