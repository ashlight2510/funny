<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />

  <!-- OG -->
  <meta property="og:title" content="왜 이런 결과가 나왔을까요? - 마음 컨디션 체크" />
  <meta property="og:description" content="오늘의 마음 컨디션 결과가 나온 이유와 상태 체크 방법을 알아보세요." />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b1220'/><text x='50' y='62' font-size='52' text-anchor='middle' fill='white'>🌙</text></svg>">
  
  <style>
    :root{
      --bg1:#fff8f8;
      --bg2:#f3f0ff;
      --card:#ffffff;
      --text:#1b1b1f;
      --muted:#666671;
      --line:#e9e7f3;
      --accent:#6b6eff;
      --accent2:#f4c2c2;
      --shadow: 0 16px 60px rgba(20, 20, 40, .10);
      --r: 22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color:var(--text);
      background: radial-gradient(900px 520px at 15% 10%, rgba(244,194,194,.55), transparent 60%), radial-gradient(900px 520px at 85% 15%, rgba(107,110,255,.22), transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
      overflow-x:hidden;
    }
    .wrap{ max-width: 800px; margin: 0 auto; padding: 28px 18px 80px; }
    header{ text-align:center; margin-bottom:32px; }
    .pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line); background: rgba(255,255,255,.55); border-radius: 999px; color:var(--muted); font-size:12px; margin-bottom:12px; backdrop-filter: blur(10px); }
    h1{ margin:0 0 12px; font-size: 28px; letter-spacing: -0.3px; line-height: 1.25; }
    .card{ background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 32px 28px; backdrop-filter: blur(14px); margin-bottom:24px; }
    .reasonItem{ margin-bottom:24px; }
    .reasonItem h3{ font-size:18px; font-weight:700; margin-bottom:8px; color:var(--accent); }
    .reasonItem p{ font-size:15px; line-height:1.7; color:var(--text); margin:0; }
    .checkList{ margin-top:32px; padding-top:24px; border-top:1px solid var(--line); }
    .checkList h3{ font-size:18px; font-weight:700; margin-bottom:16px; }
    .checkItem{ display:flex; gap:12px; align-items:flex-start; padding:14px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.7); margin-bottom:10px; }
    .checkItem input{ margin-top:3px; cursor:pointer; }
    .checkItem label{ cursor:pointer; flex:1; font-size:15px; line-height:1.6; }
    .ctaButton{ display:inline-block; margin-top:28px; padding: 16px 28px; background: linear-gradient(135deg, rgba(107,110,255,.18), rgba(244,194,194,.28)); border: 2px solid rgba(107,110,255,.25); border-radius: 18px; color: var(--text); font-weight: 700; font-size:16px; text-decoration:none; transition: transform .08s ease; }
    .ctaButton:hover{ transform: translateY(-2px); box-shadow: 0 4px 12px rgba(107,110,255,.2); }
    .adContainer{ margin:24px 0; min-height:250px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.4); border:1px solid var(--line); border-radius:var(--r); padding:20px; }
    .faqLinks{ margin-top:32px; padding-top:32px; border-top:1px solid var(--line); }
    .faqLinks h3{ font-size:16px; font-weight:650; margin-bottom:16px; color:var(--muted); }
    .faqList{ display:grid; gap:12px; }
    .faqLink{ padding:12px 16px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.7); color:var(--text); text-decoration:none; transition: all .2s ease; display:block; }
    .faqLink:hover{ border-color:var(--accent); background:rgba(107,110,255,.08); transform: translateY(-1px); }
    .footerNote{ margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.55; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="pill">🌙 결과 근거 분석</div>
      <h1>왜 이런 결과가 나왔을까요?</h1>
    </header>

    <div class="card">
      <div id="reasonsContainer"></div>
      
      <!-- 광고 위치 (근거 2개 후) -->
      <div class="adContainer">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4977995785737556" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>
      
      <div class="checkList">
        <h3>내 상태 체크</h3>
        <div class="checkItem">
          <input type="checkbox" id="check1">
          <label for="check1">최근 며칠 수면 패턴이 변했나요?</label>
        </div>
        <div class="checkItem">
          <input type="checkbox" id="check2">
          <label for="check2">스트레스나 압박감이 늘었나요?</label>
        </div>
        <div class="checkItem">
          <input type="checkbox" id="check3">
          <label for="check3">생리 주기나 호르몬 변화가 있었나요?</label>
        </div>
      </div>

      <a href="impact.html" id="impactLink" class="ctaButton">이 상태가 일상에 미치는 영향 확인 →</a>
    </div>

    <!-- 관련 질문 (FAQ) 2개 -->
    <div class="faqLinks">
      <h3>관련 질문</h3>
      <div class="faqList">
        <a href="../faq/sleep-connection.html" class="faqLink">수면이 결과에 영향을 주나요?</a>
        <a href="../faq/stress-signal.html" class="faqLink">스트레스 신호인가요?</a>
      </div>
    </div>

    <div class="footerNote">
      ※ 이 서비스는 의료 진단/치료 목적이 아닙니다.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const flow = params.get('flow') || 'mood';
    const severity = params.get('severity') || 'low';
    const isPms = (flow === 'pms');

    const reasons = {
      mood: {
        low: [
          { title: '최근 컨디션 변화', text: '피로나 수면 패턴의 작은 변화가 감정 상태에 영향을 줄 수 있어요. 오늘은 비교적 안정적이지만, 신호를 무시하지 않는 것이 중요해요.' },
          { title: '스트레스 누적', text: '최근 며칠간의 압박이나 스트레스가 작은 불안이나 우울감으로 나타날 수 있어요. 하지만 아직 회복 가능한 단계예요.' },
          { title: '자연스러운 감정 리듬', text: '감정은 항상 일정하지 않아요. 오늘의 상태는 정상 범위 내에서의 변화일 가능성이 높아요.' }
        ],
        mid: [
          { title: '컨디션과 스트레스의 복합 영향', text: '최근 피로, 압박, 수면 변화가 함께 작용해 감정을 더 크게 느끼게 만들 수 있어요. 몸이 신호를 보내는 중입니다.' },
          { title: '감정 조절 메커니즘 약화', text: '스트레스가 쌓이면 평소 잘 조절하던 감정도 더 민감하게 반응할 수 있어요. 지금은 휴식이 필요한 시기일 수 있어요.' },
          { title: '환경과 상황 요인', text: '계절 변화, 업무 부담, 관계적 스트레스 등 여러 요인이 감정 상태에 영향을 줄 수 있어요.' }
        ],
        high: [
          { title: '컨디션의 큰 변화 신호', text: '몸과 마음이 충분한 휴식과 회복을 필요로 하는 강한 신호를 보내고 있어요. 지금은 작은 단위로만 회복하는 것이 중요해요.' },
          { title: '스트레스와 피로의 누적', text: '장기간의 압박이나 피로가 감정 조절 능력을 크게 약화시킬 수 있어요. 이는 약함이 아니라 신호예요.' },
          { title: '회복 시스템의 부하', text: '신체적, 정신적 회복 메커니즘이 한계에 가까워져 있어요. 지금은 외부 도움을 받는 것도 좋은 선택이에요.' }
        ]
      },
      pms: {
        low: [
          { title: '호르몬 리듬의 자연스러운 변화', text: '배란 후~생리 전에는 에스트로겐과 프로게스테론 변화로 기분을 잡아주는 신호(세로토닌)가 흔들릴 수 있어요. 이는 정상적인 현상이에요.' },
          { title: '가벼운 신체적 변화', text: '몸의 붓기나 불편함이 감정 상태에도 영향을 줄 수 있어요. 하지만 오늘은 비교적 가벼운 수준이에요.' },
          { title: '예민함의 증가', text: '이 시기에는 평소보다 예민하게 반응할 수 있어요. 이는 약함이 아니라 몸의 자연스러운 리듬입니다.' }
        ],
        mid: [
          { title: '호르몬 변화와 감정 조절', text: '생리 전 호르몬 변화로 세로토닌 수치가 낮아지면서 우울감, 예민함, 무기력이 함께 나타날 수 있어요.' },
          { title: '신체 증상과 감정의 연결', text: '부종, 복통, 수면 변화 같은 신체 증상이 감정 상태를 더 어렵게 만들 수 있어요. 이는 당신의 잘못이 아니에요.' },
          { title: '스트레스와 호르몬의 상호작용', text: '이 시기에는 외부 스트레스가 호르몬 변화와 함께 작용해 감정을 더 크게 느끼게 만들 수 있어요.' }
        ],
        high: [
          { title: '강한 호르몬 신호', text: '호르몬 변화가 크게 감정 조절에 영향을 줄 수 있어요. 이는 PMDD처럼 치료가 도움이 되는 경우도 있어요.' },
          { title: '신체적·정신적 증상의 중복', text: '심한 신체 증상과 감정 변화가 함께 나타나 일상에 큰 지장을 줄 수 있어요. 전문가 상담이 도움이 될 수 있어요.' },
          { title: '회복 시스템의 과부하', text: '이 시기 몸의 회복 시스템이 한계에 가까워져 있어요. 혼자 견디려 하지 말고 도움을 받는 것이 좋아요.' }
        ]
      }
    };

    const reasonsData = reasons[flow]?.[severity] || reasons.mood.low;
    const container = document.getElementById('reasonsContainer');
    reasonsData.forEach((r, idx) => {
      const div = document.createElement('div');
      div.className = 'reasonItem';
      div.innerHTML = `<h3>${r.title}</h3><p>${r.text}</p>`;
      container.appendChild(div);
    });

    // impact 링크에 상태 전달
    const impactUrl = new URL('impact.html', window.location.href);
    impactUrl.searchParams.set('flow', flow);
    impactUrl.searchParams.set('severity', severity);
    document.getElementById('impactLink').href = impactUrl.toString();

    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4977995785737556" crossorigin="anonymous"></script>
</body>
</html>
