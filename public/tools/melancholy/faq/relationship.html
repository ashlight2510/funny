<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>예민한 날 대화는 어떻게? - 마음 컨디션 체크 FAQ</title>
  <meta name="description" content="컨디션이 낮을 때 관계와 대화를 어떻게 관리하는지 알아보세요." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b1220'/><text x='50' y='62' font-size='52' text-anchor='middle' fill='white'>🌙</text></svg>">
  <style>
    :root{--bg1:#fff8f8;--bg2:#f3f0ff;--card:#ffffff;--text:#1b1b1f;--muted:#666671;--line:#e9e7f3;--accent:#6b6eff;--accent2:#f4c2c2;--shadow: 0 16px 60px rgba(20, 20, 40, .10);--r: 22px;}
    *{box-sizing:border-box}
    body{margin:0;font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;color:var(--text);background: radial-gradient(900px 520px at 15% 10%, rgba(244,194,194,.55), transparent 60%), radial-gradient(900px 520px at 85% 15%, rgba(107,110,255,.22), transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg2));min-height:100vh;overflow-x:hidden;}
    .wrap{max-width: 800px; margin: 0 auto; padding: 28px 18px 80px;}
    header{text-align:center;margin-bottom:32px;}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);background: rgba(255,255,255,.55);border-radius: 999px;color:var(--muted);font-size:12px;margin-bottom:12px;backdrop-filter: blur(10px);}
    h1{margin:0 0 12px;font-size: 28px;letter-spacing: -0.3px;line-height: 1.25;}
    .card{background: var(--card);border: 1px solid var(--line);border-radius: var(--r);box-shadow: var(--shadow);padding: 32px 28px;backdrop-filter: blur(14px);margin-bottom:24px;}
    .answer{font-size:15px;line-height:1.7;color:var(--text);margin:0 0 16px;}
    .ctaButton{display:inline-block;margin-top:28px;padding: 16px 28px;background: linear-gradient(135deg, rgba(107,110,255,.18), rgba(244,194,194,.28));border: 2px solid rgba(107,110,255,.25);border-radius: 18px;color: var(--text);font-weight: 700;font-size:16px;text-decoration:none;transition: transform .08s ease;}
    .ctaButton:hover{transform: translateY(-2px);box-shadow: 0 4px 12px rgba(107,110,255,.2);}
    .footerNote{margin-top: 24px;color: var(--muted);font-size: 12px;line-height: 1.55;text-align:center;}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="pill">🌙 FAQ</div>
      <h1>예민한 날 대화는 어떻게?</h1>
    </header>
    <div class="card">
      <p class="answer">오늘은 중요한 대화나 갈등이 생길 수 있는 주제는 피하는 것이 좋아요. 예민함이 증가하면 작은 말도 크게 느껴질 수 있습니다.</p>
      <p class="answer">상대방에게 오늘 컨디션이 좋지 않다는 것을 간단히 알려주거나, 대화는 내일로 미루는 것이 좋습니다. 혼자 있고 싶을 땐 그 욕구를 존중하는 것도 중요해요.</p>
      <p class="answer">결과에서 관계 관리에 대한 구체적인 가이드를 확인할 수 있어요.</p>
      <a href="../result/impact.html" class="ctaButton">이 질문의 답을 결과로 확인하기 →</a>
    </div>
    <div class="footerNote">※ 이 서비스는 의료 진단/치료 목적이 아닙니다.</div>
  </div>
</body>
</html>
