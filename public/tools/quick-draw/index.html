<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>빠른 손 | 준비 후 GO 신호 랜덤 | FunnyFunny Cloud</title>
  <meta name="description" content="준비 버튼을 누르면 랜덤 시간 후 GO가 뜹니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/quick-draw/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#e11d48;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#be123c,#e11d48);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;text-align:center;}
    .signal{font-size:48px;font-weight:800;margin:24px 0;}
    .btn{padding:14px 28px;border-radius:12px;border:none;font-weight:600;font-size:18px;cursor:pointer;background:var(--accent);color:#fff;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🤠</div><div><h1>빠른 손</h1><p class="sub">준비 후 GO 신호 랜덤</p></div></div></header>
    <div class="panel">
      <div class="signal" id="signal">준비...</div>
      <button type="button" class="btn" id="btnReady">준비</button>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/quick-draw-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/reaction-test/">반응 속도</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ var signal=document.getElementById("signal"), btn=document.getElementById("btnReady"); var id=null;
  btn.addEventListener("click",function(){ if(id) return; signal.textContent="대기..."; var delay=1000+Math.floor(Math.random()*4000); id=setTimeout(function(){ id=null; signal.textContent="GO!"; },delay); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
