<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR 코드 만들기 | 무료 QR 코드 생성기 | FunnyFunny Cloud</title>
    <meta name="description" content="텍스트나 URL을 입력하면 QR 코드를 바로 생성합니다. 무료 QR 코드 만들기 도구. 이미지 다운로드 지원." />
    <meta property="og:title" content="QR 코드 만들기 | 무료 QR 코드 생성기 | FunnyFunny Cloud" />
    <meta property="og:description" content="URL·텍스트로 QR 코드를 무료로 생성하고 다운로드하세요." />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/qrcode/" />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0b1220/ffffff&text=QR+Code+Generator" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/qrcode/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230b1220'/><rect x='8' y='8' width='14' height='14' fill='%23fff'/><rect x='42' y='8' width='14' height='14' fill='%23fff'/><rect x='8' y='42' width='14' height='14' fill='%23fff'/><rect x='26' y='26' width='12' height='12' fill='%23818cf8'/><rect x='42' y='42' width='14' height='14' fill='%23fff'/></svg>" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #818cf8; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      input, textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      input:focus, textarea:focus { outline: none; border-color: var(--accent); }
      textarea { min-height: 80px; resize: vertical; }
      .qr-wrap { text-align: center; padding: 20px; background: #fff; border-radius: 12px; margin: 16px 0; display: inline-block; }
      .qr-wrap img { display: block; max-width: 280px; height: auto; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; margin-right: 8px; margin-top: 8px; }
      .btn:hover { filter: brightness(1.1); }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
      .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
      .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      body:has(#tool-share-block) { flex-wrap: wrap; }
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; width: 100%; flex: 0 0 100%; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">📱</div>
          <div>
            <h1>QR 코드 만들기</h1>
            <p class="sub">URL·텍스트를 입력하면 QR 코드를 생성합니다</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>내용 입력</h3>
        <textarea id="qrInput" placeholder="https://example.com 또는 아무 텍스트를 입력하세요.">https://funnyfunny.cloud</textarea>
        <p class="hint">링크, 연락처, 짧은 문구 등 무엇이든 넣을 수 있어요.</p>
      </div>

      <div class="panel">
        <h3>QR 코드</h3>
        <div id="qrOut" style="display:none;">
          <div class="qr-wrap"><img id="qrImg" alt="QR Code" /></div>
          <button type="button" class="btn" id="btnDownload">이미지로 저장</button>
        </div>
        <p id="qrPlaceholder" class="hint">위에 내용을 입력한 뒤 생성 버튼을 누르세요.</p>
        <button type="button" class="btn" id="btnGenerate">QR 코드 생성</button>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/qrcode-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>

    <script>
      (function(){
        var qrInput = document.getElementById("qrInput");
        var qrOut = document.getElementById("qrOut");
        var qrImg = document.getElementById("qrImg");
        var qrPlaceholder = document.getElementById("qrPlaceholder");
        var btnGenerate = document.getElementById("btnGenerate");
        var btnDownload = document.getElementById("btnDownload");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        function generate() {
          var text = (qrInput.value || "").trim();
          if (!text) {
            qrOut.style.display = "none";
            qrPlaceholder.style.display = "block";
            qrPlaceholder.textContent = "내용을 입력한 뒤 생성 버튼을 누르세요.";
            return;
          }
          QRCode.toDataURL(text, { width: 280, margin: 2 }, function(err, url) {
            if (err) {
              qrPlaceholder.textContent = "생성 중 오류가 났어요. 내용을 확인해 주세요.";
              qrPlaceholder.style.display = "block";
              qrOut.style.display = "none";
              return;
            }
            qrImg.src = url;
            qrImg.dataset.url = url;
            qrOut.style.display = "block";
            qrPlaceholder.style.display = "none";
          });
        }

        btnGenerate.addEventListener("click", generate);

        btnDownload.addEventListener("click", function() {
          var url = qrImg.dataset.url;
          if (!url) return;
          var a = document.createElement("a");
          a.href = url;
          a.download = "qrcode.png";
          a.click();
        });

        btnShare.addEventListener("click", function(){
          var u = location.href;
          if (navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "qrcode" }); } catch(e){}
        });

        qrInput.addEventListener("keydown", function(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); } });
      })();
    </script>
  </body>
</html>
