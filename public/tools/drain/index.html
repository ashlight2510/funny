          const question = qs[index];

          questionTitle.classList.add("fade-in");

            button.addEventListener("click", function () {
              handleChoiceClick(choice.value);
            });
            choicesContainer.appendChild(button);
          });

          // 이전 버튼 표시/숨김
          if (index === 0) {
            prevBtn.classList.add("hidden");
          } else {
            prevBtn.classList.remove("hidden");
          }
        }

        // 선택지 클릭 처리
        function handleChoiceClick(value) {
          const qs = getQuestions();
          const question = qs[currentQuestionIndex];

          // 답변 저장
          answers[currentQuestionIndex] = {
            questionId: question.id,
            value: value,
            type: question.type,
          };

          // 점수 누적
          scores[question.type] += value;

          // 다음 질문으로 이동
          if (currentQuestionIndex < qs.length - 1) {
            setTimeout(() => {
              showQuestion(currentQuestionIndex + 1);
            }, 200);
          } else {
            // 모든 질문 완료 - 결과 표시
            setTimeout(() => {
              showResult();
            }, 200);
          }
        }

        // 이전 버튼
        prevBtn.addEventListener("click", function () {
          if (currentQuestionIndex > 0) {
            // 이전 답변의 점수 제거
            const prevAnswer = answers[currentQuestionIndex - 1];
            if (prevAnswer) {
              scores[prevAnswer.type] -= prevAnswer.value;
              answers.pop();
            }
            showQuestion(currentQuestionIndex - 1);
          }
        });

        // 결과 계산 및 표시
        function showResult() {
          // 최고 점수 찾기
          let maxScore = -1;
          let resultType = "relation"; // 기본값

          const priority = ["relation", "overwork", "emotion", "thought"];

          for (const type of priority) {
            if (scores[type] > maxScore) {
              maxScore = scores[type];
              resultType = type;
            }
          }

          // result.html로 리다이렉트
          const params = new URLSearchParams({
            type: resultType,
            relation: scores.relation.toString(),
            overwork: scores.overwork.toString(),
            emotion: scores.emotion.toString(),
            thought: scores.thought.toString()
          });
          window.location.href = `result.html?${params.toString()}`;
        }

        // 다시 시작
        restartBtn.addEventListener("click", function () {
          // 상태 리셋
          currentQuestionIndex = 0;
          scores = {
            relation: 0,
            overwork: 0,
            emotion: 0,
            thought: 0,
          };
          answers = [];

          // 화면 전환
          resultSection.classList.add("hidden");
          startSection.classList.remove("hidden");
          headerSection.classList.remove("hidden");
        });

        // 공유하기
        shareBtn.addEventListener("click", async function () {
          const shareData = {

            url: window.location.href,
          };

          try {
            if (navigator.share) {
              await navigator.share(shareData);
            } else {
              // 클립보드 복사
              await navigator.clipboard.writeText(window.location.href);
              alert("링크가 클립보드에 복사되었습니다!");
            }
          } catch (err) {
            // 사용자가 공유를 취소한 경우 등
            if (err.name !== "AbortError") {
              // 클립보드 복사로 대체
              try {
                await navigator.clipboard.writeText(window.location.href);
                alert("링크가 클립보드에 복사되었습니다!");
              } catch (clipboardErr) {
                alert("공유 기능을 사용할 수 없습니다.");
              }
            }
          }
        });

        // 더 많은 테스트 해보기
        if (moreTestsBtn) {
          moreTestsBtn.addEventListener("click", function () {
            const targetUrl = moreTestsBtn.dataset.url || "https://funnyfunny.cloud/";
            window.open(targetUrl, "_blank", "noopener");

        }

        // i18n
        const translations = {
          ko: {
            badge: "인생 에너지 누수 진단기",
            title: "지금 나는 어디로 새고 있는가",

            btnStart: "시작하기",
            progressText: "Q1. 인생 에너지 누수 진단 중",

            resultIntro: "당신의 인생 에너지는 여기서 새고 있습니다",

            footer: "※ 이 테스트는 재미와 자기 성찰을 위한 비의학적 도구입니다.",
            shareText: "지금 나는 어디로 새고 있는가 - 내 결과를 확인해보세요!",
            alertCopySuccess: "링크가 클립보드에 복사되었습니다!",
            alertShareFail: "공유 기능을 사용할 수 없습니다.",
            choiceNever: "전혀 아니다",

          },
          en: {
            badge: "Life Energy Drain Diagnostic",
            title: "Where is my energy leaking?",
            subtitle: "Lately feeling burnout, lethargy, lack of focus… <br />The problem might not be laziness, but energy drain.",
            btnStart: "Start",

            btnPrev: "← Previous",

            tipsTitle: "Daily energy save strategies",

            btnMoreTests: "Try more tests",

            alertCopySuccess: "Link copied to clipboard!",

            choiceSometimes: "Sometimes",

        };

        const defaultLang = "ko";
        const supportedLangs = ["ko", "en"];
        let currentLang = defaultLang;

        function t(key, vars = {}) {
          const langTable = translations[currentLang] || translations.ko;
          const template = langTable?.[key] ?? translations.ko?.[key] ?? key;
          if (typeof template !== "string") {
            return template;
          }
          return template.replace(/\{(\w+)\}/g, (_, token) =>
            vars[token] !== undefined ? vars[token] : `{${token}}`
          );
        }

        // 질문 데이터에 영어 번역 추가
        const questionsEn = [

          },
        ];

        // 결과 타입별 텍스트에 영어 번역 추가
        const resultTypesEn = {
          relation: {
            title: "Relationship Drain Type",
            badge: "Energy leaks to people",
            oneLiner: "You like people but have weak boundaries, so energy keeps leaking.",
            description: "You're considerate and accommodating, so people say you're nice.\nBut that means you have less energy for yourself.\nYou may have patterns of not being able to say no, reading too much into situations, and burning yourself out to maintain relationships.",
            tips: [
              "Try saying 'I'll think about it' at least once today (no immediate answers)",

            ],
          },
          overwork: {
            title: "Overwork Accumulation Type",
            badge: "Consumed by tasks",
            oneLiner: "You have willpower and strong responsibility, but that also means high burnout risk.",
            description: "You work hard for work, study, and goals.\nBut you don't give yourself permission to 'rest is okay',\nso physical and mental fatigue may be gradually building up.",
            tips: [
              "Divide today's tasks into 'must do' and 'nice to do'",

            ],
          },
          emotion: {
            title: "Emotion Overspending Type",
            badge: "Swept by emotional waves",
            oneLiner: "Your emotional amplitude is large, and so is your energy swing.",
            description: "You feel joy, sadness, anxiety, and excitement deeply.\nThis sensitivity is a great strength, but unmanaged, it quickly exhausts you.\nRemember that the size of emotion is not the size of the event.",
            tips: [
              "Write one line each separating today's events into 'facts' and 'feelings'",
              "When emotions explode, drink water and think again 5 minutes later",
              "Reduce SNS/news consumption time by 30 minutes a day",
            ],
          },
          thought: {
            title: "Overthinking Overload Type",
            badge: "Brain running 24/7",
            oneLiner: "Your head never rests, so energy gets sucked into thoughts.",
            description: "You think a lot and have rich imagination.\nBut tasks to do, past events, and future worries all spin in your head at once,\nso you may lack energy to focus on here and now.",
            tips: [
              "Write all thoughts about tasks in a memo app and put them down from your brain for a while",
              "Turn off screens (phone/PC) 30 minutes before sleep and cool your head with books or music",
              "Think of and write down just 3 things you were grateful for today",
            ],
          },
        };

        function getQuestions() {
          return currentLang === "en" ? questionsEn : questions;
        }

        function getResultTypes() {
          return currentLang === "en" ? resultTypesEn : resultTypes;
        }

        function applyTranslations() {
          document.querySelectorAll("[data-i18n]").forEach((el) => {
            el.textContent = t(el.dataset.i18n);
          });
          document.querySelectorAll("[data-i18n-html]").forEach((el) => {
            el.innerHTML = t(el.dataset.i18nHtml);
          });
        }

        function setLang(lang, options = {}) {
          const nextLang = translations[lang] ? lang : defaultLang;
          currentLang = nextLang;
          document.documentElement.lang = nextLang;
          localStorage.setItem("preferredLang", nextLang);
          document.querySelectorAll(".lang-switch button").forEach((button) => {
            button.classList.toggle("active", button.dataset.lang === nextLang);
          });
          applyTranslations();
          // Update questions if in question section
          if (!questionSection.classList.contains("hidden") && currentQuestionIndex < getQuestions().length) {
            showQuestion(currentQuestionIndex);
          }
          // Update result if in result section
          if (!resultSection.classList.contains("hidden")) {
            showResult();
          }
          if (options.updateUrl) {
            const url = new URL(window.location.href);
            url.searchParams.set("lang", nextLang);
            window.history.replaceState({}, "", url);
          }
        }

        function detectLang() {
          const params = new URLSearchParams(window.location.search);
          const paramLang = params.get("lang");
          if (supportedLangs.includes(paramLang)) return paramLang;
          const stored = localStorage.getItem("preferredLang");
          if (supportedLangs.includes(stored)) return stored;
          const browserLang =
            navigator.languages && navigator.languages.length
              ? navigator.languages[0]
              : navigator.language;
          if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
            return "ko";
          }
          return defaultLang;
        }

        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.addEventListener("click", () => {
            setLang(button.dataset.lang, { updateUrl: true });
          });
        });

        setLang(detectLang(), { updateUrl: false });
      })();
    </script>
