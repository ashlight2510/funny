<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시크릿 산타 | 이름 → 누가 누구에게 | FunnyFunny Cloud</title>
  <meta name="description" content="이름 목록을 입력하면 누가 누구에게 선물할지 랜덤 매칭합니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/secret-santa/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#dc2626;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#b91c1c,#dc2626);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field textarea{width:100%;min-height:100px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;}
    .pair{margin:8px 0;padding:8px;background:#0b1220;border-radius:8px;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
    <meta name="description" content="이름 → 누가 누구에게." />
    <meta property="og:title" content="시크릿 산타" />
    <meta property="og:description" content="이름 → 누가 누구에게." />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/secret-santa/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="시크릿 산타" />
    <meta name="twitter:description" content="이름 → 누가 누구에게." />
    <meta name="twitter:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />

  </head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🎅</div><div><h1>시크릿 산타</h1><p class="sub">이름 → 누가 누구에게</p></div></div></header>
    <div class="panel">
      <div class="field"><label>이름 (한 줄에 하나, 2명 이상)</label><textarea id="names" placeholder="철수&#10;영희&#10;민수&#10;지연"></textarea></div>
      <button type="button" class="btn" id="btnMatch">매칭</button>
      <div class="result" id="result"></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/secret-santa-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/random-pair/">두 명 매칭</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  var names=document.getElementById("names"), btn=document.getElementById("btnMatch"), res=document.getElementById("result");
  btn.addEventListener("click",function(){ var arr=names.value.split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean); if(arr.length<2){ res.innerHTML="2명 이상 입력하세요"; res.classList.add("show"); return; } var recv=arr.slice(); shuffle(recv); while(recv.some(function(v,i){ return v===arr[i]; })) shuffle(recv); var html=""; for(var i=0;i<arr.length;i++) html+='<div class="pair">'+arr[i]+' → '+recv[i]+'</div>'; res.innerHTML=html; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
