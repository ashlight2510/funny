<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #8b5cf6; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
.btn:hover { filter: brightness(1.1); }
.result-line { margin-top: 12px; padding: 10px; background: #0b1220; border-radius: 10px; font-size: 14px; color: var(--accent); font-weight: 600; }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      #tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
      .category { margin-bottom: 20px; }
      .category-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">📐</div>
          <div>
            <h1>단위 변환기</h1>
            <p class="sub">길이·무게·온도·면적 한 페이지에서 변환</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <div class="category">
          <div class="category-title">길이</div>
          <div class="row">
            <div class="field">
              <label>cm</label>
              <input type="number" id="cm" step="0.01" placeholder="0" value="100" />
            </div>
            <div class="field">
              <label>inch</label>
              <input type="number" id="inch" step="0.01" placeholder="0" />
            </div>
          </div>
          <div class="result-line" id="lengthResult">100 cm = 39.37 inch</div>
        </div>

        <div class="category">
          <div class="category-title">무게</div>
          <div class="row">
            <div class="field">
              <label>kg</label>
              <input type="number" id="kg" step="0.01" placeholder="0" value="70" />
            </div>
            <div class="field">
              <label>lb (파운드)</label>
              <input type="number" id="lb" step="0.01" placeholder="0" />
            </div>
          </div>
          <div class="result-line" id="weightResult">70 kg = 154.32 lb</div>
        </div>

        <div class="category">
          <div class="category-title">온도</div>
          <div class="row">
            <div class="field">
              <label>°C</label>
              <input type="number" id="celsius" step="0.1" placeholder="0" value="25" />
            </div>
            <div class="field">
              <label>°F</label>
              <input type="number" id="fahrenheit" step="0.1" placeholder="0" />
            </div>
          </div>
          <div class="result-line" id="tempResult">25 °C = 77 °F</div>
        </div>

        <div class="category">
          <div class="category-title">면적</div>
          <div class="row">
            <div class="field">
              <label>㎡</label>
              <input type="number" id="sqm" step="0.01" placeholder="0" value="99" />
            </div>
            <div class="field">
              <label>평</label>
              <input type="number" id="pyeong" step="0.01" placeholder="0" />
            </div>
          </div>
          <div class="result-line" id="areaResult">99 ㎡ ≈ 29.93 평</div>
        </div>

        <p class="note">입력 시 실시간 변환됩니다. 평 = ㎡ ÷ 3.3058 (참고용).</p>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/unit-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/exchange/">환율 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>

    <script>
      (function(){
        var PYEONG_PER_SQM = 1 / 3.3058;
        function updateLength(){
          var cm = parseFloat(document.getElementById("cm").value);
          var inch = document.getElementById("inch");
          if (!isNaN(cm)) { inch.value = (cm / 2.54).toFixed(2); document.getElementById("lengthResult").textContent = cm + " cm = " + inch.value + " inch"; }
        }
        function updateLengthFromInch(){
          var inch = parseFloat(document.getElementById("inch").value);
          var cm = document.getElementById("cm");
          if (!isNaN(inch)) { cm.value = (inch * 2.54).toFixed(2); document.getElementById("lengthResult").textContent = cm.value + " cm = " + inch + " inch"; }
        }
        function updateWeight(){
          var kg = parseFloat(document.getElementById("kg").value);
          var lb = document.getElementById("lb");
          if (!isNaN(kg)) { lb.value = (kg * 2.205).toFixed(2); document.getElementById("weightResult").textContent = kg + " kg = " + lb.value + " lb"; }
        }
        function updateWeightFromLb(){
          var lb = parseFloat(document.getElementById("lb").value);
          var kg = document.getElementById("kg");
          if (!isNaN(lb)) { kg.value = (lb / 2.205).toFixed(2); document.getElementById("weightResult").textContent = kg.value + " kg = " + lb + " lb"; }
        }
        function updateTemp(){
          var c = parseFloat(document.getElementById("celsius").value);
          var f = document.getElementById("fahrenheit");
          if (!isNaN(c)) { var v = (c * 9/5) + 32; f.value = v.toFixed(1); document.getElementById("tempResult").textContent = c + " °C = " + f.value + " °F"; }
        }
        function updateTempFromF(){
          var f = parseFloat(document.getElementById("fahrenheit").value);
          var c = document.getElementById("celsius");
          if (!isNaN(f)) { var v = (f - 32) * 5/9; c.value = v.toFixed(1); document.getElementById("tempResult").textContent = c.value + " °C = " + f + " °F"; }
        }
        function updateArea(){
          var sqm = parseFloat(document.getElementById("sqm").value);
          var py = document.getElementById("pyeong");
          if (!isNaN(sqm)) { py.value = (sqm * PYEONG_PER_SQM).toFixed(2); document.getElementById("areaResult").textContent = sqm + " ㎡ ≈ " + py.value + " 평"; }
        }
        function updateAreaFromPyeong(){
          var py = parseFloat(document.getElementById("pyeong").value);
          var sqm = document.getElementById("sqm");
          if (!isNaN(py)) { sqm.value = (py / PYEONG_PER_SQM).toFixed(2); document.getElementById("areaResult").textContent = sqm.value + " ㎡ ≈ " + py + " 평"; }
        }
        document.getElementById("cm").addEventListener("input", updateLength);
        document.getElementById("inch").addEventListener("input", updateLengthFromInch);
        document.getElementById("kg").addEventListener("input", updateWeight);
        document.getElementById("lb").addEventListener("input", updateWeightFromLb);
        document.getElementById("celsius").addEventListener("input", updateTemp);
        document.getElementById("fahrenheit").addEventListener("input", updateTempFromF);
        document.getElementById("sqm").addEventListener("input", updateArea);
        document.getElementById("pyeong").addEventListener("input", updateAreaFromPyeong);
        updateLength(); updateWeight(); updateTemp(); updateArea();

        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");
        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "unit" }); } catch(e){}
        });
      })();
    </script>
  </body>
</html>
