<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #f59e0b; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #b45309 0%, #f59e0b 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .opts { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
      .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; color: var(--muted); }
      .opts input { accent-color: var(--accent); }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #0b1220; }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .result-item .v { font-size: 18px; font-weight: 700; color: var(--accent); }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      #tool-share-block { text-align: center; margin: 8px 0; font-size: 13px; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">🧾</div>
          <div>
            <h1>부가세 계산기</h1>
            <p class="sub">공급가·부가세·합계 변환 (일반 10% / 간이 1.5%)</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>입력</h3>
        <div class="opts">
          <label><input type="radio" name="mode" value="supply" checked /> 공급가액 입력</label>
          <label><input type="radio" name="mode" value="total" /> 세액 포함 합계 입력</label>
        </div>
        <div class="field">
          <label id="inputLabel">공급가액 (원)</label>
          <input type="number" id="amount" min="0" step="1" placeholder="예: 110000" value="100000" />
        </div>
        <div class="field">
          <label>과세 유형</label>
          <select id="taxType">
            <option value="10">일반 과세 (부가세 10%)</option>
            <option value="1.5">간이 과세 (부가세 1.5%)</option>
          </select>
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>공급가액</span><span class="v" id="outSupply"></span></div>
          <div class="result-item"><span>부가세</span><span class="v" id="outVat"></span></div>
          <div class="result-item"><span>합계</span><span class="v" id="outTotal"></span></div>
        </div>
        <p class="note">참고용입니다. 세금 신고·계산은 세무사 또는 국세청 안내를 따르세요.</p>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/vat-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/tax/">세금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>

    <script>
      (function(){
        function fmt(n) { return Math.round(n).toLocaleString() + "원"; }
        var modeSupply = document.querySelector('input[name="mode"][value="supply"]');
        var modeTotal = document.querySelector('input[name="mode"][value="total"]');
        var inputLabel = document.getElementById("inputLabel");
        var amount = document.getElementById("amount");
        var taxType = document.getElementById("taxType");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var outSupply = document.getElementById("outSupply");
        var outVat = document.getElementById("outVat");
        var outTotal = document.getElementById("outTotal");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        function updateLabel() {
          inputLabel.textContent = modeTotal.checked ? "세액 포함 합계 (원)" : "공급가액 (원)";
        }
        modeSupply.addEventListener("change", updateLabel);
        modeTotal.addEventListener("change", updateLabel);

        btnCalc.addEventListener("click", function(){
          var a = parseFloat(amount.value) || 0;
          if (a <= 0) { result.classList.remove("show"); return; }
          var rate = parseFloat(taxType.value) / 100;
          var supply, vat, total;
          if (modeTotal.checked) {
            total = a;
            supply = total / (1 + rate);
            vat = total - supply;
          } else {
            supply = a;
            vat = supply * rate;
            total = supply + vat;
          }
          outSupply.textContent = fmt(supply);
          outVat.textContent = fmt(vat);
          outTotal.textContent = fmt(total);
          result.classList.add("show");
        });

        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "vat" }); } catch(e){}
        });
        updateLabel();
      })();
    </script>
  </body>
</html>
