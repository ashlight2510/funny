<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>이미지 번역기 | FunnyFunny Cloud</title>
    <meta name="description" content="이미지에서 글자를 추출(OCR)하고 한·영 번역까지 한 번에. 스크린샷, 메뉴판, 문서 사진을 업로드하면 텍스트로 변환 후 번역합니다. 무료로 사용할 수 있습니다." />

    <meta property="og:title" content="이미지 번역기 | FunnyFunny Cloud" />
    <meta property="og:description" content="이미지에서 글자 추출(OCR) 후 한·영 번역. 스크린샷·메뉴판·문서 사진을 텍스트로 변환하고 번역합니다. 무료 도구." />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/imtranslate/" />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0b1220/ffffff&text=Image+Translate" />

    <link rel="canonical" href="https://funnyfunny.cloud/tools/imtranslate/" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230b1220'/><path d='M12 18h40v28H12z' fill='none' stroke='%2385a3ff' stroke-width='2'/><path d='M18 28h28M18 34h20M18 40h24' stroke='%23c7d8ff' stroke-width='1.5' stroke-linecap='round'/><path d='M36 44L42 38 48 44' fill='none' stroke='%2385a3ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #818cf8;
        --accent-hover: #6366f1;
        --border: #334155;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 18px 14px 100px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 18px;
      }
      .brand-badge {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%);
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 800;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .upload-zone {
        border: 2px dashed var(--border);
        border-radius: 16px;
        padding: 32px 20px;
        text-align: center;
        background: var(--card);
        margin-bottom: 20px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }
      .upload-zone:hover, .upload-zone.dragover {
        border-color: var(--accent);
        background: rgba(129, 140, 248, 0.08);
      }
      .upload-zone input { display: none; }
      .upload-zone .icon { font-size: 40px; margin-bottom: 8px; }
      .upload-zone .hint { color: var(--muted); font-size: 13px; }
      .upload-zone:focus { outline: none; }
      .clip-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .clip-hint { color: var(--muted); font-size: 13px; }
      .preview-wrap {
        margin-top: 12px;
        max-height: 240px;
        overflow: hidden;
        border-radius: 12px;
        background: #0b1220;
      }
      .preview-wrap img {
        max-width: 100%;
        max-height: 220px;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }
      .lang-row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .lang-row label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .lang-row select {
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 14px;
      }
      .btn {
        padding: 12px 20px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
      .btn-primary {
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        color: white;
      }
      .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }
      .btn-ghost {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      @media (max-width: 640px) {
        .two-col { grid-template-columns: 1fr; }
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
      }
      .panel textarea {
        width: 100%;
        min-height: 140px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0b1220;
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
        resize: vertical;
      }
      .panel textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.2);
      }
      .copy-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .status {
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        color: var(--muted);
        background: rgba(15, 23, 42, 0.6);
      }
      .status.loading { color: #93c5fd; }
      .status.error { color: #fca5a5; }
      .status.done { color: #86efac; }
      .footer-links {
        text-align: center;
        margin: 16px 0;
        font-size: 14px;
      }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .footer-links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">🖼️</div>
          <div>
            <h1>이미지 번역기</h1>
            <p class="sub">이미지 → 글자 추출(OCR) → 한·영 번역</p>
          </div>
        </div>
      </header>

      <section class="upload-zone" id="uploadZone" tabindex="0">
        <input type="file" id="fileInput" accept="image/*" />
        <div class="icon">📷</div>
        <div>이미지를 넣어 주세요 (드래그·클릭·붙여넣기)</div>
        <div class="hint">스크린샷, 메뉴판, 문서 사진 등. Ctrl+V(⌘V)로 클립보드 이미지 붙여넣기 가능</div>
        <div class="preview-wrap" id="previewWrap" style="display:none;">
          <img id="previewImg" alt="미리보기" />
        </div>
      </section>

      <div class="clip-row">
        <button type="button" class="btn btn-ghost" id="btnClipboardTranslate">클립보드 텍스트 번역</button>
        <span class="clip-hint">복사한 글을 클립보드에서 가져와 바로 번역합니다.</span>
      </div>

      <div class="lang-row">
        <label>
          <span>원문 언어</span>
          <select id="fromLang">
            <option value="kor">한국어</option>
            <option value="eng">English</option>
          </select>
        </label>
        <label>
          <span>번역 언어</span>
          <select id="toLang">
            <option value="eng">English</option>
            <option value="kor">한국어</option>
          </select>
        </label>
        <button type="button" class="btn btn-primary" id="btnRun">OCR + 번역</button>
        <button type="button" class="btn btn-ghost" id="btnTextOnly">원문 칸 텍스트만 번역</button>
      </div>

      <div id="status" class="status" style="display:none;"></div>

      <div class="two-col" id="resultArea" style="display:none;">
        <div class="panel">
          <h3>추출된 텍스트 (원문)</h3>
          <textarea id="textSource" placeholder="이미지 OCR 결과 또는 붙여넣은 텍스트가 여기 표시됩니다. 직접 입력·수정 후 '원문 칸 텍스트만 번역'으로 번역할 수 있어요."></textarea>
          <div class="copy-row">
            <button type="button" class="btn btn-ghost" id="copySource">원문 복사</button>
          </div>
        </div>
        <div class="panel">
          <h3>번역 결과</h3>
          <textarea id="textTranslated" placeholder="번역 결과가 여기에 표시됩니다." readonly></textarea>
          <div class="copy-row">
            <button type="button" class="btn btn-ghost" id="copyTranslated">번역 복사</button>
          </div>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/image-translate-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/guide/image-text-extract/">이미지 텍스트 추출</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block" style="text-align:center;margin:8px 0;font-size:13px;">
      <button type="button" id="btnShare" style="padding:4px 10px;cursor:pointer;border:1px solid #475569;border-radius:6px;background:#1e293b;color:#e2e8f0;">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;font-size:12px;"></span>
    </div>

    <script>
      (function () {
        var uploadZone = document.getElementById("uploadZone");
        var fileInput = document.getElementById("fileInput");
        var previewWrap = document.getElementById("previewWrap");
        var previewImg = document.getElementById("previewImg");
        var fromLang = document.getElementById("fromLang");
        var toLang = document.getElementById("toLang");
        var btnRun = document.getElementById("btnRun");
        var statusEl = document.getElementById("status");
        var resultArea = document.getElementById("resultArea");
        var textSource = document.getElementById("textSource");
        var textTranslated = document.getElementById("textTranslated");
        var copySource = document.getElementById("copySource");
        var copyTranslated = document.getElementById("copyTranslated");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");
        var btnClipboardTranslate = document.getElementById("btnClipboardTranslate");
        var btnTextOnly = document.getElementById("btnTextOnly");

        var currentFile = null;

        function showStatus(msg, type) {
          statusEl.textContent = msg;
          statusEl.style.display = "block";
          statusEl.className = "status " + (type || "");
        }
        function hideStatus() {
          statusEl.style.display = "none";
        }

        uploadZone.addEventListener("click", function () { fileInput.click(); });
        uploadZone.addEventListener("dragover", function (e) {
          e.preventDefault();
          uploadZone.classList.add("dragover");
        });
        uploadZone.addEventListener("dragleave", function () { uploadZone.classList.remove("dragover"); });
        uploadZone.addEventListener("drop", function (e) {
          e.preventDefault();
          uploadZone.classList.remove("dragover");
          var f = e.dataTransfer && e.dataTransfer.files[0];
          if (f && f.type.indexOf("image") !== -1) setFile(f);
        });
        fileInput.addEventListener("change", function () {
          var f = fileInput.files[0];
          if (f) setFile(f);
        });

        document.addEventListener("paste", function (e) {
          var items = e.clipboardData && e.clipboardData.items;
          if (!items) return;
          for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf("image") !== -1) {
              e.preventDefault();
              var file = items[i].getAsFile();
              if (file) setFile(file);
              return;
            }
          }
        });

        btnClipboardTranslate.addEventListener("click", function () {
          if (!navigator.clipboard || !navigator.clipboard.readText) {
            showStatus("이 브라우저에서는 클립보드 읽기가 제한될 수 있어요.", "error");
            return;
          }
          navigator.clipboard.readText().then(function (text) {
            text = (text || "").trim();
            if (!text) {
              showStatus("클립보드에 텍스트가 없어요. 복사한 뒤 다시 시도해 주세요.", "error");
              return;
            }
            resultArea.style.display = "block";
            textSource.value = text;
            textTranslated.value = "";
            btnClipboardTranslate.disabled = true;
            showStatus("번역 중…", "loading");
            translateText(text, fromLang.value, toLang.value, function (err, translated) {
              btnClipboardTranslate.disabled = false;
              if (err) {
                showStatus("번역 중 오류가 났어요. 나중에 다시 시도해 주세요.", "error");
                return;
              }
              textTranslated.value = translated;
              showStatus("클립보드 텍스트 번역이 완료되었습니다.", "done");
            });
          }).catch(function () {
            showStatus("클립보드 접근이 거부되었어요. 브라우저에서 클립보드 권한을 허용해 주세요.", "error");
          });
        });

        btnTextOnly.addEventListener("click", function () {
          var text = (textSource.value || "").trim();
          if (!text) {
            showStatus("원문 칸에 텍스트를 넣어 주세요. 이미지로 OCR하거나 클립보드 번역으로 채운 뒤 사용할 수 있어요.", "error");
            return;
          }
          resultArea.style.display = "block";
          btnTextOnly.disabled = true;
          showStatus("번역 중…", "loading");
          translateText(text, fromLang.value, toLang.value, function (err, translated) {
            btnTextOnly.disabled = false;
            if (err) {
              showStatus("번역 중 오류가 났어요.", "error");
              return;
            }
            textTranslated.value = translated;
            showStatus("번역이 완료되었습니다.", "done");
          });
        });

        function setFile(file) {
          currentFile = file;
          var url = URL.createObjectURL(file);
          previewImg.src = url;
          previewWrap.style.display = "block";
          resultArea.style.display = "none";
          textSource.value = "";
          textTranslated.value = "";
          hideStatus();
        }

        var langPairMap = {
          kor: "ko",
          eng: "en"
        };

        function translateText(text, from, to, cb) {
          var q = encodeURIComponent(text);
          var pair = langPairMap[from] + "|" + langPairMap[to];
          var url = "https://api.mymemory.translated.net/get?q=" + q + "&langpair=" + pair;
          fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.responseStatus === 200 && data.responseData && data.responseData.translatedText) {
                cb(null, data.responseData.translatedText);
              } else {
                cb(new Error("번역 실패"));
              }
            })
            .catch(function (err) { cb(err); });
        }

        btnRun.addEventListener("click", function () {
          if (!currentFile) {
            showStatus("이미지를 먼저 넣어 주세요.", "error");
            return;
          }
          btnRun.disabled = true;
          showStatus("OCR 실행 중…", "loading");
          resultArea.style.display = "block";
          textSource.value = "";
          textTranslated.value = "";

          Tesseract.recognize(currentFile, [fromLang.value === "kor" ? "kor" : "eng"], {
            logger: function (m) {
              if (m.status === "recognizing text") showStatus("글자 인식 중… " + (m.progress ? Math.round(m.progress * 100) + "%" : ""), "loading");
            }
          })
            .then(function (result) {
              var text = (result.data && result.data.text) ? result.data.text.trim() : "";
              textSource.value = text;
              if (!text) {
                showStatus("추출된 텍스트가 없습니다. 더 선명한 이미지를 사용해 보세요.", "error");
                btnRun.disabled = false;
                return;
              }
              showStatus("번역 중…", "loading");
              translateText(text, fromLang.value, toLang.value, function (err, translated) {
                btnRun.disabled = false;
                if (err) {
                  showStatus("번역 중 오류가 났어요. 나중에 다시 시도해 주세요.", "error");
                  return;
                }
                textTranslated.value = translated;
                showStatus("OCR과 번역이 완료되었습니다.", "done");
              });
            })
            .catch(function (err) {
              btnRun.disabled = false;
              showStatus("OCR 중 오류: " + (err.message || "알 수 없음"), "error");
            });
        });

        copySource.addEventListener("click", function () {
          textSource.select();
          document.execCommand("copy");
          shareToast.textContent = "원문 복사했어요";
          shareToast.style.display = "inline";
          setTimeout(function () { shareToast.style.display = "none"; }, 1500);
        });
        copyTranslated.addEventListener("click", function () {
          textTranslated.select();
          document.execCommand("copy");
          shareToast.textContent = "번역 복사했어요";
          shareToast.style.display = "inline";
          setTimeout(function () { shareToast.style.display = "none"; }, 1500);
        });

        btnShare.addEventListener("click", function () {
          var u = location.href;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(u).then(function () {
              shareToast.textContent = "복사했어요";
              shareToast.style.display = "inline";
              setTimeout(function () { shareToast.style.display = "none"; }, 1500);
            });
          }
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "imtranslate" }); } catch (e) {}
        });

        fromLang.addEventListener("change", function () {
          var f = fromLang.value;
          var t = toLang.value;
          if (f === t) toLang.value = f === "kor" ? "eng" : "kor";
        });
        toLang.addEventListener("change", function () {
          var f = fromLang.value;
          var t = toLang.value;
          if (f === t) fromLang.value = t === "kor" ? "eng" : "kor";
        });
      })();
    </script>
  </body>
</html>
