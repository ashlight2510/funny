<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🐕</div><div><h1>반려동물 월 비용</h1><p class="sub">종류·크기·항목 → 월 예상 비용</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>종류</label><select id="type"><option value="dog">강아지</option><option value="cat">고양이</option></select></div>
      <div class="field"><label>크기 (강아지: kg 기준)</label><select id="size"><option value="s">소형 (~10kg)</option><option value="m">중형 (10~25kg)</option><option value="l">대형 (25kg~)</option></select></div>
      <div class="field"><label>사료 월 예상 (원)</label><input type="number" id="food" min="0" step="5000" value="80000" /></div>
      <div class="field"><label>기타(용품·병원 등) 월 예상 (원)</label><input type="number" id="etc" min="0" step="5000" value="50000" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>월 예상 비용</span><span class="v" id="total"></span></div>
        <div class="result-item"><span>연 환산</span><span class="v" id="annual"></span></div>
        <p class="note">사료·기타를 직접 입력한 참고용입니다. 병원·보험 등은 가구마다 다릅니다.</p>
      </div>
    </div>

  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
  var food=document.getElementById("food"), etc=document.getElementById("etc");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), totalEl=document.getElementById("total"), annEl=document.getElementById("annual");
  btn.addEventListener("click",function(){
    var f=parseFloat(food.value)||0, e=parseFloat(etc.value)||0; var sum=f+e;
    totalEl.textContent=fmt(sum); annEl.textContent=fmt(sum*12); res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
