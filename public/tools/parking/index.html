<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>주차 시간·요금 계산기 | FunnyFunny Cloud</title>
    <meta name="description" content="입차·출차 시간과 시간당 요금을 입력하면 주차 요금을 계산합니다. 무료 주차 요금 계산기." />
    <meta property="og:title" content="주차 시간·요금 계산기 | FunnyFunny Cloud" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/parking/" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/parking/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #64748b; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #475569 0%, #64748b 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
      .result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
      .result-item .v { font-weight: 700; color: var(--accent); }
      .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
      .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
body:has(#tool-share-block) { flex-wrap: wrap; }
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; width: 100%; flex: 0 0 100%; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }

  </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">🅿️</div>
          <div>
            <h1>주차 시간·요금 계산기</h1>
            <p class="sub">입차·출차 시간 + 요금제로 주차비 계산</p>
          </div>
        </div>
      </header>
      <div class="panel">
        <h3>입력</h3>
        <div class="row">
          <div class="field">
            <label>입차 시각</label>
            <input type="datetime-local" id="inTime" />
          </div>
          <div class="field">
            <label>출차 시각</label>
            <input type="datetime-local" id="outTime" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>기본 시간 (분)</label>
            <input type="number" id="baseMin" min="0" value="30" />
          </div>
          <div class="field">
            <label>기본 요금 (원)</label>
            <input type="number" id="baseFee" min="0" value="2000" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>추가 단위 (분)</label>
            <input type="number" id="unitMin" min="1" value="10" />
          </div>
          <div class="field">
            <label>추가 단위 요금 (원)</label>
            <input type="number" id="unitFee" min="0" value="500" />
          </div>
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>주차 시간</span><span class="v" id="duration"></span></div>
          <div class="result-item"><span>예상 요금</span><span class="v" id="fee"></span></div>
          <p class="note">기본시간 내는 기본요금, 초과분은 추가 단위로 올림 계산. 실제 주차장 요금제와 다를 수 있습니다.</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/parking-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/datecalc/">날짜 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>
    <script>
      (function(){
        function fmt(n){ return Math.round(n).toLocaleString() + "원"; }
        var inTime = document.getElementById("inTime");
        var outTime = document.getElementById("outTime");
        var baseMin = document.getElementById("baseMin");
        var baseFee = document.getElementById("baseFee");
        var unitMin = document.getElementById("unitMin");
        var unitFee = document.getElementById("unitFee");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var durationEl = document.getElementById("duration");
        var feeEl = document.getElementById("fee");
        var now = new Date();
        inTime.value = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0") + "T" + String(now.getHours()).padStart(2,"0") + ":00";
        var out = new Date(now.getTime() + 2*60*60*1000);
        outTime.value = out.getFullYear() + "-" + String(out.getMonth()+1).padStart(2,"0") + "-" + String(out.getDate()).padStart(2,"0") + "T" + String(out.getHours()).padStart(2,"0") + ":00";
        btnCalc.addEventListener("click", function(){
          var t1 = new Date(inTime.value);
          var t2 = new Date(outTime.value);
          if (isNaN(t1.getTime()) || isNaN(t2.getTime()) || t2 <= t1) { result.classList.remove("show"); return; }
          var min = Math.ceil((t2 - t1) / (60*1000));
          var baseM = parseInt(baseMin.value, 10) || 30;
          var baseF = parseFloat(baseFee.value) || 2000;
          var unitM = parseInt(unitMin.value, 10) || 10;
          var unitF = parseFloat(unitFee.value) || 500;
          var fee = baseF;
          if (min > baseM) fee += Math.ceil((min - baseM) / unitM) * unitF;
          var h = Math.floor(min / 60);
          var m = min % 60;
          durationEl.textContent = h + "시간 " + m + "분";
          feeEl.textContent = fmt(fee);
          result.classList.add("show");
        });
        document.getElementById("btnShare").addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById("tool-share-toast").textContent = "복사했어요"; document.getElementById("tool-share-toast").style.display = "inline"; setTimeout(function(){ document.getElementById("tool-share-toast").style.display = "none"; }, 1500); });
        });
      })();
    </script>
  </body>
</html>
