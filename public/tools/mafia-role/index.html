<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마피아 역할 | 시민/마피아 배정 | FunnyFunny Cloud</title>
  <meta name="description" content="이름 목록과 마피아 수를 입력하면 역할을 랜덤 배정합니다." />
  <link rel="canonical" href="https://funnyfunny.cloud/tools/mafia-role/" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#991b1b;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7f1d1d,#991b1b);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field textarea,.field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);}
    .field textarea{min-height:80px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;}
    .role{margin:6px 0;} .mafia{color:#f87171;} .citizen{color:#94a3b8;}
    .footer-links{text-align:center;margin:16px 0;font-size:14px;} .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🕵️</div><div><h1>마피아 역할</h1><p class="sub">시민/마피아 배정</p></div></div></header>
    <div class="panel">
      <div class="field"><label>이름 (한 줄에 하나)</label><textarea id="names" placeholder="철수&#10;영희&#10;민수&#10;지연"></textarea></div>
      <div class="field"><label>마피아 수</label><input type="number" id="mafiaN" value="1" min="1" /></div>
      <button type="button" class="btn" id="btnAssign">배정</button>
      <div class="result" id="result"></div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/mafia-role-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/werewolf-role/">늑대인간</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span></div>
  <script>
(function(){ function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  var names=document.getElementById("names"), mafiaN=document.getElementById("mafiaN"), btn=document.getElementById("btnAssign"), res=document.getElementById("result");
  btn.addEventListener("click",function(){ var arr=names.value.split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean); var m=Math.min(parseInt(mafiaN.value,10)||1,arr.length); shuffle(arr); var html=""; for(var i=0;i<arr.length;i++) html+='<div class="role '+(i<m?"mafia":"citizen")+'">'+arr[i]+': '+(i<m?"🕵️ 마피아":"👤 시민")+'</div>'; res.innerHTML=html; res.classList.add("show"); });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
