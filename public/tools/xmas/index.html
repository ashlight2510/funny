    <script>
      // =========================
      // i18n
      // =========================
      const translations = {
        ko: {
          metaTitle: "크리스마스 선물, 따뜻함 리포트 🎁",
          title: "크리스마스 선물,<br />따뜻함 리포트",
          resultRateLabel: "🎯 선물이 따뜻하게 도착할 확률",
          tipsTitle: "🎁 더 따뜻해지는 선택",
          merryChristmas: "🎄 메리 크리스마스 🎄",
          btnOtherServices: "다른 서비스 보기",
          questionRelationship: "누구에게 주는 선물인가요?",
          questionBudget: "이번 선물 예산은?",
          questionGift: "선물 타입은?",
          questionPersona: "상대 성향은?",
          optionLover: "💑 연인",
          optionFling: "🌱 썸",
          optionSpouse: "💍 부부",
          optionWork: "🏢 회사/지인",
          optionLow: "1~3만",
          optionMid: "3~7만",
          optionHigh: "7~15만",
          optionPremium: "15만 이상",
          optionPractical: "🎧 실용형",
          optionEmotional: "🎨 감성형",
          optionFashion: "👕 패션형",
          optionExperience: "🎫 경험형",
          optionPracticalPersona: "🧠 실용파",
          optionSensitive: "💖 감성파",
          optionPicky: "😎 취향 확고",
          optionUnknown: "🤷‍♀️ 잘 모르겠음",
          tip1: "🎫 경험형 선물은 기억에 오래 남아요",
          tip2: "📝 짧은 카드 한 줄이 체감을 바꿔요",
          tip3: "🎁 같이 고르자고 말해도 충분히 좋아요",
          tip4: "🍰 작은 디저트 하나 추가해보세요",
          temperatureCozy: "🎄 포근포근 크리스마스",
          temperatureWarm: "🔥 온기 유지 중",
          temperaturePerfect: "🧣 따뜻하게 마무리하면 완벽",
          commentDefault: "이미 충분히 잘하고 있어요.<br />크리스마스는 마음이 더 중요한 날이에요.",
        },
        en: {
          metaTitle: "Christmas Gift, Warmth Report 🎁",
          title: "Christmas Gift,<br />Warmth Report",
          resultRateLabel: "🎯 Probability of warm gift arrival",
          tipsTitle: "🎁 Choices to make it warmer",
          merryChristmas: "🎄 Merry Christmas 🎄",
          btnOtherServices: "View Other Services",
          questionRelationship: "Who is this gift for?",
          questionBudget: "What's your gift budget?",
          questionGift: "What type of gift?",
          questionPersona: "What's their personality?",
          optionLover: "💑 Lover",
          optionFling: "🌱 Casual",
          optionSpouse: "💍 Spouse",
          optionWork: "🏢 Colleague/Friend",
          optionLow: "10~30K KRW",
          optionMid: "30~70K KRW",
          optionHigh: "70~150K KRW",
          optionPremium: "150K+ KRW",
          optionPractical: "🎧 Practical",
          optionEmotional: "🎨 Emotional",
          optionFashion: "👕 Fashion",
          optionExperience: "🎫 Experience",
          optionPracticalPersona: "🧠 Practical",
          optionSensitive: "💖 Sensitive",
          optionPicky: "😎 Picky",
          optionUnknown: "🤷‍♀️ Unknown",
          tip1: "🎫 Experience gifts last longer in memory",
          tip2: "📝 A short card line changes the feeling",
          tip3: "🎁 Saying 'let's choose together' is good enough",
          tip4: "🍰 Add a small dessert",
          temperatureCozy: "🎄 Cozy Christmas",
          temperatureWarm: "🔥 Keeping Warm",
          temperaturePerfect: "🧣 Perfect if finished warmly",
          commentDefault: "You're already doing well enough.<br />Christmas is a day when the heart matters more.",
        },
      };

      const defaultLang = "ko";
      const supportedLangs = ["ko", "en"];
      let currentLang = defaultLang;

      function t(key, vars = {}) {
        const langTable = translations[currentLang] || translations.ko;
        let template = langTable?.[key] ?? translations.ko?.[key] ?? key;
        if (typeof template !== "string") return template;
        Object.keys(vars).forEach((k) => {
          template = template.replace(new RegExp(`\\{${k}\\}`, "g"), vars[k]);
        });
        return template;
      }

      function applyTranslations() {
        document.title = t("metaTitle");
        document.documentElement.lang = currentLang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const translated = t(el.dataset.i18n);
          if (translated.includes("<br") || translated.includes("<br />") || translated.includes("<br/>")) {
            el.innerHTML = translated;
          } else {
            el.textContent = translated;
          }
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          el.innerHTML = t(el.dataset.i18nHtml);
        });
        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          if (el.tagName === "TITLE") {
            el.textContent = t(el.dataset.i18nTitle);
          } else {
            el.title = t(el.dataset.i18nTitle);
          }
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          el.placeholder = t(el.dataset.i18nPlaceholder);
        });
        document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
          el.setAttribute("aria-label", t(el.dataset.i18nAria));
        });
        document.querySelectorAll("[data-i18n-alt]").forEach((el) => {
          el.setAttribute("alt", t(el.dataset.i18nAlt));
        });
      }

      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const paramLang = params.get("lang");
        if (supportedLangs.includes(paramLang)) return paramLang;
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) return stored;
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }

      function setLang(lang, options = {}) {
        const nextLang = supportedLangs.includes(lang) ? lang : defaultLang;
        currentLang = nextLang;
        window.currentLang = currentLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === nextLang);
        });
        applyTranslations();
        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
        // Update dynamic content
        if (typeof step !== "undefined" && step !== null) {
          if (step < getQuestions().length) {
            renderQuestion();
          } else if (document.getElementById("resultBox") && !document.getElementById("resultBox").classList.contains("hidden")) {
            showResult();
          }
        }
      }

      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          setLang(button.dataset.lang, { updateUrl: true });
        });
      });

      setLang(detectLang(), { updateUrl: false });

      // Make t() function and currentLang globally available
      window.t = t;
      window.currentLang = currentLang;
      window.setLang = setLang;

      /* ---------------- data ---------------- */

      const questions_base = [
        {
          id: "relationship",
          title: "누구에게 주는 선물인가요?",
          options: [
            { v: "lover", t: "💑 연인" },
            { v: "fling", t: "🌱 썸" },
            { v: "spouse", t: "💍 부부" },
            { v: "work", t: "🏢 회사/지인" },
          ],
        },
        {
          id: "budget",
          title: "이번 선물 예산은?",
          options: [
            { v: "low", t: "1~3만" },
            { v: "mid", t: "3~7만" },
            { v: "high", t: "7~15만" },
            { v: "premium", t: "15만 이상" },
          ],
        },
        {
          id: "gift",
          title: "선물 타입은?",
          options: [
            { v: "practical", t: "🎧 실용형" },
            { v: "emotional", t: "🎨 감성형" },
            { v: "fashion", t: "👕 패션형" },
            { v: "experience", t: "🎫 경험형" },
          ],
        },
        {
          id: "persona",
          title: "상대 성향은?",
          options: [
            { v: "practical", t: "🧠 실용파" },
            { v: "sensitive", t: "💖 감성파" },
            { v: "picky", t: "😎 취향 확고" },
            { v: "unknown", t: "🤷‍♀️ 잘 모르겠음" },
          ],
        },
      ];

      const penalty = {
        // 결과 확률 범위: 82~100%를 유지하기 위해 패널티 총합을 최대 18로 설계
        relationship: { lover: 4, fling: 7, spouse: 2, work: 1 },
        gift: { practical: 1, emotional: 2, fashion: 5, experience: 0 },
        persona: { practical: 0, sensitive: 0, picky: 3, unknown: 6 },
      };

      const tips_base = [
        { ko: "🎫 경험형 선물은 기억에 오래 남아요", en: "🎫 Experience gifts last longer in memory" },
        { ko: "📝 짧은 카드 한 줄이 체감을 바꿔요", en: "📝 A short card line changes the feeling" },
        { ko: "🎁 같이 고르자고 말해도 충분히 좋아요", en: "🎁 Saying 'let's choose together' is good enough" },
        { ko: "🍰 작은 디저트 하나 추가해보세요", en: "🍰 Add a small dessert" },
      ];

      function getTips() {
        const lang = window.currentLang || "ko";
        return tips_base.map((tip) => (lang === "ko" ? tip.ko : tip.en));
      }

      function getQuestions() {
        const lang = window.currentLang || "ko";
        const isKo = lang === "ko";
        return questions_base.map((q) => ({
          id: q.id,
          title: isKo ? q.title : t(`question${q.id.charAt(0).toUpperCase() + q.id.slice(1)}`),
          options: q.options.map((o) => {
            let key = `option${o.v.charAt(0).toUpperCase() + o.v.slice(1)}`;
            // persona의 practical은 optionPracticalPersona를 사용
            if (q.id === "persona" && o.v === "practical") {
              key = "optionPracticalPersona";
            }
            return {
              v: o.v,
              t: isKo ? o.t : t(key),
            };
          }),
        }));
      }

      /* ---------------- logic ---------------- */

      let step = 0;
      let answer = {};
      const box = document.getElementById("questionBox");

      function renderQuestion() {
        const questions = getQuestions();
        const q = questions[step];
        box.innerHTML = `
    <h2 class="text-lg font-semibold text-center text-[var(--text-0)] mb-4">${
      q.title
    }</h2>
    <div class="grid grid-cols-1 gap-3">
      ${q.options
        .map(
          (o) =>
            `<div class="option" onclick="select('${q.id}','${o.v}')">${o.t}</div>`
        )
        .join("")}
    </div>
  `;
      }

      function select(id, val) {
        answer[id] = val;
        step++;
        const questions = getQuestions();
        if (step < questions.length) renderQuestion();
        else showResult();
      }

      function showResult() {
        const t = window.t || ((key, vars = {}) => key);
        const lang = window.currentLang || "ko";
        box.classList.add("hidden");
        document.getElementById("resultBox").classList.remove("hidden");

        let score = 100;
        score -= penalty.relationship[answer.relationship] || 0;
        score -= penalty.gift[answer.gift] || 0;
        score -= penalty.persona[answer.persona] || 0;
        score = Math.max(82, Math.min(100, score));

        document.getElementById("rate").textContent = score + "%";

        const temp =
          score >= 96
            ? t("temperatureCozy")
            : score >= 90
            ? t("temperatureWarm")
            : t("temperaturePerfect");

        document.getElementById("temperature").textContent = temp;

        const comment = t("commentDefault");
        document.getElementById("comment").innerHTML = comment;

        const tips = getTips();
        document.getElementById("tips").innerHTML = tips
          .sort(() => 0.5 - Math.random())
          .slice(0, 3)
          .map((tip) => `<li>${tip}</li>`)
          .join("");
      }

      renderQuestion();
    </script>
