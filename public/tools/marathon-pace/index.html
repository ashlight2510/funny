<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">🏃</div><div><h1>마라톤 목표 페이스</h1><p class="sub">목표 시간·거리 → km당 pace</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>목표 완주 시간 (예: 4:00 또는 240분)</label><input type="text" id="time" value="4:00" placeholder="4:00 또는 240" /></div>
      <div class="field"><label>거리 (km)</label><input type="number" id="dist" value="42.195" step="0.001" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>km당 페이스</span><span class="v" id="pace"></span></div>
        <div class="result-item"><span>시속 (km/h)</span><span class="v" id="speed"></span></div>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/marathon-pace-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/pace-calc/">페이스 계산</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  function parseTime(s){ var m=s.match(/^(\d+):(\d+)$/); if(m) return parseInt(m[1],10)*60+parseInt(m[2],10); return parseFloat(s)||0; }
  function toMinSec(m){ var min=Math.floor(m); var sec=Math.round((m-min)*60); return min+":"+(sec<10?"0":"")+sec; }
  var time=document.getElementById("time"), dist=document.getElementById("dist");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), paceEl=document.getElementById("pace"), speedEl=document.getElementById("speed");
  btn.addEventListener("click",function(){
    var mins=parseTime(time.value), d=parseFloat(dist.value)||42.195;
    if(d<=0||mins<=0){ res.classList.remove("show"); return; }
    var paceMin=mins/d; paceEl.textContent=toMinSec(paceMin)+" /km"; speedEl.textContent=(60/paceMin).toFixed(2)+" km/h"; res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
