      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      .btn:hover { filter: brightness(1.1); }

      .result.show { display: block; }
      .result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .result-item:last-child { border-bottom: none; }

.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      body:has(#tool-share-block) { flex-wrap: wrap; }
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; width: 100%; flex: 0 0 100%; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }

  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">💰</div>
          <div>
            <h1>대출 이자·상환 계산기</h1>
            <p class="sub">원리금 균등·원금 균등으로 월 상환액과 총 이자 계산</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>대출 조건</h3>
        <div class="field">
          <label>대출 원금 (원)</label>
          <input type="number" id="principal" min="1" step="100000" placeholder="예: 300000000" value="100000000" />
        </div>
        <div class="row">
          <div class="field">
            <label>연 이자율 (%)</label>
            <input type="number" id="rate" min="0" max="30" step="0.01" placeholder="예: 4.5" value="4.5" />
          </div>
          <div class="field">
            <label>대출 기간 (개월)</label>
            <input type="number" id="months" min="1" max="600" placeholder="예: 360" value="360" />
          </div>
        </div>
        <div class="field">
          <label>상환 방식</label>
          <select id="type">
            <option value="equal">원리금 균등 (매월 동일 상환액)</option>
            <option value="principal">원금 균등 (매월 원금 동일, 이자 감소)</option>
          </select>
        </div>
        <button type="button" class="btn" id="btnCalc">계산하기</button>
        <div class="result" id="result">
          <div class="result-item"><span>월 상환액</span><span class="v" id="monthlyPay"></span></div>
          <div class="result-item"><span>총 이자</span><span class="v" id="totalInterest"></span></div>
          <div class="result-item"><span>총 상환액</span><span class="v" id="totalPay"></span></div>
        </div>
        <p class="note">참고용입니다. 실제 대출 조건은 금융사에 확인하세요.</p>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/loancalc-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/tax/">세금 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>

    <script>
      (function(){
        function fmt(n) { return Math.round(n).toLocaleString() + "원"; }
        function PMT(r, n, pv) {
          if (r === 0) return pv / n;
          return pv * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        }
        var principal = document.getElementById("principal");
        var rate = document.getElementById("rate");
        var months = document.getElementById("months");
        var type = document.getElementById("type");
        var btnCalc = document.getElementById("btnCalc");
        var result = document.getElementById("result");
        var monthlyPayEl = document.getElementById("monthlyPay");
        var totalInterestEl = document.getElementById("totalInterest");
        var totalPayEl = document.getElementById("totalPay");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        btnCalc.addEventListener("click", function(){
          var p = parseFloat(principal.value) || 0;
          var annual = parseFloat(rate.value) || 0;
          var n = parseInt(months.value, 10) || 0;
          if (p <= 0 || n <= 0) { result.classList.remove("show"); return; }
          var r = annual / 100 / 12;
          var monthlyPay, totalInterest, totalPay;
          if (type.value === "equal") {
            monthlyPay = PMT(r, n, p);
            totalPay = monthlyPay * n;
            totalInterest = totalPay - p;
          } else {
            var principalPerMonth = p / n;
            totalInterest = 0;
            var balance = p;
            for (var i = 0; i < n; i++) {
              totalInterest += balance * r;
              balance -= principalPerMonth;
            }
            var firstPay = principalPerMonth + p * r;
            monthlyPayEl.textContent = "첫달 " + fmt(firstPay) + " → 감소";
            totalPay = p + totalInterest;
            totalPayEl.textContent = fmt(totalPay);
            totalInterestEl.textContent = fmt(totalInterest);
            result.classList.add("show");
            return;
          }
          monthlyPayEl.textContent = fmt(monthlyPay);
          totalInterestEl.textContent = fmt(totalInterest);
          totalPayEl.textContent = fmt(totalPay);
          result.classList.add("show");
        });

        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "loancalc" }); } catch(e){}
        });
      })();
    </script>
  </body>
