          vibeNoRate: "Even without compounding, it's big. Numbers speak.",

          detail:
            "Assuming you spent {monthly} per month for {months} months. {vibe}",
          copyTemplate:
            "🍺 How much is that drinking worth now? Results\n- Sessions per month: {sessions}\n- Spend per session: {spend}\n- Duration: {years} years ({months} months)\n- Total spent: {total}\n- Invested (assumed {rate}%/yr): {fv}\n{headline}",
          copySuccess: "Copied!",

          cardTitle: "🍺 How much is that drinking worth now?",

          cardBoxSaved: "Just saved it (0%)",
          cardBoxInvested: "If invested (annual {rate}%)",

      };

      const defaultLang = "ko";
      const supportedLangs = ["ko", "en"];
      let currentLang = defaultLang;

      function t(key, vars = {}) {
        const langTable = translations[currentLang] || translations.ko;
        const template = langTable[key] ?? translations.ko[key] ?? key;
        return template.replace(/\{(\w+)\}/g, (_, token) =>
          vars[token] !== undefined ? vars[token] : `{${token}}`
        );
      }

      const fmtKRW = (n) => {
        const x = Math.round(n);
        const base = x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        return currentLang === "en" ? `${base} KRW` : `${base}원`;
      };

      const clampNonNeg = (v) => (isFinite(v) ? Math.max(0, v) : 0);

      function applyTranslations() {
        document.title = t("metaTitle");
        const desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute("content", t("metaDescription"));
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute("content", t("metaOgTitle"));
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute("content", t("metaOgDescription"));
        const ogAlt = document.querySelector('meta[property="og:image:alt"]');
        if (ogAlt) ogAlt.setAttribute("content", t("metaOgImageAlt"));

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          el.innerHTML = t(el.dataset.i18nHtml);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          el.setAttribute("placeholder", t(el.dataset.i18nPlaceholder));
        });

        const footer = $("footerText");
        if (footer) {
          footer.innerHTML = t("footer", {
            year: new Date().getFullYear(),
          });
        }
      }

      function setLang(lang, options = {}) {
        const nextLang = translations[lang] ? lang : defaultLang;
        currentLang = nextLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === nextLang);
        });
        applyTranslations();
        calc();

        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
      }

      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const paramLang = params.get("lang");
        if (supportedLangs.includes(paramLang)) return paramLang;
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) return stored;
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }

      // 매달 일정 금액을 납입한다고 가정한 미래가치(FV)
      // r = monthlyRate, n = months, pmt = monthlyPayment
      // FV = pmt * (( (1+r)^n - 1 ) / r)  (r=0이면 pmt*n)
      function futureValueOfAnnuity(pmt, monthlyRate, months) {
        if (months <= 0) return 0;
        if (monthlyRate <= 0) return pmt * months;
        return pmt * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
      }

      function calc() {
        const sessionsPerMonth = clampNonNeg(
          parseFloat($("sessionsPerMonth").value)
        );
        const spendPerSession = clampNonNeg(
          parseFloat($("spendPerSession").value)
        );
        const years = clampNonNeg(parseFloat($("years").value));
        const annualRatePct = clampNonNeg(parseFloat($("annualRate").value));

        const months = Math.round(years * 12);
        const monthlySpend = sessionsPerMonth * spendPerSession;
        const totalSpent = monthlySpend * months;

        const annualRate = annualRatePct / 100;
        const monthlyRate = Math.pow(1 + annualRate, 1 / 12) - 1;

        const savedValue = totalSpent; // 0%면 그냥 쌓인 원금
        const fv = futureValueOfAnnuity(monthlySpend, monthlyRate, months);

        $("totalSpent").textContent = fmtKRW(totalSpent);
        $("savedValue").textContent = fmtKRW(savedValue);
        $("futureValue").textContent = fmtKRW(fv);

        $("spentSub").textContent =
          months > 0
            ? t("spentSub", { amount: fmtKRW(monthlySpend), months })
            : "";
        $("fvSub").textContent =
          months > 0 ? t("fvSub", { rate: annualRatePct }) : "";

        const diff = fv - totalSpent;
        const diffText = diff >= 0 ? `(+${fmtKRW(diff)})` : `(${fmtKRW(diff)})`;

        // 멘트 생성
        const ratio = totalSpent > 0 ? fv / totalSpent : 0;
        let vibe;
        if (months === 0 || monthlySpend === 0) {
          vibe = t("vibeNoSpend");
        } else if (annualRatePct === 0) {
          vibe = t("vibeNoRate");
        } else if (ratio >= 1.35) {
          vibe = t("vibeHigh");
        } else if (ratio >= 1.15) {
          vibe = t("vibeMid");
        } else {
          vibe = t("vibeLow");
        }

        const headline =
          months === 0
            ? t("headlineEmpty")
            : t("headline", {
                total: fmtKRW(totalSpent),
                fv: fmtKRW(fv),
                diff: diffText,
              });

        const detail =
          months === 0
            ? ""
            : t("detail", {
                monthly: fmtKRW(monthlySpend),
                months,
                vibe,
              });

        $("headline").textContent = headline;
        $("detail").textContent = detail;

        // 복사용 문구
        const copyText = t("copyTemplate", {
          sessions: sessionsPerMonth,
          spend: fmtKRW(spendPerSession),
          years,
          months,
          total: fmtKRW(totalSpent),
          rate: annualRatePct,
          fv: fmtKRW(fv),
          headline,
        });

        return {
          sessionsPerMonth,
          spendPerSession,
          years,
          months,
          annualRatePct,
          monthlySpend,
          totalSpent,
          fv,
          headline,
          detail,
          copyText,
        };
      }

      function randomExample() {
        const ex = [
          { s: 4, p: 35000, y: 2, r: 5 },
          { s: 8, p: 55000, y: 3, r: 7 },
          { s: 12, p: 65000, y: 5, r: 6 },
          { s: 2, p: 90000, y: 1.5, r: 4 },
        ][Math.floor(Math.random() * 4)];

        $("sessionsPerMonth").value = ex.s;
        $("spendPerSession").value = ex.p;
        $("years").value = ex.y;
        $("annualRate").value = ex.r;
        calc();
      }

      async function copyResult() {
        const result = calc();
        try {
          await navigator.clipboard.writeText(result.copyText);
          const baseLabel = t("copyBtn");
          $("copyBtn").textContent = t("copySuccess");
          setTimeout(() => ($("copyBtn").textContent = baseLabel), 900);
        } catch (e) {
          alert(t("copyFail"));
        }
      }

      function drawCardPNG(result) {
        const canvas = $("cardCanvas");
        const w = 1080,
          h = 1350;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        // 배경 그라데이션
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "#0f172a");
        g.addColorStop(1, "#020617");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        // 카드 영역
        const pad = 70;
        const cardX = pad,
          cardY = pad,
          cardW = w - pad * 2,
          cardH = h - pad * 2;
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        roundRect(ctx, cardX, cardY, cardW, cardH, 42, true, false);

        // 텍스트
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 54px system-ui, -apple-system, Segoe UI, sans-serif";
        ctx.fillText(t("cardTitle"), cardX + 55, cardY + 110);

        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.font = "28px system-ui, -apple-system, Segoe UI, sans-serif";
        wrapText(
          ctx,
          result.headline,
          cardX + 55,
          cardY + 175,
          cardW - 110,
          42
        );

        // 수치 박스 3개
        const boxTop = cardY + 320;
        const gap = 26;
        const boxW = (cardW - gap * 2 - 110) / 3;
        const boxH = 190;
        const startX = cardX + 55;

        const boxes = [
          { t: t("cardBoxTotal"), v: fmtKRW(result.totalSpent) },
          { t: t("cardBoxSaved"), v: fmtKRW(result.totalSpent) },
          {
            t: t("cardBoxInvested", { rate: result.annualRatePct }),
            v: fmtKRW(result.fv),
          },
        ];

        boxes.forEach((b, i) => {
          const x = startX + i * (boxW + gap);
          ctx.fillStyle = "rgba(255,255,255,0.10)";
          roundRect(ctx, x, boxTop, boxW, boxH, 28, true, false);

          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.font = "22px system-ui, -apple-system, Segoe UI, sans-serif";
          ctx.fillText(b.t, x + 26, boxTop + 50);

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 34px system-ui, -apple-system, Segoe UI, sans-serif";
          ctx.fillText(b.v, x + 26, boxTop + 105);
        });

        // 상세
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.font = "26px system-ui, -apple-system, Segoe UI, sans-serif";
        wrapText(
          ctx,
          t("cardDetail", {
            monthly: fmtKRW(result.monthlySpend),
            months: result.months,
          }),
          cardX + 55,
          boxTop + boxH + 80,
          cardW - 110,
          40
        );

        ctx.fillStyle = "rgba(255,255,255,0.72)";
        ctx.font = "24px system-ui, -apple-system, Segoe UI, sans-serif";
        wrapText(
          ctx,
          result.detail,
          cardX + 55,
          boxTop + boxH + 150,
          cardW - 110,
          38
        );

        // 하단 워터마크
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.font = "22px system-ui, -apple-system, Segoe UI, sans-serif";
        ctx.fillText("funnyfunny.cloud", cardX + 55, cardY + cardH - 55);

        // 다운로드
        const url = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = url;
        a.download = "alcohol-spend-card.png";
        a.click();
      }

      function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        const r =
          typeof radius === "number"
            ? { tl: radius, tr: radius, br: radius, bl: radius }
            : radius;
        ctx.beginPath();
        ctx.moveTo(x + r.tl, y);
        ctx.lineTo(x + width - r.tr, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r.tr);
        ctx.lineTo(x + width, y + height - r.br);
        ctx.quadraticCurveTo(
          x + width,
          y + height,
          x + width - r.br,
          y + height
        );
        ctx.lineTo(x + r.bl, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r.bl);
        ctx.lineTo(x, y + r.tl);
        ctx.quadraticCurveTo(x, y, x + r.tl, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = String(text).split(" ");
        let line = "";
        let yy = y;
        for (let i = 0; i < words.length; i++) {
          const test = line + words[i] + " ";
          const w = ctx.measureText(test).width;
          if (w > maxWidth && i > 0) {
            ctx.fillText(line.trim(), x, yy);
            line = words[i] + " ";
            yy += lineHeight;
          } else {
            line = test;
          }
        }
        if (line.trim()) ctx.fillText(line.trim(), x, yy);
      }

      // events
      $("calcBtn").addEventListener("click", () => calc());
      $("randomBtn").addEventListener("click", () => randomExample());
      $("copyBtn").addEventListener("click", () => copyResult());
      $("downloadCardBtn").addEventListener("click", () => {
        const result = calc();
        drawCardPNG(result);
      });

      // init
      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          setLang(button.dataset.lang, { updateUrl: true });
        });
      });
      setLang(detectLang(), { updateUrl: false });
    </script>
