      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }

      textarea { width: 100%; min-height: 180px; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 15px; line-height: 1.6; resize: vertical; }
      textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(129,140,248,0.2); }

      .opts label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
      .opts input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
      .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
      .stat { background: #0b1220; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
      .stat .n { font-size: 24px; font-weight: 800; color: var(--accent); display: block; }
      .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .goal-wrap { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
      .goal-wrap input { width: 80px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; text-align: center; }
      .goal-bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 8px; }
      .goal-bar-inner { height: 100%; background: linear-gradient(90deg, #059669, #10b981); border-radius: 999px; transition: width 0.2s; }
      .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      .footer-links a:hover { text-decoration: underline; }
      body:has(#tool-share-block) { flex-wrap: wrap; }
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; width: 100%; flex: 0 0 100%; }

#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }
      .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; }

  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">📝</div>
          <div>
            <h1>글자 수 세기</h1>
            <p class="sub">자기소개서·논문·과제용 글자 수, 단어 수, 바이트 실시간 집계</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>텍스트 입력</h3>
        <div class="opts">
          <label><input type="checkbox" id="includeSpaces" checked /> 공백 포함</label>
        </div>
        <textarea id="textInput" placeholder="여기에 글을 입력하거나 붙여넣으세요. 실시간으로 글자 수·단어 수·바이트가 집계됩니다."></textarea>
      </div>

      <div class="panel">
        <h3>집계 결과</h3>
        <div class="stats">
          <div class="stat"><span class="n" id="numChars">0</span><span class="l">글자 수</span></div>
          <div class="stat"><span class="n" id="numWords">0</span><span class="l">단어 수</span></div>
          <div class="stat"><span class="n" id="numBytes">0</span><span class="l">바이트(UTF-8)</span></div>
          <div class="stat"><span class="n" id="numLines">0</span><span class="l">줄 수</span></div>
        </div>
        <div class="goal-wrap">
          <label>목표 글자 수 <input type="number" id="goalChars" min="0" placeholder="예: 500" value="" /> 자</label>
          <div class="goal-bar"><div class="goal-bar-inner" id="goalBar" style="width:0%"></div></div>
          <div id="goalText" style="font-size:12px;color:var(--muted);margin-top:4px;"></div>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/charcount-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn">링크 복사</button>
      <span id="tool-share-toast" style="display:none;"></span>
    </div>

    <script>
      (function(){
        var textInput = document.getElementById("textInput");
        var includeSpaces = document.getElementById("includeSpaces");
        var numChars = document.getElementById("numChars");
        var numWords = document.getElementById("numWords");
        var numBytes = document.getElementById("numBytes");
        var numLines = document.getElementById("numLines");
        var goalChars = document.getElementById("goalChars");
        var goalBar = document.getElementById("goalBar");
        var goalText = document.getElementById("goalText");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        function countWords(s) {
          var t = s.replace(/\s+/g, " ").trim();
          if (!t) return 0;
          return t.split(" ").length;
        }

        function update() {
          var raw = textInput.value || "";
          var withSpaces = raw.length;
          var withoutSpaces = raw.replace(/\s/g, "").length;
          var chars = includeSpaces.checked ? withSpaces : withoutSpaces;
          var words = countWords(raw);
          var bytes = new TextEncoder().encode(raw).length;
          var lines = raw ? (raw.split(/\r?\n/).length) : 0;

          numChars.textContent = chars.toLocaleString();
          numWords.textContent = words.toLocaleString();
          numBytes.textContent = bytes.toLocaleString();
          numLines.textContent = lines.toLocaleString();

          var goal = parseInt(goalChars.value, 10);
          if (goal > 0) {
            var pct = Math.min(100, Math.round((chars / goal) * 100));
            goalBar.style.width = pct + "%";
            goalText.textContent = chars + " / " + goal + "자 (" + pct + "%)";
          } else {
            goalBar.style.width = "0%";
            goalText.textContent = "";
          }
        }

        textInput.addEventListener("input", update);
        textInput.addEventListener("paste", function(){ setTimeout(update, 0); });
        includeSpaces.addEventListener("change", update);
        goalChars.addEventListener("input", update);

        btnShare.addEventListener("click", function(){
          var u = location.href;
          if (navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "charcount" }); } catch(e){}
        });

        update();
      })();
    </script>
  </body>
