    <script>
      // 라이브러리 로딩 체크
      function checkLibraries() {
        const required = {
          pako: typeof pako !== "undefined",
          JSZip: typeof JSZip !== "undefined",
          html2canvas: typeof html2canvas !== "undefined",
          jspdf: typeof jspdf !== "undefined",
          saveAs: typeof saveAs !== "undefined",
        };

        const missing = Object.entries(required)
          .filter(([name, loaded]) => !loaded)
          .map(([name]) => name);

        if (missing.length > 0) {
          console.warn("일부 라이브러리가 로드되지 않았습니다:", missing);
          showStatus(t("status.libraryLimited"), true);
        }

        return missing.length === 0;

        const lang = params.get("lang");
        return lang === "en" || lang === "ko" ? lang : "";
      }

      function t(key, vars = {}) {
        const dict = i18n[currentLang] || i18n.ko;
        const parts = key.split(".");
        let value = dict;
        for (const part of parts) {
          value = value && value[part];
        }
        if (typeof value === "function") {
          return value(vars);
        }
        if (typeof value !== "string") {
          return key;
        }
        return value.replace(/\{(\w+)\}/g, (match, token) => {
          return Object.prototype.hasOwnProperty.call(vars, token)
            ? vars[token]
            : "";
        });
      }

      function applyTranslations() {
        document.title = t("documentTitle");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = t(key);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          const key = el.getAttribute("data-i18n-html");
          el.innerHTML = t(key);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          el.setAttribute("placeholder", t(key));
        });
      }

      function updateLangButtons() {
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          const isActive = btn.dataset.lang === currentLang;
          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      function setLanguage(lang, persist) {
        if (!i18n[lang]) return;
        currentLang = lang;
        document.documentElement.lang = lang;
        if (persist) {
          localStorage.setItem("lang", lang);
        }
        applyTranslations();
        updateLangButtons();
        renderUploadArea();
      }

      function renderUploadArea() {
        const uploadArea = document.getElementById("uploadArea");
        if (!uploadArea) return;
        uploadArea.innerHTML = `
        <div class="icon">📄</div>
        <div class="text" data-i18n="uploadLine1"></div>
        <div class="text" data-i18n="uploadLine2"></div>
        <div class="hint" data-i18n-html="uploadHint"></div>
        <input type="file" id="fileInput" accept=".hwpx">
      `;
        applyTranslations();
        bindFileInput();
      }

      function bindFileInput() {
        const fileInput = document.getElementById("fileInput");
        if (!fileInput) return;
        fileInput.addEventListener("change", (e) => {
          if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
          }
        });
      }

      // 전역 상태
      const state = {
        originalFileName: "",
        blocks: [],
        edited: false,
      };

      let blockIdCounter = 0;

      function nextBlockId() {
        const id = blockIdCounter;
        blockIdCounter += 1;
        return id;
      }

      // A4 페이지 크기 (mm)
      const A4_WIDTH_MM = 210;
      const A4_HEIGHT_MM = 297;
      const A4_PADDING_MM = 20;
      const CONTENT_WIDTH_MM = A4_WIDTH_MM - A4_PADDING_MM * 2;
      const CONTENT_HEIGHT_MM = A4_HEIGHT_MM - A4_PADDING_MM * 2;

      // mm를 px로 변환 (96 DPI 기준)
      function mmToPx(mm) {
        return (mm / 25.4) * 96;
      }

      // ==================== HWP 파서 ====================
      async function parseHwpOrHwpx(file) {
        const buf = await file.arrayBuffer();
        const u8 = new Uint8Array(buf);

        // ZIP 시그니처 확인 (HWPX)
        const isZip = u8.length >= 4 && u8[0] === 0x50 && u8[1] === 0x4b;

        if (isZip) {
          const hwpx = await tryParseHwpX(u8);
          if (hwpx && hwpx.blocks.length) return hwpx;
        }

        // HWP (OLE) 시도
        const hwp = await tryParseHwpOle(u8);
        if (hwp && hwp.blocks.length) return hwp;

        // Fallback: 바이너리에서 가시문자만 추출
        const fallbackText = sanitizeExtractedText(extractPrintableText(u8));
        return {
          type: "fallback",
          blocks: normalizeToBlocks(fallbackText),
        };
      }

      // HWPX (ZIP + XML) 파싱
      async function tryParseHwpX(u8) {
        try {
          const zip = await JSZip.loadAsync(u8);
          const sectionFiles = Object.keys(zip.files)
            .filter((n) => /Contents\/section\d+\.xml$/i.test(n))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

          const xmlFiles = sectionFiles.length
            ? sectionFiles
            : Object.keys(zip.files).filter((n) => /\.xml$/i.test(n));

          let blocks = [];
          for (const name of xmlFiles) {
            try {
              const xml = await zip.files[name].async("string");
              const xmlBlocks = extractBlocksFromXml(xml);
              if (xmlBlocks.length) {
                blocks = blocks.concat(xmlBlocks);
              }
            } catch (e) {
              console.warn(`XML 파일 읽기 실패: ${name}`, e);
            }
          }

          if (!blocks.length) {
            let allText = "";
            for (const name of xmlFiles) {
              try {
                const xml = await zip.files[name].async("string");
                allText += "\n" + extractTextFromXml(xml);
              } catch {
                // ignore
              }
            }
            blocks = normalizeToBlocks(allText);
          }

          return { type: "hwpx", blocks };
        } catch (e) {
          console.warn("HWPX 파싱 실패:", e);
          return null;
        }
      }

      function extractTextFromXml(xml) {
        // HWPX XML에서 텍스트 추출 (더 정교하게)
        let text = xml;

        // CDATA 섹션 보존
        text = text.replace(/<!\[CDATA\[(.*?)\]\]>/gs, "$1");

        // 텍스트 노드 추출 (다양한 태그 패턴 지원)
        text = text
          .replace(/<[^>]+>/g, "\n") // 태그를 줄바꿈으로
          .replace(/&nbsp;|&#160;|&#xA0;/g, " ")
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;|&#34;/g, '"')
          .replace(/&apos;|&#39;|&#x27;/g, "'")
          .replace(/&#(\d+);/g, (match, dec) =>
            String.fromCharCode(parseInt(dec, 10)),
          )
          .replace(/&#x([0-9A-Fa-f]+);/g, (match, hex) =>
            String.fromCharCode(parseInt(hex, 16)),
          );

        return text;
      }

      function extractBlocksFromXml(xml) {
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(xml, "application/xml");
          if (doc.getElementsByTagName("parsererror").length) {
            return [];
          }

          const blocks = [];
          const root = doc.documentElement;

          function isWithinTable(node) {
            let cur = node.parentNode;
            while (cur && cur.nodeType === 1) {
              if (cur.localName === "tbl") return true;
              cur = cur.parentNode;
            }
            return false;
          }

          function extractTextFromNode(node) {
            let out = "";
            const walker = (node.ownerDocument || document).createTreeWalker(
              node,
              NodeFilter.SHOW_TEXT,
              null,
            );
            while (walker.nextNode()) {
              out += walker.currentNode.nodeValue;
            }
            return out;
          }

          function parseTable(tblNode) {
            const rows = [];
            const rowNodes = Array.from(
              tblNode.getElementsByTagName("*"),
            ).filter((n) => n.localName === "tr");

            rowNodes.forEach((rowNode) => {
              const cellNodes = Array.from(
                rowNode.getElementsByTagName("*"),
              ).filter((n) => n.localName === "tc");
              if (!cellNodes.length) return;

              const row = cellNodes.map((cellNode) => {
                const rawText = extractTextFromNode(cellNode);
                const cleaned = cleanupControlChars(rawText)
                  .replace(/[ \t]{2,}/g, " ")
                  .trim();
                const colSpanAttr =
                  cellNode.getAttribute("colSpan") ||
                  cellNode.getAttribute("colspan");
                const rowSpanAttr =
                  cellNode.getAttribute("rowSpan") ||
                  cellNode.getAttribute("rowspan");
                const colSpan = colSpanAttr ? parseInt(colSpanAttr, 10) : 1;
                const rowSpan = rowSpanAttr ? parseInt(rowSpanAttr, 10) : 1;
                return {
                  text: cleaned,
                  colSpan:
                    Number.isFinite(colSpan) && colSpan > 1 ? colSpan : 1,
                  rowSpan:
                    Number.isFinite(rowSpan) && rowSpan > 1 ? rowSpan : 1,
                };
              });

              if (row.length) rows.push(row);
            });

            if (!rows.length) return null;

            return {
              id: nextBlockId(),
              type: "table",
              rows,
            };
          }

          function walk(node) {
            if (!node || node.nodeType !== 1) return;
            const local = node.localName;

            if (local === "tbl") {
              const tableBlock = parseTable(node);
              if (tableBlock) blocks.push(tableBlock);
              return;
            }

            if (local === "p" && !isWithinTable(node)) {
              const rawText = extractTextFromNode(node);
              const cleaned = cleanupControlChars(rawText)
                .replace(/[ \t]{2,}/g, " ")
                .trim();
              if (cleaned) {
                blocks.push({
                  id: nextBlockId(),
                  type: "text",
                  text: cleaned,
                });
              }
              return;
            }

            Array.from(node.children || []).forEach((child) => walk(child));
          }

          walk(root);
          return blocks;
        } catch (e) {
          console.warn("XML 파싱 실패:", e);
          return [];
        }
      }

      // HWP (OLE) 파싱
      async function tryParseHwpOle(u8) {
        try {
          // CFB 라이브러리 사용 시도
          if (typeof CFB !== "undefined") {
            const cfb = CFB.read(u8.buffer, { type: "buffer" });
            const paths = (cfb.FullPaths || []).filter(Boolean);

            console.log("CFB 경로들:", paths);

            // BodyText/Section 스트림 찾기 (우선순위)
            // 경로는 "/" 또는 "\"로 구분될 수 있음
            const sectionPaths = paths
              .filter((p) => {
                const normalized = p.replace(/\\/g, "/");
                return (
                  /BodyText\/Section\d+/i.test(normalized) ||
                  /BodyText\/Section\d+/i.test(p)
                );
              })
              .sort((a, b) => {
                const numA = parseInt((a.match(/\d+/) || ["0"])[0]);
                const numB = parseInt((b.match(/\d+/) || ["0"])[0]);
                return numA - numB;
              });

            let text = "";

            if (sectionPaths.length > 0) {
              console.log("BodyText 섹션 찾음:", sectionPaths);
              for (const p of sectionPaths) {
                try {
                  // 경로 정규화 (백슬래시를 슬래시로)
                  const normalizedPath = p.replace(/\\/g, "/");
                  let entry = CFB.find(cfb, normalizedPath);

                  // 정규화된 경로로 못 찾으면 원본 경로로 시도
                  if (!entry) {
                    entry = CFB.find(cfb, p);
                  }

                  if (entry && entry.content) {
                    const streamU8 =
                      entry.content instanceof Uint8Array
                        ? entry.content
                        : new Uint8Array(entry.content);

                    console.log(`섹션 ${p} 크기:`, streamU8.length);

                    const extracted = extractTextFromHwpStream(streamU8);
                    if (
                      extracted &&
                      hasKoreanText(extracted) &&
                      extracted.length > 20
                    ) {
                      console.log(
                        `섹션 ${p}에서 텍스트 추출 성공:`,
                        extracted.substring(0, 100),
                      );
                      text += "\n" + extracted;
                    }
                  } else {
                    console.warn(`섹션 ${p} 엔트리를 찾을 수 없음`);
                  }
                } catch (e) {
                  console.warn(`섹션 ${p} 처리 실패:`, e);
                }
              }
            } else {
              console.log(
                "BodyText 섹션을 찾지 못함. 사용 가능한 경로:",
                paths,
              );
            }

            // BodyText 섹션에서 텍스트를 못 찾으면 다른 스트림 시도
            if (!text || text.replace(/\s/g, "").length < 20) {
              // BinData, PrvText 등 다른 텍스트 스트림 시도
              const textStreamPaths = paths.filter(
                (p) =>
                  /(BinData|PrvText|Scripts)/i.test(p) && !/BodyText/i.test(p),
              );

              for (const p of textStreamPaths) {
                try {
                  const entry = CFB.find(cfb, p);
                  if (entry && entry.content) {
                    const streamU8 =
                      entry.content instanceof Uint8Array
                        ? entry.content
                        : new Uint8Array(entry.content);

                    const extracted = extractTextFromHwpStream(streamU8);
                    if (
                      extracted &&
                      hasKoreanText(extracted) &&
                      extracted.length > 50
                    ) {
                      text += "\n" + extracted;
                      break; // 하나만 찾으면 충분
                    }
                  }
                } catch (e) {
                  // 무시
                }
              }
            }

            if (text && text.replace(/\s/g, "").length > 20) {
              const blocks = normalizeToBlocks(text);
              return { type: "hwp", blocks };
            }
          }

          // CFB가 없거나 실패하면 직접 바이너리에서 텍스트 패턴 찾기
          const text = extractTextFromHwpBinary(u8);
          if (text && text.replace(/\s/g, "").length > 20) {
            const blocks = normalizeToBlocks(text);
            return { type: "hwp", blocks };
          }
          return null;
        } catch (e) {
          console.warn("HWP 파싱 실패:", e);
          return null;
        }
      }

      // HWP 스트림에서 텍스트 추출 (HWP 특화)
      function extractTextFromHwpStream(u8) {
        if (!u8 || u8.length < 4) return "";

        // HWP 스트림은 보통 헤더 + 압축된 데이터 구조
        // 먼저 압축 해제 시도
        let raw = u8;

        // zlib 압축 체크 및 해제
        if (u8.length > 2 && u8[0] === 0x78) {
          try {
            if (typeof pako !== "undefined") {
              raw = pako.inflate(u8);
            }
          } catch (e) {
            // 압축이 아니거나 실패하면 원본 사용
            raw = u8;
          }
        }

        const candidates = [
          tryDecodeUtf16le(raw),
          tryDecodeUtf16leWithDecoder(raw),
          tryDecodeCp949(raw),
          tryDecodeEucKr(raw),
          tryDecodeUtf8(raw),
        ];

        const best = pickBestDecodedText(candidates);
        if (best && best.length > 20 && hasKoreanText(best)) {
          return best;
        }

        return "";
      }

      // HWP 바이너리에서 직접 텍스트 패턴 찾기
      function extractTextFromHwpBinary(u8) {
        // HWP 파일에서 UTF-16LE 텍스트 패턴 찾기
        // 한글 유니코드 범위: AC00-D7AF
        let text = "";
        let inTextBlock = false;
        let textBuffer = [];

        for (let i = 0; i < u8.length - 1; i += 2) {
          const code = (u8[i + 1] << 8) | u8[i]; // Little Endian

          // 한글 또는 일반 텍스트 범위
          if (
            (code >= 0xac00 && code <= 0xd7af) || // 한글 완성형
            (code >= 0x1100 && code <= 0x11ff) || // 한글 자모
            (code >= 0x3130 && code <= 0x318f) || // 한글 호환 자모
            (code >= 32 && code <= 126) || // ASCII
            (code >= 0x0020 && code <= 0x007e) || // 기본 라틴
            code === 0x000a ||
            code === 0x000d
          ) {
            // 줄바꿈

            if (code === 0x000a || code === 0x000d) {
              if (textBuffer.length > 0) {
                text += String.fromCharCode(...textBuffer) + "\n";
                textBuffer = [];
              }
            } else if (code !== 0x0000) {
              textBuffer.push(code);
            }
          } else {
            // 텍스트 블록이 끝나면 버퍼 비우기
            if (textBuffer.length > 10) {
              text += String.fromCharCode(...textBuffer) + " ";
              textBuffer = [];
            } else {
              textBuffer = [];
            }
          }
        }

        // 마지막 버퍼 처리
        if (textBuffer.length > 0) {
          text += String.fromCharCode(...textBuffer);
        }

        return sanitizeExtractedText(text);
      }

      // HWP 텍스트 정리 (깨짐 문자를 최대한 제거)
      function sanitizeExtractedText(text) {
        if (!text) return "";
        const normalized = text
          .replace(/\r\n/g, "\n")
          .replace(/\r/g, "\n")
          .replace(
            /Root Entry|FileHeader|HwpSummaryInformation|DocInfo|BinData/gi,
            "",
          );

        // 허용 문자 외는 줄바꿈으로 분리 (이상한 유니코드 군집 제거 목적)
        const disallowed =
          /[^\u0009\u000A\u000D\u0020-\u007E\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F\u4E00-\u9FFF\u3000-\u303F\uFF00-\uFFEF]/g;
        const replaced = normalized.replace(disallowed, "\n");

        const lines = replaced
          .split(/\n+/)
          .map((l) => l.replace(/[ \t]{2,}/g, " ").trim())
          .filter(Boolean);

        const koreanRe = /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/g;
        const asciiRe = /[A-Za-z0-9]/g;

        const filtered = lines.filter((line) => {
          if (line.length < 2) return false;
          const koreanCount = (line.match(koreanRe) || []).length;
          const asciiCount = (line.match(asciiRe) || []).length;
          const total = line.length;
          const angleBracketCount = (line.match(/[<>]/g) || []).length;
          const koreanRatio = koreanCount / total;
          const alphaNumRatio = (koreanCount + asciiCount) / total;

          // 긴 줄인데 한글/숫자가 거의 없으면 노이즈로 간주
          if (total >= 20 && koreanCount < 2 && asciiCount < 4) return false;
          if (total >= 40 && koreanCount === 0 && asciiCount / total < 0.15)
            return false;
          // 한글 비율이 낮고 길이가 긴 줄은 노이즈로 간주
          if (total >= 12 && koreanRatio < 0.08 && asciiCount < 6) return false;
          // 읽을 수 있는 문자 비율이 낮으면 제거
          if (total >= 20 && alphaNumRatio < 0.2) return false;
          // 각괄호가 과도한 라인 제거 (태그/바이너리 잔여)
          if (total >= 20 && angleBracketCount / total > 0.1) return false;
          return true;
        });

        return filtered.join("\n").trim();
      }

      function scoreReadableText(text) {
        if (!text) return 0;
        const koreanCount = (
          text.match(/[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/g) || []
        ).length;
        const asciiCount = (text.match(/[A-Za-z0-9]/g) || []).length;
        const total = text.length || 1;
        const ratio = (koreanCount + asciiCount) / total;
        return koreanCount * 3 + asciiCount + ratio * 50;
      }

      function pickBestDecodedText(candidates) {
        let best = "";
        let bestScore = 0;
        for (const raw of candidates) {
          if (!raw) continue;
          const cleaned = sanitizeExtractedText(raw);
          const score = scoreReadableText(cleaned);
          if (score > bestScore) {
            bestScore = score;
            best = cleaned;
          }
        }
        return best;
      }

      // 이 함수는 더 이상 사용하지 않음 (extractTextFromHwpStream으로 대체)
      function extractTextFromPossiblyCompressedStream(u8) {
        return extractTextFromHwpStream(u8);
      }

      function hasKoreanText(text) {
        // 한글 유니코드 범위: AC00-D7AF (완성형), 1100-11FF (자모)
        return /[\uAC00-\uD7AF\u1100-\u11FF]/.test(text);
      }

      function tryDecodeUtf16le(u8) {
        try {
          if (u8.length < 4) return "";
          const len = u8.length - (u8.length % 2);
          const view = new DataView(u8.buffer, u8.byteOffset, len);
          let out = "";
          let hasKorean = false;

          for (let i = 0; i < len; i += 2) {
            const code = view.getUint16(i, true);

            // NULL 문자는 스킵하되 중단하지 않음
            if (code === 0) {
              out += " ";
              continue;
            }

            // 서로게이트 페어 처리 (0xD800-0xDFFF)
            if (code >= 0xd800 && code <= 0xdbff && i + 2 < len) {
              const low = view.getUint16(i + 2, true);
              if (low >= 0xdc00 && low <= 0xdfff) {
                const surrogate =
                  (code - 0xd800) * 0x400 + (low - 0xdc00) + 0x10000;
                out += String.fromCodePoint(surrogate);
                i += 2;
                continue;
              }
            }

            // 일반 문자
            if (code >= 0xac00 && code <= 0xd7af) hasKorean = true;
            out += String.fromCharCode(code);
          }

          // 한글이 포함되어 있으면 반환
          return hasKorean ? out : "";
        } catch {
          return "";
        }
      }

      function tryDecodeUtf16leWithDecoder(u8) {
        try {
          // TextDecoder를 사용한 UTF-16LE 디코딩
          const decoder = new TextDecoder("utf-16le", {
            fatal: false,
            ignoreBOM: true,
          });
          return decoder.decode(u8);
        } catch {
          return "";
        }
      }

      function tryDecodeEucKr(u8) {
        try {
          // EUC-KR 디코딩 시도
          const decoder = new TextDecoder("euc-kr", { fatal: false });
          return decoder.decode(u8);
        } catch {
          return "";
        }
      }

      function tryDecodeCp949(u8) {
        try {
          // CP949 (Windows 한글 코드페이지) 디코딩 시도
          const decoder = new TextDecoder("x-windows-949", { fatal: false });
          return decoder.decode(u8);
        } catch {
          return "";
        }
      }

      function tryDecodeUtf8(u8) {
        try {
          return new TextDecoder("utf-8", { fatal: false }).decode(u8);
        } catch {
          return "";
        }
      }

      function extractPrintableText(u8) {
        let out = "";
        // 2바이트씩 읽어서 UTF-16LE로 해석 시도
        for (let i = 0; i < u8.length - 1; i += 2) {
          const code = (u8[i + 1] << 8) | u8[i]; // Little Endian
          if (code >= 32 && code !== 0 && code < 0xfffe) {
            // 제어 문자 제외
            if (code !== 0x0000 && code !== 0x000d && code !== 0x000a) {
              try {
                out += String.fromCharCode(code);
              } catch {
                out += " ";
              }
            } else if (code === 0x000a) {
              out += "\n";
            }
          }
        }
        return out;
      }

      function cleanupControlChars(s) {
        return s
          .replace(/\u0000/g, " ")
          .replace(/[\u0001-\u0008\u000B\u000C\u000E-\u001F]/g, " ")
          .replace(/[ \t]+\n/g, "\n")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function normalizeToParagraphs(text) {
        const cleaned = cleanupControlChars(text);
        const parts = cleaned
          .split(/\n\s*\n/g)
          .map((t) => t.trim())
          .filter(Boolean);

        if (parts.length === 0 && cleaned.length > 0) {
          // 문단이 없으면 전체를 하나의 문단으로
          return [{ id: 0, text: cleaned }];
        }

        return parts.map((t, i) => ({ id: i, text: t }));
      }

      function normalizeToBlocks(text) {
        const paragraphs = normalizeToParagraphs(text);
        return paragraphs.map((p) => ({
          id: nextBlockId(),
          type: "text",
          text: p.text,
        }));
      }

      // ==================== 페이지 렌더러 ====================
      function renderPages(container, blocks) {
        container.innerHTML = "";

        if (blocks.length === 0) {
          container.innerHTML = `<div class="loading">${t("noParagraphs")}</div>`;
          return;
        }

        let currentPage = createPage();
        container.appendChild(currentPage);

        const pageHeightPx = mmToPx(CONTENT_HEIGHT_MM);
        const contentWidthPx = mmToPx(CONTENT_WIDTH_MM);
        const marginBottomPx = mmToPx(6);

        blocks.forEach((block) => {
          let blockEl;
          if (block.type === "table") {
            const table = document.createElement("table");
            table.className = "doc-table";
            block.rows.forEach((row, rowIdx) => {
              const tr = document.createElement("tr");
              row.forEach((cell, colIdx) => {
                const td = document.createElement("td");
                td.textContent = cell.text || "";
                td.contentEditable = true;
                td.dataset.row = String(rowIdx);
                td.dataset.col = String(colIdx);
                if (cell.colSpan && cell.colSpan > 1) td.colSpan = cell.colSpan;
                if (cell.rowSpan && cell.rowSpan > 1) td.rowSpan = cell.rowSpan;
                td.addEventListener("input", () => {
                  const r = parseInt(td.dataset.row, 10);
                  const c = parseInt(td.dataset.col, 10);
                  if (block.rows[r] && block.rows[r][c]) {
                    block.rows[r][c].text = td.textContent;
                    state.edited = true;
                  }
                });
                tr.appendChild(td);
              });
              table.appendChild(tr);
            });
            blockEl = table;
          } else {
            const paraEl = document.createElement("p");
            paraEl.textContent = block.text;
            paraEl.dataset.paraId = block.id;
            paraEl.contentEditable = true;
            paraEl.style.marginBottom = `${marginBottomPx}px`;
            paraEl.style.width = `${contentWidthPx}px`;
            paraEl.style.wordWrap = "break-word";
            paraEl.style.whiteSpace = "pre-wrap";
            paraEl.style.lineHeight = "1.6";
            paraEl.style.fontSize = "12pt";

            paraEl.addEventListener("input", () => {
              block.text = paraEl.textContent;
              state.edited = true;
            });
            blockEl = paraEl;
          }

          if (blockEl) {
            if (blockEl.tagName === "TABLE") {
              blockEl.style.marginBottom = `${marginBottomPx}px`;
              blockEl.style.width = `${contentWidthPx}px`;
            }
            currentPage.appendChild(blockEl);
          }

          const currentPageContentHeight = Array.from(
            currentPage.children,
          ).reduce((sum, el) => sum + el.offsetHeight + marginBottomPx, 0);

          if (
            currentPageContentHeight > pageHeightPx &&
            currentPage.children.length > 1
          ) {
            currentPage.removeChild(blockEl);
            currentPage = createPage();
            container.appendChild(currentPage);
            currentPage.appendChild(blockEl);
          }
        });
      }

      function createPage() {
        const page = document.createElement("div");
        page.className = "page";
        page.style.width = `${A4_WIDTH_MM}mm`;
        page.style.minHeight = `${A4_HEIGHT_MM}mm`;
        page.style.padding = `${A4_PADDING_MM}mm`;
        return page;
      }

      // ==================== 문구 치환 ====================
      function replaceAll(from, to) {
        if (!from) return;

        let count = 0;
        state.blocks.forEach((block) => {
          if (block.type === "table") {
            block.rows.forEach((row) => {
              row.forEach((cell) => {
                const before = cell.text || "";
                const after = before.split(from).join(to);
                if (before !== after) {
                  cell.text = after;
                  count++;
                }
              });
            });
            return;
          }
          const before = block.text;
          block.text = block.text.split(from).join(to);
          if (before !== block.text) count++;
        });

        state.edited = true;
        renderPages(document.getElementById("previewPanel"), state.blocks);

        showStatus(t("status.replaceSummary", { from, to, count }), false);
        return count;
      }

      // ==================== PDF Export ====================
      async function exportPagesToPDF(fileName = "output.pdf") {
        const pages = Array.from(document.querySelectorAll(".page"));
        if (!pages.length) {
          showStatus(t("status.noPagesToExport"), true);
          return;
        }

        showStatus(t("status.pdfGenerating"), false);

        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            unit: "mm",
            format: "a4",
            orientation: "portrait",
          });

          for (let i = 0; i < pages.length; i++) {
            const pageEl = pages[i];

            const canvas = await html2canvas(pageEl, {
              scale: 2,
              useCORS: true,
              backgroundColor: "#ffffff",
              logging: false,
              width: mmToPx(A4_WIDTH_MM),
              height: mmToPx(A4_HEIGHT_MM),
            });

            const imgData = canvas.toDataURL("image/jpeg", 0.92);
            const pageWidth = A4_WIDTH_MM;
            const pageHeight = A4_HEIGHT_MM;

            if (i > 0) pdf.addPage();
            pdf.addImage(imgData, "JPEG", 0, 0, pageWidth, pageHeight);
          }

          pdf.save(fileName);
          showStatus(t("status.pdfDone"), false);
        } catch (error) {
          console.error("PDF 생성 오류:", error);
          showStatus(t("status.pdfError", { message: error.message }), true);
        }
      }

      // ==================== DOCX Export ====================
      async function exportToDocx(fileName = "output.docx") {
        if (!state.blocks.length) {
          showStatus(t("status.noPagesToExport"), true);
          return;
        }

        showStatus(t("status.docxGenerating"), false);

        try {
          // 간단한 DOCX 생성 (ZIP 기반)
          const zip = new JSZip();

          // [Content_Types].xml
          zip.file(
            "[Content_Types].xml",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`,
          );

          // _rels/.rels
          zip.folder("_rels").file(
            ".rels",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`,
          );

          // word/_rels/document.xml.rels
          zip
            .folder("word")
            .folder("_rels")
            .file(
              "document.xml.rels",
              `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`,
            );

          // word/document.xml
          const paragraphsXml = state.blocks
            .map((block) => {
              if (block.type === "table") {
                const rows = block.rows.map((row) =>
                  row.map((cell) => cell.text || "").join(" | "),
                );
                return rows
                  .map((line) => {
                    const escaped = line
                      .replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&apos;");
                    return `<w:p><w:r><w:t>${escaped}</w:t></w:r></w:p>`;
                  })
                  .join("");
              }
              const escaped = block.text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");
              return `<w:p><w:r><w:t>${escaped}</w:t></w:r></w:p>`;
            })
            .join("");

          zip.file(
            "word/document.xml",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`,
          );

          const blob = await zip.generateAsync({
            type: "blob",
            mimeType:
              "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          });
          saveAs(blob, fileName);
          showStatus(t("status.docxDone"), false);
        } catch (error) {
          console.error("DOCX 생성 오류:", error);
          // 실패하면 텍스트 파일로 대체
          const text = state.blocks
            .map((block) => {
              if (block.type === "table") {
                return block.rows
                  .map((row) => row.map((cell) => cell.text || "").join(" | "))
                  .join("\n");
              }
              return block.text;
            })
            .join("\n\n");
          const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
          saveAs(blob, fileName.replace(".docx", ".txt"));
          showStatus(t("status.docxFallback"), true);
        }
      }

      // ==================== UI 이벤트 ====================
      function showStatus(message, isError) {
        const statusEl = document.getElementById("status");
        statusEl.textContent = message;
        statusEl.className = "status show" + (isError ? " error" : "");
        setTimeout(() => {
          statusEl.className = "status";
        }, 5000);
      }

      // 파일 업로드
      const uploadArea = document.getElementById("uploadArea");

      renderUploadArea();

      uploadArea.addEventListener("click", () => {
        const fileInput = document.getElementById("fileInput");
        if (fileInput) fileInput.click();
      });

      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("dragover");
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          handleFile(files[0]);
        }
      });

      async function handleFile(file) {
        if (!file.name.match(/\.(hwp|hwpx)$/i)) {
          showStatus(t("status.onlyHwpx"), true);
          return;
        }

        if (file.name.match(/\.hwp$/i)) {
          showStatus(t("status.hwpUnsupported"), true);
          return;
        }

        state.originalFileName = file.name;
        state.edited = false;
        blockIdCounter = 0;

        uploadArea.innerHTML = `<div class="loading">${t("parsingFile")}</div>`;

        try {
          const result = await parseHwpOrHwpx(file);
          state.blocks = result.blocks;

          if (state.blocks.length === 0) {
            showStatus(t("status.extractFail"), true);
            renderUploadArea();
            return;
          }

          renderPages(document.getElementById("previewPanel"), state.blocks);
          document.getElementById("replaceBtn").disabled = false;
          document.getElementById("exportPdf").disabled = false;
          document.getElementById("exportDocx").disabled = false;

          showStatus(
            t("status.extractDone", {
              count: state.blocks.length,
              type: result.type || "unknown",
            }),
            false,
          );
        } catch (error) {
          console.error("파일 처리 오류:", error);
          showStatus(t("status.fileError", { message: error.message }), true);
          renderUploadArea();
        }
      }

      // 문구 치환
      document.getElementById("replaceBtn").addEventListener("click", () => {
        const find = document.getElementById("findText").value;
        const replace = document.getElementById("replaceText").value;
        if (find) {
          replaceAll(find, replace);
        }
      });

      // 프리셋
      document.querySelectorAll(".preset-item").forEach((item) => {
        item.addEventListener("click", () => {
          const preset = item.dataset.preset;
          const findInput = document.getElementById("findText");
          const replaceInput = document.getElementById("replaceText");

          switch (preset) {
            case "date":
              findInput.value = "YYYY-MM-DD";
              replaceInput.value = new Date().toISOString().split("T")[0];
              break;
            case "company":
              findInput.value = "";
              replaceInput.value = "";
              findInput.placeholder = t("placeholders.companyOld");
              replaceInput.placeholder = t("placeholders.companyNew");
              break;
            case "name":
              findInput.value = "";
              replaceInput.value = "";
              findInput.placeholder = t("placeholders.nameOld");
              replaceInput.placeholder = t("placeholders.nameNew");
              break;
          }
        });
      });

      // PDF Export
      document.getElementById("exportPdf").addEventListener("click", () => {
        if (
          typeof html2canvas === "undefined" ||
          typeof jspdf === "undefined"
        ) {
          showStatus(t("status.pdfLibMissing"), true);
          return;
        }
        const fileName = state.originalFileName
          ? state.originalFileName.replace(/\.(hwp|hwpx)$/i, ".pdf")
          : "output.pdf";
        exportPagesToPDF(fileName);
      });

      // DOCX Export
      document.getElementById("exportDocx").addEventListener("click", () => {
        if (typeof JSZip === "undefined" || typeof saveAs === "undefined") {
          showStatus(t("status.docxLibMissing"), true);
          return;
        }
        const fileName = state.originalFileName
          ? state.originalFileName.replace(/\.(hwp|hwpx)$/i, ".docx")
          : "output.docx";
        exportToDocx(fileName);
      });

      // 페이지 로드 시 라이브러리 체크
      window.addEventListener("load", () => {
        const storedLang = localStorage.getItem("lang");
        const urlLang = getLangFromUrl();
        const browserLang = (navigator.language || "")
          .toLowerCase()
          .startsWith("en")
          ? "en"
          : "ko";
        setLanguage(urlLang || storedLang || browserLang, false);
        updateLangButtons();
        setTimeout(checkLibraries, 1000); // 라이브러리 로딩 대기
      });

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          setLanguage(btn.dataset.lang, true);
        });
      });
    </script><div style="text-align:center;margin:16px 0;font-size:14px;"><a href="https://funnyfunny.cloud/guide/hwpx-text-extractor/">사용 가이드</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
