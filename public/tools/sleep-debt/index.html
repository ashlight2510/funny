<head>

  <meta name="description" content="실제 수면 시간과 권장 시간을 입력하면 수면 부채(부족 시간)를 계산합니다." />

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#7c3aed;--border:#334155;}
    *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px;}
    .brand{display:flex;align-items:center;gap:12px;} .brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6d28d9,#7c3aed);display:grid;place-items:center;font-size:22px;}
    h1{margin:0 0 6px;font-size:22px;font-weight:800;} .sub{margin:0;color:var(--muted);font-size:14px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
    .panel h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--muted);}
    .field{margin-bottom:14px;} .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);font-size:14px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;}
    .result{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);} .result.show{display:block;}
    .result-item{display:flex;justify-content:space-between;padding:8px 0;} .result-item .v{font-weight:700;color:var(--accent);}
    .note{font-size:12px;color:var(--muted);margin-top:12px;}
    .footer-links { max-width: 560px; margin: 16px auto; padding: 0 14px; text-align: center; font-size: 14px; }
.footer-links a { color: var(--accent, #818cf8); text-decoration: none; } .footer-links a{color:var(--accent);text-decoration:none;}
    .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
#tool-share-block { max-width: 560px; margin: 16px auto 24px; padding: 0 14px; text-align: center; font-size: 14px; }
#tool-share-block button, #tool-share-block .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 1px solid var(--border, #334155); background: var(--card, #1e293b); color: var(--text, #f1f5f9); font-weight: 500; }
#tool-share-block #tool-share-toast { display: none; margin-left: 10px; color: var(--muted, #94a3b8); font-size: 13px; }

  </style>
    <meta name="description" content="권장 7~8시간 대비 부족 시간." />
    <meta property="og:title" content="수면 부채" />
    <meta property="og:description" content="권장 7~8시간 대비 부족 시간." />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/sleep-debt/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="수면 부채" />
    <meta name="twitter:description" content="권장 7~8시간 대비 부족 시간." />
    <meta name="twitter:image" content="https://dummyimage.com/1200x630/0f172a/94a3b8&text=FunnyFunny+Cloud" />

  </head>
<body>
  <div class="wrap">
    <header><div class="brand"><div class="brand-badge">😴</div><div><h1>수면 부채</h1><p class="sub">권장 7~8시간 대비 부족 시간</p></div></div></header>
    <div class="panel">
      <h3>입력</h3>
      <div class="field"><label>실제 수면 시간 (시간)</label><input type="number" id="actual" min="0" max="24" step="0.5" value="6" /></div>
      <div class="field"><label>권장 수면 (시간, 보통 7~8)</label><input type="number" id="target" min="5" max="10" step="0.5" value="7.5" /></div>
      <button type="button" class="btn" id="btnCalc">계산하기</button>
      <div class="result" id="result">
        <div class="result-item"><span>수면 부채 (오늘 기준)</span><span class="v" id="debt"></span></div>
        <p class="note">권장 − 실제. 부족하면 음수로 표시됩니다. 참고용입니다.</p>
      </div>
    </div>
  </div>
  <div style="text-align:center;margin:16px 0;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  <div class="footer-links"><a href="https://funnyfunny.cloud/guide/sleep-debt-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/sleep/">수면 도우미</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a></div>
  <div id="tool-share-block"><button type="button" id="btnShare" class="btn btn-ghost">링크 복사</button><span id="tool-share-toast" style="display:none;"></span></div>
  <script>
(function(){
  var actual=document.getElementById("actual"), target=document.getElementById("target");
  var btn=document.getElementById("btnCalc"), res=document.getElementById("result"), debtEl=document.getElementById("debt");
  btn.addEventListener("click",function(){
    var a=parseFloat(actual.value)||0, t=parseFloat(target.value)||7.5;
    var debt=t-a; debtEl.textContent=debt>0 ? "-"+debt.toFixed(1)+"시간 부족" : (debt===0 ? "0 (충분)" : "+"+(-debt).toFixed(1)+"시간 여유"); res.classList.add("show");
  });
  document.getElementById("btnShare").addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ var t=document.getElementById("tool-share-toast"); t.textContent="복사했어요"; t.style.display="inline"; setTimeout(function(){ t.style.display="none"; },1500); }); });
})();
  </script>
</body>
</html>
