<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="날짜 차이·며칠째·D-day 계산 | FunnyFunny Cloud" />
    <meta property="og:description" content="날짜 차이, 며칠째, D-day를 한 번에 계산. 무료 날짜 계산기." />
    <meta property="og:url" content="https://funnyfunny.cloud/tools/datecalc/" />
    <meta property="og:image" content="https://dummyimage.com/1200x630/0b1220/ffffff&text=Date+Calculator" />
    <link rel="canonical" href="https://funnyfunny.cloud/tools/datecalc/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230b1220'/><rect x='12' y='14' width='40' height='36' rx='4' fill='none' stroke='%2385a3ff' stroke-width='2'/><path d='M12 24h40M22 34h6M34 34h6M22 44h6M34 44h6' stroke='%23c7d8ff' stroke-width='1.5'/></svg>" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
    <style>
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #818cf8; --border: #334155; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 80px; }
      header { margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%); display: grid; place-items: center; font-size: 22px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
      .row label { font-size: 13px; color: var(--muted); }
      input[type="date"] { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
      .result { font-size: 20px; font-weight: 700; color: var(--accent); margin-top: 12px; }
      .footer-links { text-align: center; margin: 16px 0; font-size: 14px; }
      .footer-links a { color: var(--accent); text-decoration: none; }
      #tool-share-block { text-align: center; margin: 8px 0; font-size: 13px; }
      .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-badge">📅</div>
          <div>
            <h1>날짜 차이 · 며칠째 · D-day</h1>
            <p class="sub">두 날짜 차이, 기념일 며칠째, 목표일까지 남은 날 계산</p>
          </div>
        </div>
      </header>

      <div class="panel">
        <h3>날짜 차이 (두 날짜 사이 며칠)</h3>
        <div class="row">
          <label>시작일 <input type="date" id="diffStart" /></label>
          <label>종료일 <input type="date" id="diffEnd" /></label>
        </div>
        <div class="result" id="diffResult"></div>
      </div>

      <div class="panel">
        <h3>며칠째 (시작일로부터 오늘은 며칠째)</h3>
        <div class="row">
          <label>시작일 <input type="date" id="nthStart" /></label>
        </div>
        <div class="result" id="nthResult"></div>
      </div>

      <div class="panel">
        <h3>D-day (목표일까지 며칠 남았는지)</h3>
        <div class="row">
          <label>목표일 <input type="date" id="ddayTarget" /></label>
        </div>
        <div class="result" id="ddayResult"></div>
      </div>

      <p style="font-size:13px;color:var(--muted);">같은 도메인 <a href="https://funnyfunny.cloud/tools/day/" style="color:var(--accent);">D-day 계산기</a>에서 목표일 관리·알림·공유 이미지도 이용할 수 있어요.</p>
    </div>

    <div style="text-align:center;margin:16px 0;">
      <ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="footer-links">
      <a href="https://funnyfunny.cloud/guide/datecalc-how/">사용 가이드</a> · <a href="https://funnyfunny.cloud/tools/day/">D-day 계산기</a> · <a href="https://funnyfunny.cloud/">다른 서비스</a>
    </div>
    <div id="tool-share-block">
      <button type="button" id="btnShare" class="btn">링크 복사</button>
      <span id="tool-share-toast" style="display:none;margin-left:8px;color:#94a3b8;"></span>
    </div>

    <script>
      (function(){
        function toDate(str) {
          if (!str) return null;
          var d = new Date(str + "T12:00:00");
          return isNaN(d.getTime()) ? null : d;
        }
        function dateDiff(a, b) {
          var t = (b.getTime() - a.getTime()) / (24 * 60 * 60 * 1000);
          return Math.floor(t);
        }
        function todayStr() {
          var d = new Date();
          return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        }

        var diffStart = document.getElementById("diffStart");
        var diffEnd = document.getElementById("diffEnd");
        var diffResult = document.getElementById("diffResult");
        var nthStart = document.getElementById("nthStart");
        var nthResult = document.getElementById("nthResult");
        var ddayTarget = document.getElementById("ddayTarget");
        var ddayResult = document.getElementById("ddayResult");
        var btnShare = document.getElementById("btnShare");
        var shareToast = document.getElementById("tool-share-toast");

        diffEnd.value = todayStr();

        function updateDiff() {
          var a = toDate(diffStart.value);
          var b = toDate(diffEnd.value);
          if (!a || !b) { diffResult.textContent = ""; return; }
          var n = dateDiff(a, b);
          diffResult.textContent = n >= 0 ? n + "일 차이" : (-n) + "일 차이 (순서 반대)";
        }
        function updateNth() {
          var a = toDate(nthStart.value);
          if (!a) { nthResult.textContent = ""; return; }
          var b = new Date();
          b.setHours(12, 0, 0, 0);
          a.setHours(12, 0, 0, 0);
          var n = dateDiff(a, b);
          if (n < 0) nthResult.textContent = "시작일이 미래예요.";
          else if (n === 0) nthResult.textContent = "오늘은 1일째";
          else nthResult.textContent = "오늘은 " + (n + 1) + "일째";
        }
        function updateDday() {
          var t = toDate(ddayTarget.value);
          if (!t) { ddayResult.textContent = ""; return; }
          var now = new Date();
          now.setHours(12, 0, 0, 0);
          t.setHours(12, 0, 0, 0);
          var n = dateDiff(now, t);
          if (n > 0) ddayResult.textContent = "D-" + n;
          else if (n === 0) ddayResult.textContent = "D-Day";
          else ddayResult.textContent = "D+" + (-n) + " (지남)";
        }

        diffStart.addEventListener("change", updateDiff);
        diffEnd.addEventListener("change", updateDiff);
        nthStart.addEventListener("change", updateNth);
        ddayTarget.addEventListener("change", updateDday);

        setInterval(function(){ updateNth(); updateDday(); }, 60000);

        btnShare.addEventListener("click", function(){
          if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ shareToast.textContent = "복사했어요"; shareToast.style.display = "inline"; setTimeout(function(){ shareToast.style.display = "none"; }, 1500); });
          try { if (window.amplitude) window.amplitude.track("share_click", { method: "copy", tool: "datecalc" }); } catch(e){}
        });

        updateDiff();
        updateNth();
        updateDday();
      })();
    </script>
  </body>
</html>
