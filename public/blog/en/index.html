<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Reader Man</title>
  <meta name="google-adsense-account" content="ca-pub-1204894220949193">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
  <link rel="alternate" hreflang="ko" href="https://funnyfunny.cloud/blog/">
  <link rel="alternate" hreflang="en" href="https://funnyfunny.cloud/blog/en/">
</head>
<body>
  <header class="blog-header">
    <div class="blog-header-inner header-row">
      <a href="./">News Reader Man</a>
      <a class="lang-toggle" href="/blog/">KO</a>
    </div>
  </header>
  <main class="blog-main">
    <div id="list-view">
      <p id="list-heading" style="font-size:1rem;margin-bottom:1.25rem;color:var(--muted);">Breaking down today's issues and life tips for you</p>
      <nav class="list-toolbar" aria-label="Search">
        <div class="search-wrap" role="search">
          <label for="list-search">Search</label>
          <input type="search" id="list-search" placeholder="Search…" aria-label="Search" autocomplete="off">
        </div>
        <div>
          <label for="list-category">Category</label>
          <select id="list-category" aria-label="All Categories">
            <option value="">All Categories</option>
          </select>
        </div>
      </nav>
      <div id="search-results" class="search-results" style="display:none;">
        <h3 id="search-results-heading">Search Results</h3>
        <p id="search-results-live" aria-live="polite" class="list-view" style="margin:0 0 .5rem;font-size:.875rem;color:var(--muted);"></p>
        <ul id="search-results-list"></ul>
      </div>
      <ul class="article-list" id="article-list" aria-label="News Reader Man">

      </ul>
      <div class="list-pagination-wrap">
        <nav id="list-pagination" class="list-pagination" aria-label="Page"></nav>
      </div>
      <p id="list-loading" style="display:block;">Loading articles…</p>
      <div class="ad-wrap">
        <div class="ad-label">Ad</div>
        <ins class="adsbygoogle"
          style="display:block"
          data-ad-client="ca-pub-1204894220949193"
          data-ad-slot="7300458753"
          data-ad-format="auto"
          data-full-width-responsive="true"></ins>
      </div>
    </div>
  </main>
  <footer class="blog-footer">© News Reader Man</footer>
  <script>
(function() {
  const DATA = 'data/';
  const PER_PAGE = 100;
  const LANG = 'en';
  const DATE_LOCALE = LANG === 'en' ? 'en-US' : 'ko-KR';
  const TXT = {
    prev: LANG === 'en' ? '‹ Prev' : '‹ 이전',
    next: LANG === 'en' ? 'Next ›' : '다음 ›',
    other: LANG === 'en' ? 'Others' : '기타',
    loadError: LANG === 'en' ? 'Failed to load data.' : '데이터를 불러올 수 없습니다.',
    loading: LANG === 'en' ? 'Loading…' : '목록 불러오는 중…',
    listError: LANG === 'en' ? 'Failed to load list.' : '목록을 불러올 수 없습니다.',
    results: LANG === 'en' ? ' results found' : '건',
    noResults: LANG === 'en' ? 'No results' : '검색 결과 없음',
    resultsPrefix: LANG === 'en' ? '' : '검색 결과 '
  };
  let manifest = null;
  let allItems = [];
  let currentPage = 0;

  (function() {
    var el = document.getElementById('article-list');
    if (el) el.addEventListener('error', function(e) {
      if (e.target.tagName === 'IMG' && e.target.closest('.list-thumb')) {
        e.target.style.display = 'none';
        var s = e.target.previousElementSibling;
        if (s && s.classList.contains('no-thumb')) s.style.display = 'block';
      }
    }, true);
  })();

  function esc(s) {
    if (s == null) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function thumbImgHtml(src) {
    if (!src) return '<div class="list-thumb"><span class="no-thumb"></span></div>';
    return '<div class="list-thumb"><span class="no-thumb" style="display:none"></span><img src="' + esc(src) + '" alt="" loading="lazy"></div>';
  }

  function firstImageSrcFromBodyHtml(bodyHtml) {
    if (!bodyHtml) return '';
    var html = String(bodyHtml);
    // bodyHtml에서 src가 있는 첫 번째 <img>의 src만 추출해서 폴백으로 사용한다.
    var m = html.match(/<img[^>]*\bsrc=["']([^"']+)["'][^>]*>/i);
    return m && m[1] ? m[1] : '';
  }

  function renderListItem(item) {
    var date = item.createdAt ? new Date(item.createdAt).toLocaleDateString(DATE_LOCALE, { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    var excerpt = (item.metaDescription || '').slice(0, 140) + (item.metaDescription && item.metaDescription.length > 140 ? '…' : '');
    var pub = item.sourcePublisher ? ' · ' + esc(item.sourcePublisher) : '';
    var cat = esc(item.categoryName || TXT.other);
    var thumbSrc = item.sourceImage || firstImageSrcFromBodyHtml(item.bodyHtml);
    var thumb = thumbImgHtml(thumbSrc);
    return '<li data-category="' + cat + '"><a href="news/?id=' + encodeURIComponent(item.id) + '">' + thumb + '<div class="list-body"><div class="title">' + esc(item.title) + '</div><div class="meta">' + esc(date) + pub + '</div><div class="excerpt">' + esc(excerpt) + '</div></div></a></li>';
  }

  async function loadChunk(index) {
    var file = manifest.chunks[index].file;
    var res = await fetch(DATA + file);
    if (!res.ok) throw new Error('Chunk load failed');
    return res.json();
  }

  function buildPagination() {
    var nav = document.getElementById('list-pagination');
    var wrap = nav && nav.closest('.list-pagination-wrap');
    if (!nav || !manifest || manifest.chunks.length <= 1) {
      if (nav) nav.innerHTML = '';
      if (wrap) wrap.style.display = 'none';
      return;
    }
    if (wrap) wrap.style.display = 'block';
    var total = manifest.chunks.length;
    var html = '';
    if (currentPage > 0) {
      html += '<a href="#" data-page="' + (currentPage - 1) + '">' + TXT.prev + '</a>';
    }
    var from = Math.max(0, currentPage - 2);
    var to = Math.min(total, currentPage + 3);
    if (from > 0) html += '<span class="gap" aria-hidden="true">…</span>';
    for (var i = from; i < to; i++) {
      if (i === currentPage) {
        html += '<span class="current" aria-current="page">' + (i + 1) + '</span>';
      } else {
        html += '<a href="#" data-page="' + i + '">' + (i + 1) + '</a>';
      }
    }
    if (to < total) html += '<span class="gap" aria-hidden="true">…</span>';
    if (currentPage < total - 1) {
      html += '<a href="#" data-page="' + (currentPage + 1) + '">' + TXT.next + '</a>';
    }
    nav.innerHTML = html;
    nav.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        var p = parseInt(a.getAttribute('data-page'), 10);
        if (!isNaN(p)) showPage(p);
      });
    });
  }

  function showPage(index) {
    if (index < 0 || index >= manifest.chunks.length) return;
    var listEl = document.getElementById('article-list');
    var start = index * PER_PAGE;
    var pageItems = allItems.slice(start, start + PER_PAGE);
    listEl.innerHTML = pageItems.map(function(item) { return renderListItem(item); }).join('');
    currentPage = index;
    buildPagination();
    applyCategoryFilter();
  }

  function applyCategoryFilter() {
    var cat = (document.getElementById('list-category') || {}).value || '';
    var list = document.getElementById('article-list');
    if (!list) return;
    var items = list.querySelectorAll('li');
    items.forEach(function(li) {
      var match = !cat || (li.getAttribute('data-category') || '') === cat;
      li.style.display = match ? '' : 'none';
    });
  }

  async function init() {
    var loadingEl = document.getElementById('list-loading');
    var res = await fetch(DATA + 'manifest.json');
    if (!res.ok) {
      loadingEl.style.display = 'block';
      loadingEl.textContent = TXT.loadError;
      return;
    }
    manifest = await res.json();
    loadingEl.style.display = 'block';
    loadingEl.textContent = TXT.loading;
    try {
      var chunks = await Promise.all(manifest.chunks.map(function(_, i) { return loadChunk(i); }));
      allItems = chunks.reduce(function(acc, arr) { return acc.concat(arr); }, []);
      loadingEl.style.display = 'none';
      showPage(0);
      buildPagination();
    } catch (err) {
      loadingEl.textContent = TXT.listError;
    }
  }

  var searchIndex = null;
  var categoriesData = [];

  function runSearch(q) {
    q = (q || '').trim().toLowerCase();
    var resultsEl = document.getElementById('search-results');
    var listEl = document.getElementById('article-list');
    var headingEl = document.getElementById('list-heading');
    if (!q) {
      if (resultsEl) resultsEl.style.display = 'none';
      if (listEl) listEl.style.display = '';
      if (headingEl) headingEl.setAttribute('aria-hidden', 'false');
    var wrap = document.querySelector('.list-pagination-wrap');
    if (wrap) wrap.style.display = '';
    applyCategoryFilter();
    return;
    }
    var wrap = document.querySelector('.list-pagination-wrap');
    if (wrap) wrap.style.display = 'none';
    if (!searchIndex) return;
    var hits = searchIndex.filter(function(item) {
      return (item.title || '').toLowerCase().indexOf(q) !== -1;
    });
    if (resultsEl) {
      resultsEl.style.display = 'block';
      var list = document.getElementById('search-results-list');
      if (list) {
        list.innerHTML = '';
        hits.slice(0, 50).forEach(function(item) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = 'news/?id=' + encodeURIComponent(item.id);
          a.textContent = item.title;
          li.appendChild(a);
          list.appendChild(li);
        });
      }
      var live = document.getElementById('search-results-live');
      if (live) live.textContent = hits.length ? TXT.resultsPrefix + hits.length + TXT.results : TXT.noResults;
    }
    if (listEl) listEl.style.display = 'none';
    if (headingEl) headingEl.setAttribute('aria-hidden', 'true');
  }

  function initToolbar() {
    fetch(DATA + 'categories.json').then(function(r) { return r.json(); }).then(function(arr) {
      categoriesData = arr || [];
      var sel = document.getElementById('list-category');
      if (!sel) return;
      categoriesData.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    }).catch(function() {});

    var catSel = document.getElementById('list-category');
    if (catSel) catSel.addEventListener('change', applyCategoryFilter);

    var searchInput = document.getElementById('list-search');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        var q = this.value;
        if (q.trim()) {
          if (!searchIndex) {
            fetch(DATA + 'search.json').then(function(r) { return r.json(); }).then(function(data) {
              searchIndex = data || [];
              runSearch(q);
            }).catch(function() {});
          } else {
            runSearch(q);
          }
        } else {
          runSearch('');
        }
      });
    }
  }

  init();
  initToolbar();
  try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(_) {}
})();
  </script>
</body>
</html>
