<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기사 읽어주는 남자</title>
  <meta name="google-adsense-account" content="ca-pub-1204894220949193">
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1204894220949193" crossorigin="anonymous"></script>
</head>
<body>
  <header class="blog-header">
    <div class="blog-header-inner header-row">
      <a href="../">기사 읽어주는 남자</a>
      <a class="lang-toggle" href="/blog/en/news/">EN</a>
    </div>
  </header>
  <main class="blog-main">
    <div id="article-root">
      <p class="comments-loading">목록 불러오는 중…</p>
    </div>
  </main>
  <footer class="blog-footer">© 기사 읽어주는 남자</footer>
  <script>
(function() {
  var DATA = '../data/';
  var LANG = 'ko';
  var SITE_NAME = '기사 읽어주는 남자';
  var BACK_TEXT = LANG === 'en' ? '← Back to list' : '← 목록으로';
  var VIEW_SOURCE = LANG === 'en' ? 'View source' : '원문 보기';
  var COMMENTS_TEXT = LANG === 'en' ? 'Comments' : '댓글';
  var AD_LABEL = LANG === 'en' ? 'Ad' : '광고';
  var NOT_FOUND = LANG === 'en' ? 'Article not found.' : '글을 찾을 수 없습니다.';
  var LOAD_ERROR = LANG === 'en' ? 'Failed to load article.' : '글을 불러올 수 없습니다.';
  var DATE_LOCALE = LANG === 'en' ? 'en-US' : 'ko-KR';
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var root = document.getElementById('article-root');
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  if (!id) {
    location.replace('../');
    return;
  }
  fetch(DATA + 'manifest.json')
    .then(function(r) { return r.json(); })
    .then(function(manifest) {
      var idx = -1;
      for (var i = 0; i < (manifest.chunks || []).length; i++) {
        if (manifest.chunks[i].ids.indexOf(id) !== -1) { idx = i; break; }
      }
      if (idx < 0) throw new Error(NOT_FOUND);
      return fetch(DATA + manifest.chunks[idx].file).then(function(r) { return r.json(); });
    })
    .then(function(items) {
      var item = items.find(function(x) { return x.id === id; });
      if (!item) throw new Error(NOT_FOUND);
      var date = item.createdAt ? new Date(item.createdAt).toLocaleDateString(DATE_LOCALE, { year: 'numeric', month: 'long', day: 'numeric' }) : '';
      var meta = date;
      if (item.sourcePublisher) meta += ' · ' + item.sourcePublisher;
      if (item.sourceUrl) meta += ' · <a href="' + esc(item.sourceUrl) + '" target="_blank" rel="noopener noreferrer">' + VIEW_SOURCE + '</a>';
      document.title = item.title + ' | ' + SITE_NAME;
      root.innerHTML = '<a class="back-link" href="../">' + BACK_TEXT + '</a>' +
        '<div class="ad-wrap article-ad-top"><div class="ad-label">' + AD_LABEL + '</div><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>' +
        '<article class="article-single">' +
        '<h1 class="title">' + esc(item.title) + '</h1>' +
        '<div class="meta">' + meta + '</div>' +
        '<div class="article-body">' + item.bodyHtml + '</div>' +
        '</article>' +
        '<div class="ad-wrap article-ad-bottom"><div class="ad-label">' + AD_LABEL + '</div><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1204894220949193" data-ad-slot="7300458753" data-ad-format="auto" data-full-width-responsive="true"></ins></div>' +
        '<section class="comments-section">' +
        '<h3>' + COMMENTS_TEXT + '</h3>' +
        '<div id="cusdis_thread" data-host="https://cusdis.com" data-app-id="5e64ec13-3f15-49fd-95e6-c998212a5f75" data-page-id="' + esc(item.id) + '" data-page-url="' + location.href + '" data-page-title="' + esc(item.title) + '"></div>' +
        '</section>';
      try {
        (adsbygoogle = window.adsbygoogle || []).push({});
        (adsbygoogle = window.adsbygoogle || []).push({});
      } catch(_) {}
      var cs = document.createElement('script');
      cs.src = 'https://cusdis.com/js/cusdis.es.js';
      cs.async = true;
      cs.defer = true;
      document.body.appendChild(cs);
    })
    .catch(function(err) {
      root.innerHTML = '<p class="comments-error">' + esc(err.message || LOAD_ERROR) + '</p><a class="back-link" href="../">' + BACK_TEXT + '</a>';
    });
})();
  </script>
</body>
</html>
