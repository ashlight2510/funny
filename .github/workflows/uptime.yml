name: Uptime check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check main site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 https://funnyfunny.cloud/)
          if [ "$code" != "200" ]; then
            echo "Uptime check failed: HTTP $code"
            exit 1
          fi
          echo "OK: HTTP $code"
